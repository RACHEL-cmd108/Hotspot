<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1760" role="img" aria-labelledby="title desc">
  <title id="title">Hotspot Monitor 产品模块与业务关系 v3</title>
  <desc id="desc">展示热点发现、事件智能、活动策划、任务中心、效果与学习五个模块。热点、未来事件及二者匹配统一经过事件智能；Event Card 分流进入活动策划或内容任务中心。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#263244"/>
    </marker>
    <marker id="muted-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
    <style>
      svg { background:#ffffff; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
      text { fill:#202b3c; font-weight:400; }
      .title { font-size:34px; font-weight:600; }
      .subtitle { font-size:19px; fill:#667085; }
      .module-title { font-size:25px; font-weight:600; }
      .module-en { font-size:17px; fill:#667085; }
      .node-title { font-size:18px; font-weight:600; }
      .node-detail { font-size:15px; fill:#667085; }
      .mini-detail { font-size:14px; fill:#667085; }
      .edge-label { font-size:16px; font-weight:600; }
      .note { font-size:15px; fill:#667085; }
      .badge-text { font-size:13px; font-weight:600; }
      .module { stroke-width:1.7; }
      .node { fill:#ffffff; stroke-width:1.35; }
      .workbench { fill:#2f80ed; stroke:#2f80ed; }
      .workbench-text { fill:#ffffff; }
      .m1 { fill:#edf6ff; stroke:#70b7ff; }
      .m2 { fill:#eefbf5; stroke:#69c59d; }
      .m3 { fill:#fff5ec; stroke:#f2a36b; }
      .m4 { fill:#fff0f2; stroke:#e98996; }
      .m5 { fill:#f4f1ff; stroke:#9879d8; }
      .foundation { fill:#f6f3ff; stroke:#b5a3e8; }
      .flow { fill:none; stroke:#263244; stroke-width:2.2; marker-end:url(#arrow); }
      .thin-flow { fill:none; stroke:#718096; stroke-width:1.6; marker-end:url(#muted-arrow); }
      .bus { fill:none; stroke:#718096; stroke-width:1.5; }
      .feedback { fill:none; stroke:#718096; stroke-width:1.8; stroke-dasharray:8 7; marker-end:url(#muted-arrow); }
      .support { fill:none; stroke:#718096; stroke-width:1.6; stroke-dasharray:5 5; marker-end:url(#muted-arrow); }
      .ai-badge { fill:#e8f1ff; stroke:#7ba7f7; }
      .human-badge { fill:#fce7f3; stroke:#e879a9; }
      .gate { fill:#fff7ed; stroke:#f2a36b; stroke-width:1.3; }
    </style>
  </defs>

  <rect width="1800" height="1760" fill="#ffffff"/>
  <text x="40" y="48" class="title">Hotspot Monitor｜产品模块与业务关系 v3</text>
  <text x="1760" y="48" text-anchor="end" class="note">实线：主流程与正式交付｜虚线：持续更新、退回与策略反馈</text>
  <text x="40" y="80" class="subtitle">统一事件上下文，分流活动策划与账号内容响应：发现 → 事件 → 策划 / 任务 → 结果学习</text>

  <!-- Workbench -->
  <rect x="260" y="112" width="1280" height="92" rx="20" class="workbench"/>
  <text x="900" y="150" text-anchor="middle" class="module-title workbench-text">热点运营工作台</text>
  <text x="900" y="181" text-anchor="middle" class="node-detail workbench-text">重点事件 · 运营排期 · 活动建议 · 内容任务 · 风险提醒 · 执行异常</text>
  <path d="M900 204 L900 226 M310 226 L1490 226" class="bus"/>
  <path d="M310 226 L310 244" class="thin-flow"/>
  <path d="M890 226 L890 244" class="thin-flow"/>
  <path d="M1490 226 L1490 244" class="thin-flow"/>

  <!-- M1 -->
  <rect x="30" y="255" width="560" height="500" rx="18" class="module m1"/>
  <text x="56" y="292" class="module-title">M1 · 热点发现</text>
  <text x="56" y="320" class="module-en">Hotspot Discovery</text>
  <rect x="442" y="272" width="120" height="30" rx="15" class="human-badge"/>
  <text x="502" y="293" text-anchor="middle" class="badge-text">AI + 人工</text>
  <g class="m1">
    <rect x="58" y="350" width="230" height="112" rx="9" class="node"/>
    <text x="173" y="379" text-anchor="middle" class="node-title">M1.1 热点雷达</text>
    <text x="173" y="407" text-anchor="middle" class="node-detail">发现正在发生的热点</text>
    <text x="173" y="433" text-anchor="middle" class="node-detail">包含不可预测的突发事件</text>

    <rect x="332" y="350" width="230" height="112" rx="9" class="node"/>
    <text x="447" y="379" text-anchor="middle" class="node-title">M1.2 未来事件中心</text>
    <text x="447" y="407" text-anchor="middle" class="node-detail">管理未来事件与运营排期</text>
    <text x="447" y="433" text-anchor="middle" class="node-detail">覆盖发生前、发生中与结果期</text>

    <rect x="105" y="535" width="410" height="162" rx="9" class="node"/>
    <text x="310" y="568" text-anchor="middle" class="node-title">M1.3 信号生成</text>
    <text x="310" y="602" text-anchor="middle" class="node-detail">热点触发：实时热点独立进入</text>
    <text x="310" y="631" text-anchor="middle" class="node-detail">排期触发：窗口到达 / 人工提前启动</text>
    <text x="310" y="660" text-anchor="middle" class="node-detail">匹配触发：未来事件 × 实时热点</text>
  </g>
  <path d="M173 462 L173 500 L245 500 L245 525" class="flow"/>
  <text x="108" y="492" class="note">实时热点</text>
  <path d="M447 462 L447 500 L375 500 L375 525" class="flow"/>
  <text x="400" y="492" class="note">排期 / 窗口 / 人工</text>
  <text x="310" y="520" text-anchor="middle" class="note">两侧同时存在时形成匹配触发</text>

  <!-- M2 -->
  <rect x="620" y="255" width="540" height="500" rx="18" class="module m2"/>
  <text x="646" y="292" class="module-title">M2 · 事件智能</text>
  <text x="646" y="320" class="module-en">Event Intelligence</text>
  <rect x="1012" y="272" width="120" height="30" rx="15" class="human-badge"/>
  <text x="1072" y="293" text-anchor="middle" class="badge-text">AI + 人工</text>
  <g class="m2">
    <rect x="745" y="350" width="290" height="92" rx="9" class="node"/>
    <text x="890" y="380" text-anchor="middle" class="node-title">M2.1 事件核验与形成</text>
    <text x="890" y="407" text-anchor="middle" class="node-detail">去重聚合、事实、证据与置信度</text>
    <text x="890" y="431" text-anchor="middle" class="node-detail">事件边界、风险与人工校正</text>

    <rect x="650" y="535" width="210" height="110" rx="9" class="node"/>
    <text x="755" y="565" text-anchor="middle" class="node-title">M2.2 事件监测</text>
    <text x="755" y="592" text-anchor="middle" class="node-detail">新事实、热度与生命周期</text>
    <text x="755" y="617" text-anchor="middle" class="node-detail">窗口调整、关闭与再激活</text>

    <rect x="920" y="535" width="210" height="110" rx="9" class="node"/>
    <text x="1025" y="565" text-anchor="middle" class="node-title">M2.3 Event Card</text>
    <text x="1025" y="592" text-anchor="middle" class="node-detail">统一事件工作台</text>
    <text x="1025" y="617" text-anchor="middle" class="node-detail">档案、版本与人工确认</text>
  </g>
  <path d="M890 442 L890 485 L1025 485 L1025 525" class="flow"/>
  <text x="920" y="476" class="note">形成 v1</text>
  <path d="M850 442 L850 505 L755 505 L755 525" class="flow"/>
  <text x="774" y="497" class="note">开始跟踪</text>
  <path d="M860 590 L910 590" class="feedback"/>
  <text x="890" y="676" text-anchor="middle" class="note">事件监测持续更新 Event Card v2、v3…</text>
  <path d="M1130 575 L1140 575 L1140 396 L1045 396" class="feedback"/>
  <text x="1050" y="464" class="note">人工纠错</text>

  <!-- M3 -->
  <rect x="1190" y="255" width="580" height="500" rx="18" class="module m3"/>
  <text x="1216" y="292" class="module-title">M3 · 活动策划</text>
  <text x="1216" y="320" class="module-en">Campaign Planning</text>
  <rect x="1618" y="272" width="120" height="30" rx="15" class="human-badge"/>
  <text x="1678" y="293" text-anchor="middle" class="badge-text">AI + 人工</text>
  <g class="m3">
    <rect x="1325" y="350" width="310" height="82" rx="9" class="node"/>
    <text x="1480" y="381" text-anchor="middle" class="node-title">M3.1 受众匹配</text>
    <text x="1480" y="408" text-anchor="middle" class="node-detail">受众漏斗、覆盖范围与进入窗口</text>

    <rect x="1305" y="470" width="350" height="98" rx="9" class="node"/>
    <text x="1480" y="501" text-anchor="middle" class="node-title">M3.2 综合评估</text>
    <text x="1480" y="528" text-anchor="middle" class="node-detail">确认度、目标价值、风险与资源可行性</text>
    <text x="1480" y="552" text-anchor="middle" class="node-detail">形成活动准备建议与生成依据</text>

    <rect x="1325" y="608" width="310" height="90" rx="9" class="node"/>
    <text x="1480" y="640" text-anchor="middle" class="node-title">M3.3 活动草案</text>
    <text x="1480" y="670" text-anchor="middle" class="node-detail">3 套候选 · 人机修改 · 比较 · 导出 / 交接</text>
  </g>
  <path d="M1480 432 L1480 460" class="flow"/>
  <path d="M1480 568 L1480 598" class="flow"/>

  <!-- Main flow between M1 and M2 -->
  <path d="M515 616 L610 616 L610 396 L735 396" class="flow"/>
  <text x="620" y="603" class="edge-label">候选信号</text>
  <path d="M515 650 L630 650 L630 590 L650 590" class="feedback"/>
  <text x="540" y="641" class="note">后续信号</text>

  <!-- M2 branches -->
  <path d="M1130 590 L1175 590 L1175 391 L1315 391" class="flow"/>
  <rect x="1186" y="354" width="210" height="30" rx="15" fill="#ffffff"/>
  <text x="1291" y="376" text-anchor="middle" class="edge-label">M2 → M3：活动策划上下文</text>
  <path d="M1025 645 L1025 810 L565 810 L565 915" class="flow"/>
  <rect x="640" y="778" width="300" height="28" rx="14" fill="#ffffff"/>
  <text x="790" y="799" text-anchor="middle" class="edge-label">M2 → M4：命中内容响应规则</text>
  <text x="1080" y="742" class="note">两个条件同时满足时并行进入 M3 与 M4</text>

  <!-- M4 -->
  <rect x="210" y="825" width="710" height="500" rx="18" class="module m4"/>
  <text x="238" y="863" class="module-title">M4 · 内容响应</text>
  <text x="238" y="891" class="module-en">Content Response</text>
  <g class="m4">
    <rect x="245" y="925" width="290" height="84" rx="9" class="node"/>
    <text x="370" y="956" text-anchor="middle" class="node-title">M4.1 账号匹配</text>
    <text x="390" y="983" text-anchor="middle" class="node-detail">Event × 响应规则 × 账号 / Skill</text>
    <rect x="477" y="937" width="42" height="24" rx="12" class="ai-badge"/>
    <text x="498" y="954" text-anchor="middle" class="badge-text">AI</text>

    <rect x="590" y="925" width="290" height="84" rx="9" class="node"/>
    <text x="715" y="956" text-anchor="middle" class="node-title">M4.2 内容生成</text>
    <text x="735" y="983" text-anchor="middle" class="node-detail">每个账号至少 3 条专属候选</text>
    <rect x="822" y="937" width="42" height="24" rx="12" class="ai-badge"/>
    <text x="843" y="954" text-anchor="middle" class="badge-text">AI</text>

    <rect x="345" y="1055" width="440" height="92" rx="9" class="node"/>
    <text x="530" y="1086" text-anchor="middle" class="node-title">M4.3 审核修订</text>
    <text x="565" y="1113" text-anchor="middle" class="node-detail">规则预检 · 运营选择与调整 · 高风险人工审核</text>
    <rect x="675" y="1067" width="90" height="24" rx="12" class="human-badge"/>
    <text x="720" y="1084" text-anchor="middle" class="badge-text">AI + 人工</text>

    <rect x="345" y="1190" width="440" height="92" rx="9" class="node"/>
    <text x="565" y="1221" text-anchor="middle" class="node-title">M4.4 发布回执</text>
    <text x="565" y="1248" text-anchor="middle" class="node-detail">内部投递 · 人工发布 · URL / 失败原因回填</text>
    <rect x="675" y="1202" width="90" height="24" rx="12" class="human-badge"/>
    <text x="720" y="1219" text-anchor="middle" class="badge-text">系统 + 人工</text>
  </g>
  <path d="M535 967 L580 967" class="flow"/>
  <path d="M735 1009 L735 1030 L565 1030 L565 1045" class="flow"/>
  <path d="M565 1147 L565 1180" class="flow"/>
  <path d="M430 1055 L430 1025 L735 1025 L735 1019" class="feedback"/>
  <text x="495" y="1019" class="note">重新生成 / 修改</text>

  <!-- M5 -->
  <rect x="960" y="825" width="710" height="500" rx="18" class="module m5"/>
  <text x="988" y="863" class="module-title">M5 · 效果与学习</text>
  <text x="988" y="891" class="module-en">Measurement &amp; Learning</text>
  <g class="m5">
    <rect x="1160" y="925" width="310" height="76" rx="9" class="node"/>
    <text x="1315" y="956" text-anchor="middle" class="node-title">M5.1 结果汇总</text>
    <text x="1315" y="982" text-anchor="middle" class="node-detail">发布、传播、账号表现与增长结果</text>

    <rect x="1160" y="1040" width="310" height="76" rx="9" class="node"/>
    <text x="1285" y="1071" text-anchor="middle" class="node-title">M5.2 效果评估</text>
    <text x="1315" y="1097" text-anchor="middle" class="node-detail">目标达成、用户增长与表现比较</text>
    <rect x="1410" y="1051" width="42" height="24" rx="12" class="ai-badge"/>
    <text x="1431" y="1068" text-anchor="middle" class="badge-text">AI</text>

    <rect x="1160" y="1155" width="310" height="76" rx="9" class="node"/>
    <text x="1285" y="1186" text-anchor="middle" class="node-title">M5.3 复盘优化</text>
    <text x="1315" y="1212" text-anchor="middle" class="node-detail">复盘结论、规则与策略优化</text>
    <rect x="1370" y="1166" width="84" height="24" rx="12" class="human-badge"/>
    <text x="1412" y="1183" text-anchor="middle" class="badge-text">AI + 人工</text>
  </g>
  <path d="M1315 1001 L1315 1030" class="flow"/>
  <path d="M1315 1116 L1315 1145" class="flow"/>

  <!-- M4 to M5 -->
  <path d="M785 1236 L940 1236 L940 963 L1150 963" class="flow"/>
  <text x="954" y="1105" text-anchor="middle" class="edge-label" transform="rotate(-90 954 1105)">真实发布与结果</text>

  <!-- M3 activity outcome to M5; external execution is not a system gate -->
  <path d="M1635 653 L1705 653 L1705 945 L1480 945" class="feedback"/>
  <text x="1590" y="933" text-anchor="middle" class="note">活动采用与增长结果（如可获得）</text>

  <!-- Approved learning enters the shared rule center; no ambiguous global feedback bus -->
  <path d="M1315 1231 L1315 1440" class="feedback"/>
  <rect x="1332" y="1355" width="174" height="28" rx="14" fill="#ffffff"/>
  <text x="1419" y="1376" text-anchor="middle" class="edge-label">获批的策略优化建议</text>

  <!-- Shared configuration -->
  <rect x="30" y="1450" width="1740" height="250" rx="18" class="module foundation"/>
  <text x="56" y="1490" class="module-title">共享配置与业务字典</text>
  <text x="350" y="1490" class="note">只保存跨模块必须共用且口径必须一致的定义</text>
  <g class="foundation">
    <rect x="58" y="1530" width="300" height="92" rx="9" class="node"/>
    <text x="208" y="1562" text-anchor="middle" class="node-title">来源与可信等级</text>
    <text x="208" y="1590" text-anchor="middle" class="node-detail">M1、M2</text>
    <rect x="400" y="1530" width="300" height="92" rx="9" class="node"/>
    <text x="550" y="1562" text-anchor="middle" class="node-title">监测与响应规则</text>
    <text x="550" y="1590" text-anchor="middle" class="node-detail">M1、M2、M4</text>
    <rect x="742" y="1530" width="300" height="92" rx="9" class="node"/>
    <text x="892" y="1562" text-anchor="middle" class="node-title">账号与 Content Skill</text>
    <text x="892" y="1590" text-anchor="middle" class="node-detail">M4、M5</text>
    <rect x="1084" y="1530" width="300" height="92" rx="9" class="node"/>
    <text x="1234" y="1562" text-anchor="middle" class="node-title">风险与活动建议规则</text>
    <text x="1234" y="1590" text-anchor="middle" class="node-detail">M1、M2、M3、M4</text>
    <rect x="1426" y="1530" width="316" height="92" rx="9" class="node"/>
    <text x="1584" y="1562" text-anchor="middle" class="node-title">目标、受众与指标口径</text>
    <text x="1584" y="1590" text-anchor="middle" class="node-detail">M3、M5</text>
  </g>
</svg>
