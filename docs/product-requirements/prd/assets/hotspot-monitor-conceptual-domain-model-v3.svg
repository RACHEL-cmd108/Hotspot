<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">Hotspot Monitor 概念实体关系图 v3</title>
  <desc id="desc">业务实体按 M1 到 M5 分区。所有跨模块连接从相邻模块的边缘进出；观察回流位于顶部，策略反馈位于底部。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#344054"/></marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#667085"/></marker>
    <style>
      .bg { fill: #fff; } .title { font:700 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#101828; } .sub { font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#667085; }
      .zone { rx:20; stroke-width:2; } .zone-title { font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; } .zone-note { font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#667085; }
      .node { rx:13; stroke-width:2; } .id { font:700 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#475467; } .name { font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#101828; } .detail { font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#475467; }
      .edge { fill:none; stroke:#344054; stroke-width:2.3; marker-end:url(#arrow); } .optional { fill:none; stroke:#475467; stroke-width:2.3; stroke-dasharray:8 6; marker-end:url(#arrow); } .feedback { fill:none; stroke:#667085; stroke-width:2.3; stroke-dasharray:9 7; marker-end:url(#feedback-arrow); } .label { font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#344054; } .legend { font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#667085; }
    </style>
  </defs>
  <rect class="bg" width="1680" height="1180"/>
  <text class="title" x="44" y="54">Hotspot Monitor｜概念实体关系图（v3）</text>
  <text class="sub" x="44" y="83">实体卡片是系统要保持一致的业务对象；模块色块只表示对象主要归属，不代表箭头可以跳过业务步骤。</text>
  <line x1="1165" y1="71" x2="1210" y2="71" class="edge"/><text class="legend" x="1223" y="76">必经关系</text>
  <line x1="1330" y1="71" x2="1375" y2="71" class="optional"/><text class="legend" x="1388" y="76">可选关系</text>
  <line x1="1490" y1="71" x2="1535" y2="71" class="feedback"/><text class="legend" x="1548" y="76">回流/反馈</text>

  <!-- capability ownership zones -->
  <rect class="zone" x="30" y="128" width="290" height="765" fill="#eff8ff" stroke="#84caff"/><text class="zone-title" x="52" y="163" fill="#175cd3">M1 热点发现</text><text class="zone-note" x="52" y="186">变化 → 事件候选</text>
  <rect class="zone" x="350" y="128" width="360" height="765" fill="#fff6ed" stroke="#fdb022"/><text class="zone-title" x="372" y="163" fill="#b54708">M2 事件智能</text><text class="zone-note" x="372" y="186">共享 Event 档案</text>
  <rect class="zone" x="740" y="128" width="230" height="765" fill="#f0fdf4" stroke="#86efac"/><text class="zone-title" x="762" y="163" fill="#15803d">M3 机会决策</text><text class="zone-note" x="762" y="186">值得参与吗？</text>
  <rect class="zone" x="1000" y="128" width="340" height="765" fill="#fdf2fa" stroke="#f9a8d4"/><text class="zone-title" x="1022" y="163" fill="#be185d">M4 任务中心</text><text class="zone-note" x="1022" y="186">草稿、任务与回执</text>
  <rect class="zone" x="1370" y="128" width="280" height="765" fill="#f5f3ff" stroke="#c4b5fd"/><text class="zone-title" x="1392" y="163" fill="#6d28d9">M5 效果与学习</text><text class="zone-note" x="1392" y="186">结果与策略建议</text>

  <!-- M1 -->
  <rect class="node" x="60" y="255" width="230" height="92" fill="#fff" stroke="#84caff"/><text class="id" x="80" y="282">CE-01</text><text class="name" x="80" y="308">监测范围</text><text class="detail" x="80" y="330">主题、地区、来源与规则</text>
  <rect class="node" x="60" y="395" width="230" height="92" fill="#fff" stroke="#84caff"/><text class="id" x="80" y="422">CE-02</text><text class="name" x="80" y="448">Signal 信号</text><text class="detail" x="80" y="470">外部或内部原始变化</text>
  <rect class="node" x="60" y="535" width="230" height="92" fill="#fff" stroke="#84caff"/><text class="id" x="80" y="562">CE-03</text><text class="name" x="80" y="588">Future Event</text><text class="detail" x="80" y="610">未来事件、预案与节点</text>
  <rect class="node" x="60" y="735" width="230" height="104" fill="#fff" stroke="#84caff"/><text class="id" x="80" y="762">CE-04</text><text class="name" x="80" y="788">Candidate Event</text><text class="detail" x="80" y="812">等待聚合与核验的事件候选</text>

  <!-- M2 -->
  <rect class="node" x="385" y="255" width="290" height="105" fill="#fff" stroke="#fdb022"/><text class="id" x="406" y="283">CE-05 · 共享根对象</text><text class="name" x="406" y="310">Event 事件</text><text class="detail" x="406" y="334">现实或未来事件；跨团队共享</text>
  <rect class="node" x="385" y="455" width="135" height="105" fill="#fff" stroke="#fdb022"/><text class="id" x="404" y="482">CE-06</text><text class="name" x="404" y="509">事实与证据</text><text class="detail" x="404" y="533">主张、来源、置信度</text>
  <rect class="node" x="540" y="455" width="135" height="105" fill="#fff" stroke="#fdb022"/><text class="id" x="559" y="482">CE-07</text><text class="name" x="559" y="509">实体关系</text><text class="detail" x="559" y="533">人、组织、地点</text>
  <rect class="node" x="385" y="685" width="290" height="112" fill="#fff" stroke="#fdb022"/><text class="id" x="406" y="713">CE-08 · Event 的版本化档案</text><text class="name" x="406" y="741">Event Card 事件卡</text><text class="detail" x="406" y="765">事实、关系、热度、风险、窗口与版本</text>

  <!-- M3 -->
  <rect class="node" x="765" y="460" width="180" height="122" fill="#fff" stroke="#86efac"/><text class="id" x="784" y="487">CE-09</text><text class="name" x="784" y="514">Opportunity</text><text class="name" x="784" y="538">Card 机会卡</text><text class="detail" x="784" y="562">价值、风险、资源与决定</text>

  <!-- M4 -->
  <rect class="node" x="1035" y="255" width="270" height="105" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1056" y="283">CE-10</text><text class="name" x="1056" y="310">Task Plan 任务方案</text><text class="detail" x="1056" y="334">目标、策略、渠道、窗口与风险边界</text>
  <rect class="node" x="1035" y="445" width="270" height="105" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1056" y="473">CE-11 · 可选交付物</text><text class="name" x="1056" y="500">Review Draft 审核草稿</text><text class="detail" x="1056" y="524">预检、人工审核与修订</text>
  <rect class="node" x="1035" y="640" width="270" height="105" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1056" y="668">CE-12</text><text class="name" x="1056" y="695">Action Task 行动任务</text><text class="detail" x="1056" y="719">责任人或外部专业系统承接</text>
  <rect class="node" x="1035" y="785" width="270" height="54" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1056" y="817">CE-13</text><text class="name" x="1122" y="817">Task Receipt 任务回执</text>

  <!-- M5 -->
  <rect class="node" x="1405" y="460" width="210" height="105" fill="#fff" stroke="#c4b5fd"/><text class="id" x="1426" y="488">CE-14</text><text class="name" x="1426" y="515">Outcome 结果</text><text class="detail" x="1426" y="539">传播、产品、成本与风险</text>
  <rect class="node" x="1405" y="685" width="210" height="105" fill="#fff" stroke="#c4b5fd"/><text class="id" x="1426" y="713">CE-15</text><text class="name" x="1426" y="740">策略建议</text><text class="detail" x="1426" y="764">复盘后的规则与模板优化</text>

  <!-- internal M1 relations -->
  <path class="edge" d="M175 347 V395"/><text class="label" x="187" y="376">监测到</text>
  <path class="edge" d="M175 487 V735"/><text class="label" x="187" y="670">形成</text>
  <path class="optional" d="M290 581 H305 V787 H290"/><text class="label" x="74" y="685">预案触发 / 实时匹配</text>

  <!-- local boundary-to-boundary cross-module relations -->
  <path class="edge" d="M290 787 H335 V307 H385"/><text class="label" x="300" y="765">形成或并入</text>
  <path class="edge" d="M385 307 H365 V741 H385"/><text class="label" x="372" y="650">版本化沉淀</text>
  <path class="edge" d="M452 560 V640 H470 V685"/><text class="label" x="475" y="623">支撑</text>
  <path class="edge" d="M608 560 V620 H675 V741"/><text class="label" x="617" y="605">补充</text>
  <path class="edge" d="M675 741 H725 V521 H765"/><text class="label" x="682" y="721">决策输入</text>
  <path class="edge" d="M945 521 H985 V307 H1035"/><text class="label" x="951" y="501">选定参与后</text>

  <!-- local M4 and M5 relations -->
  <path class="optional" d="M1170 360 V445"/><text class="label" x="1183" y="409">内容型任务生成草稿</text>
  <path class="edge" d="M1305 307 H1320 V692 H1305"/><text class="label" x="1216" y="620">拆解为 1..n 行动任务</text>
  <path class="optional" d="M1170 550 V640"/><text class="label" x="1183" y="600">审核通过后作为交付物</text>
  <path class="edge" d="M1170 745 V785"/><text class="label" x="1183" y="773">接收 / 进度 / 异常</text>
  <path class="edge" d="M1305 692 H1355 V512 H1405"/><text class="label" x="1309" y="672">行动结果直接关联</text>
  <path class="edge" d="M1510 565 V685"/><text class="label" x="1522" y="630">复盘形成</text>

  <!-- feedback rails: intentionally outside entity areas -->
  <path class="feedback" d="M855 460 V222 H530 V255"/><text class="label" x="677" y="213">观察：返回 Event 继续监测</text>
  <path class="feedback" d="M1510 790 V920 H175 V839"/>
  <path class="feedback" d="M1510 920 H855 V582"/>
  <path class="feedback" d="M1510 920 H1325 V307 H1305"/>
  <text class="label" x="580" y="947">策略反馈轨：优化监测规则、机会判断标准与任务模板</text>

  <!-- shared business dictionary -->
  <rect class="zone" x="30" y="983" width="1620" height="150" fill="#f8fafc" stroke="#d0d5dd"/>
  <text class="zone-title" x="52" y="1018" fill="#344054">共享配置与业务字典（FR-26）</text><text class="zone-note" x="52" y="1040">这些是跨模块引用的统一口径，不是主流程节点。</text>
  <rect class="node" x="52" y="1062" width="250" height="48" fill="#fff" stroke="#d0d5dd"/><text class="name" x="73" y="1094">来源可信等级</text>
  <rect class="node" x="322" y="1062" width="250" height="48" fill="#fff" stroke="#d0d5dd"/><text class="name" x="343" y="1094">平台与渠道</text>
  <rect class="node" x="592" y="1062" width="250" height="48" fill="#fff" stroke="#d0d5dd"/><text class="name" x="613" y="1094">受众</text>
  <rect class="node" x="862" y="1062" width="250" height="48" fill="#fff" stroke="#d0d5dd"/><text class="name" x="883" y="1094">风险政策</text>
  <rect class="node" x="1132" y="1062" width="300" height="48" fill="#fff" stroke="#d0d5dd"/><text class="name" x="1153" y="1094">目标与指标口径</text>
  <text class="zone-note" x="1460" y="1084">历史事件与结果保留当时口径，</text><text class="zone-note" x="1460" y="1105">字典调整不回写历史。</text>
</svg>
