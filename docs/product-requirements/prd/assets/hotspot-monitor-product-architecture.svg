<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc">
<title id="title">Hotspot Monitor 产品模块与业务关系</title>
<desc id="desc">展示热点发现、事件智能、机会决策、行动中心、效果与学习，以及外部执行系统和共享配置之间的关系。</desc>
<style>
  svg { background: #ffffff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  text { fill: #1f2937; font-weight: 400; }
  .title { font-size: 34px; font-weight: 600; }
  .subtitle { font-size: 20px; fill: #667085; }
  .module-title { font-size: 25px; font-weight: 600; }
  .module-en { font-size: 18px; fill: #667085; }
  .node-title { font-size: 19px; font-weight: 600; }
  .node-detail { font-size: 17px; fill: #667085; }
  .edge-label { font-size: 17px; font-weight: 600; }
  .note { font-size: 17px; fill: #667085; }
  .module { stroke-width: 1.6; }
  .node { fill: #ffffff; stroke-width: 1.2; }
  .workbench { fill: #2f80ed; stroke: #2f80ed; }
  .workbench-text { fill: #ffffff; }
  .m1 { fill: #edf6ff; stroke: #70b7ff; }
  .m2 { fill: #eefbf5; stroke: #69c59d; }
  .m3 { fill: #fff5ec; stroke: #f2a36b; }
  .m4 { fill: #fff0f2; stroke: #e98996; }
  .m5 { fill: #f4f1ff; stroke: #9879d8; }
  .external { fill: #f3f4f6; stroke: #cfd3da; }
  .foundation { fill: #f6f3ff; stroke: #b5a3e8; }
  .flow { fill: none; stroke: #1f2937; stroke-width: 2.2; marker-end: url(#hm-v2-arrow); }
  .thin-flow { fill: none; stroke: #667085; stroke-width: 1.6; marker-end: url(#hm-v2-muted-arrow); }
  .bus { fill: none; stroke: #667085; stroke-width: 1.5; }
  .feedback { fill: none; stroke: #667085; stroke-width: 1.8; stroke-dasharray: 8 7; marker-end: url(#hm-v2-muted-arrow); }
  .support { fill: none; stroke: #667085; stroke-width: 1.6; stroke-dasharray: 5 5; marker-end: url(#hm-v2-muted-arrow); }
</style>
    <defs>
      <marker id="hm-v2-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"></path>
      </marker>
      <marker id="hm-v2-muted-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,5 L0,10 z" fill="#667085"></path>
      </marker>
    </defs>

    <text x="40" y="48" class="title">Hotspot Monitor｜产品模块与业务关系</text>
    <text x="1760" y="48" text-anchor="end" class="note">实线：必经主流程与正式交付｜虚线：持续更新、状态回流、反馈与共享支撑</text>
    <text x="40" y="80" class="subtitle">当前产品实例按单一业务产品完成配置；主链路：发现 → 事件 → 机会 → 行动 → 结果学习</text>

    <!-- Workbench -->
    <rect x="260" y="112" width="1280" height="92" rx="20" class="workbench"></rect>
    <text x="900" y="150" text-anchor="middle" class="module-title workbench-text">热点运营工作台</text>
    <text x="900" y="181" text-anchor="middle" class="node-detail workbench-text">重点事件 · 待办任务 · 风险提醒 · 响应窗口 · 行动进度 · 执行异常</text>
    <path d="M900 204 L900 226 M310 226 L1490 226" class="bus"></path>
    <path d="M310 226 L310 244" class="thin-flow"></path>
    <path d="M890 226 L890 244" class="thin-flow"></path>
    <path d="M1490 226 L1490 244" class="thin-flow"></path>

    <!-- M1 -->
    <rect x="30" y="255" width="560" height="500" rx="18" class="module m1"></rect>
    <text x="56" y="292" class="module-title">M1 · 热点发现</text>
    <text x="56" y="320" class="module-en">Hotspot Discovery</text>
    <g class="m1">
      <rect x="58" y="350" width="230" height="112" rx="9" class="node"></rect>
      <text x="173" y="379" text-anchor="middle" class="node-title">M1.1 热点雷达</text>
      <text x="173" y="407" text-anchor="middle" class="node-detail">发现正在发生的热点</text>
      <text x="173" y="433" text-anchor="middle" class="node-detail">包含不可预测的突发事件</text>

      <rect x="332" y="350" width="230" height="112" rx="9" class="node"></rect>
      <text x="447" y="379" text-anchor="middle" class="node-title">M1.2 未来事件中心</text>
      <text x="447" y="407" text-anchor="middle" class="node-detail">储备未来事件与准备节点</text>
      <text x="447" y="433" text-anchor="middle" class="node-detail">覆盖发生前、发生中与结果期</text>

      <rect x="115" y="545" width="390" height="150" rx="9" class="node"></rect>
      <text x="310" y="577" text-anchor="middle" class="node-title">M1.3 事件触发与候选匹配</text>
      <text x="310" y="608" text-anchor="middle" class="node-detail">预案触发：未来事件独立启动</text>
      <text x="310" y="635" text-anchor="middle" class="node-detail">新事件触发：突发热点独立进入</text>
      <text x="310" y="662" text-anchor="middle" class="node-detail">匹配触发：未来事件 × 实时信号</text>
    </g>
    <path d="M173 462 L173 500 L245 500 L245 535" class="flow"></path>
    <text x="112" y="492" class="note">实时信号</text>
    <path d="M447 462 L447 500 L375 500 L375 535" class="flow"></path>
    <text x="402" y="492" class="note">时间 / 条件 / 人工</text>
    <text x="310" y="526" text-anchor="middle" class="note">双侧输入同时存在时形成候选匹配</text>

    <!-- M2 -->
    <rect x="620" y="255" width="540" height="500" rx="18" class="module m2"></rect>
    <text x="646" y="292" class="module-title">M2 · 事件智能</text>
    <text x="646" y="320" class="module-en">Event Intelligence</text>
    <g class="m2">
      <rect x="745" y="350" width="290" height="92" rx="9" class="node"></rect>
      <text x="890" y="380" text-anchor="middle" class="node-title">M2.1 事件形成与核验</text>
      <text x="890" y="407" text-anchor="middle" class="node-detail">去重聚合、身份关系与人工校正</text>
      <text x="890" y="431" text-anchor="middle" class="node-detail">人物、事实、证据与置信度</text>

      <rect x="660" y="535" width="220" height="110" rx="9" class="node"></rect>
      <text x="770" y="565" text-anchor="middle" class="node-title">M2.2 事件监测与演化</text>
      <text x="770" y="592" text-anchor="middle" class="node-detail">已形成事件的新事实、热度与生命周期</text>
      <text x="770" y="617" text-anchor="middle" class="node-detail">窗口调整、关闭与再激活</text>

      <rect x="900" y="535" width="220" height="110" rx="9" class="node"></rect>
      <text x="1010" y="565" text-anchor="middle" class="node-title">M2.3 Event Card</text>
      <text x="1010" y="592" text-anchor="middle" class="node-detail">事件工作台</text>
      <text x="1010" y="617" text-anchor="middle" class="node-detail">统一档案、版本与人工确认</text>
    </g>
    <path d="M890 442 L890 485 L1010 485 L1010 525" class="flow"></path>
    <text x="920" y="476" class="note">生成 v1</text>
    <path d="M850 442 L850 505 L770 505 L770 525" class="flow"></path>
    <text x="774" y="497" class="note">开始跟踪</text>
    <path d="M770 645 L770 690 L1010 690 L1010 655" class="feedback"></path>
    <text x="890" y="683" text-anchor="middle" class="note">持续更新 v2、v3…</text>
    <path d="M1120 575 L1140 575 L1140 396 L1045 396" class="feedback"></path>
    <text x="1050" y="464" class="note">人工纠错</text>

    <!-- M3 -->
    <rect x="1190" y="255" width="580" height="500" rx="18" class="module m3"></rect>
    <text x="1216" y="292" class="module-title">M3 · 机会决策</text>
    <text x="1216" y="320" class="module-en">Opportunity Decision</text>
    <g class="m3">
      <rect x="1325" y="350" width="310" height="82" rx="9" class="node"></rect>
      <text x="1480" y="381" text-anchor="middle" class="node-title">M3.1 平台与受众机会分析</text>
      <text x="1480" y="408" text-anchor="middle" class="node-detail">受众重合、平台机会与进入窗口</text>

      <rect x="1305" y="480" width="350" height="98" rx="9" class="node"></rect>
      <text x="1480" y="511" text-anchor="middle" class="node-title">M3.2 目标价值、风险与资源评估</text>
      <text x="1480" y="538" text-anchor="middle" class="node-detail">潜在目标价值、参与风险</text>
      <text x="1480" y="562" text-anchor="middle" class="node-detail">资源可行性与系统建议</text>

      <rect x="1325" y="630" width="310" height="90" rx="9" class="node"></rect>
      <text x="1480" y="661" text-anchor="middle" class="node-title">M3.3 Opportunity Center</text>
      <text x="1480" y="688" text-anchor="middle" class="node-detail">机会卡片看板、排序与比较</text>
      <text x="1480" y="712" text-anchor="middle" class="node-detail">优先参与 / 参与 / 观察 / 不参与</text>
    </g>
    <path d="M1480 432 L1480 470" class="flow"></path>
    <path d="M1480 578 L1480 620" class="flow"></path>

    <!-- Main flow between top modules -->
    <path d="M505 620 L610 620 L610 387 L750 387" class="flow"></path>
    <text x="620" y="604" class="edge-label">触发通知 / 候选匹配</text>
    <path d="M505 650 L630 650 L630 590 L650 590" class="feedback"></path>
    <text x="542" y="640" class="note">后续信号</text>
    <path d="M1120 590 L1175 590 L1175 391 L1325 391" class="flow"></path>
    <text x="1135" y="577" class="edge-label">Event Card</text>
    <path d="M1325 675 L1190 675 L1190 744 L770 744 L770 655" class="feedback"></path>
    <text x="1000" y="733" class="edge-label">观察：返回事件监测</text>

    <!-- M3 to M4 -->
    <path d="M1480 720 L1480 790 L382 790 L382 915" class="flow"></path>
    <text x="930" y="778" text-anchor="middle" class="edge-label">优先参与 / 参与：选定的机会卡片</text>

    <!-- M4 -->
    <rect x="210" y="825" width="710" height="500" rx="18" class="module m4"></rect>
    <text x="238" y="863" class="module-title">M4 · 行动中心</text>
    <text x="238" y="891" class="module-en">Action Center</text>
    <g class="m4">
      <rect x="252" y="925" width="260" height="72" rx="9" class="node"></rect>
      <text x="382" y="955" text-anchor="middle" class="node-title">M4.1 行动目标与参与策略</text>
      <text x="382" y="981" text-anchor="middle" class="node-detail">行动目标、介入方式与成功标准</text>
      <rect x="618" y="925" width="260" height="72" rx="9" class="node"></rect>
      <text x="748" y="955" text-anchor="middle" class="node-title">M4.2 跨渠道行动编排</text>
      <text x="748" y="981" text-anchor="middle" class="node-detail">渠道角色、顺序、依赖与分支</text>

      <rect x="390" y="1035" width="350" height="78" rx="9" class="node"></rect>
      <text x="565" y="1066" text-anchor="middle" class="node-title">M4.3 统一行动任务包管理</text>
      <text x="565" y="1092" text-anchor="middle" class="node-detail">组装并管理共享上下文与渠道执行包</text>

      <rect x="252" y="1150" width="260" height="72" rx="9" class="node"></rect>
      <text x="382" y="1180" text-anchor="middle" class="node-title">M4.4 执行审核与授权</text>
      <text x="382" y="1206" text-anchor="middle" class="node-detail">事实、风险、资源与版本门禁</text>
      <rect x="618" y="1150" width="260" height="72" rx="9" class="node"></rect>
      <text x="748" y="1180" text-anchor="middle" class="node-title">M4.5 外部执行协调</text>
      <text x="748" y="1206" text-anchor="middle" class="node-detail">任务分发与双向执行协同</text>
    </g>
    <path d="M512 961 L608 961" class="flow"></path>
    <path d="M748 997 L748 1018 L565 1018 L565 1025" class="flow"></path>
    <path d="M565 1113 L565 1135 L382 1135 L382 1140" class="flow"></path>
    <path d="M512 1186 L608 1186" class="flow"></path>
    <path d="M382 1150 L382 1128 L565 1128 L565 1123" class="feedback"></path>
