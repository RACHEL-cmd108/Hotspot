      <rect x="1426" y="1426" width="316" height="64" rx="9" class="node"></rect>
      <text x="1584" y="1453" text-anchor="middle" class="node-title">品牌与风险系统</text>
      <text x="1584" y="1477" text-anchor="middle" class="node-detail">品牌治理与风险处置</text>
    </g>
    <path d="M748 1222 L748 1355" class="flow"></path>
