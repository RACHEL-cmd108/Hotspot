    <!-- M5 -->
    <rect x="960" y="825" width="710" height="500" rx="18" class="module m5"></rect>
    <text x="988" y="863" class="module-title">M5 · 效果与学习</text>
    <text x="988" y="891" class="module-en">Measurement &amp; Learning</text>
    <g class="m5">
      <rect x="1180" y="915" width="270" height="58" rx="9" class="node"></rect>
