      <text x="208" y="1678" text-anchor="middle" class="node-detail">M1、M2</text>
      <rect x="400" y="1622" width="300" height="72" rx="9" class="node"></rect>
      <text x="550" y="1652" text-anchor="middle" class="node-title">平台与渠道定义</text>
      <text x="550" y="1678" text-anchor="middle" class="node-detail">M1、M3、M4、M5</text>
      <rect x="742" y="1622" width="300" height="72" rx="9" class="node"></rect>
      <text x="892" y="1652" text-anchor="middle" class="node-title">受众定义</text>
