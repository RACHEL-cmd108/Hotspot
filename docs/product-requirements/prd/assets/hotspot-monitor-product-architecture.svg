    <text x="1760" y="48" text-anchor="end" class="note">实线：内部主流程｜灰色虚线：反馈回流｜蓝色虚线：外部系统双向协作</text>
    <text x="40" y="80" class="subtitle">当前产品实例按单一业务产品完成配置；主链路：发现 → 事件 → 机会 → 行动 → 结果学习</text>

