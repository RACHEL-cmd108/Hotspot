      <rect x="1000" y="1008" width="260" height="58" rx="9" class="node"></rect>
      <text x="1130" y="1044" text-anchor="middle" class="node-title">M5.2 传播效果追踪</text>
      <rect x="1370" y="1008" width="260" height="58" rx="9" class="node"></rect>
      <text x="1500" y="1044" text-anchor="middle" class="node-title">M5.3 产品结果追踪</text>

      <rect x="1180" y="1100" width="270" height="58" rx="9" class="node"></rect>
      <text x="1315" y="1136" text-anchor="middle" class="node-title">M5.4 成本与结果关联</text>
      <rect x="1180" y="1190" width="270" height="58" rx="9" class="node"></rect>
      <text x="1315" y="1226" text-anchor="middle" class="node-title">M5.5 行动复盘</text>
      <rect x="1180" y="1270" width="270" height="42" rx="21" class="node"></rect>
      <text x="1315" y="1298" text-anchor="middle" class="node-title">M5.6 策略优化建议</text>
    </g>
    <path d="M1315 973 L1315 990 L1130 990 L1130 998" class="flow"></path>
    <path d="M1315 973 L1315 990 L1500 990 L1500 998" class="flow"></path>
    <path d="M1130 1066 L1130 1082 L1315 1082 L1315 1090" class="flow"></path>
    <path d="M1500 1066 L1500 1082 L1315 1082 L1315 1090" class="flow"></path>
    <path d="M1315 1158 L1315 1180" class="flow"></path>
    <path d="M1315 1248 L1315 1260" class="flow"></path>

    <!-- Reject branch to review -->
    <path d="M1635 675 L1740 675 L1740 1219 L1450 1219" class="feedback"></path>
    <text x="1645" y="661" class="edge-label">不参与：记录原因</text>

    <!-- Strategy feedback -->
    <path d="M1450 1291 L1735 1291 L1735 782 L70 782" class="bus" style="stroke-dasharray:8 7"></path>
    <path d="M310 782 L310 765" class="feedback"></path>
    <path d="M890 782 L890 765" class="feedback"></path>
    <path d="M1490 782 L1490 765" class="feedback"></path>
    <path d="M960 1291 L920 1291" class="feedback"></path>
    <text x="900" y="812" text-anchor="middle" class="edge-label">结果反馈：优化发现规则、事件判断、机会策略与行动模板</text>

    <!-- External systems -->
    <rect x="30" y="1365" width="1740" height="150" rx="18" class="module external"></rect>
