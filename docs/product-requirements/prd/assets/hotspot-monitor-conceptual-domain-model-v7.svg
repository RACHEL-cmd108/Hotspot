<rect class="node" x="1692" y="1282" width="430" height="64" fill="#fff" stroke="#d0d5dd"/><text class="sdid" x="1712" y="1306">SD-05</text><text class="sdzh" x="1712" y="1331">目标与指标口径</text><text class="sden" x="1880" y="1331">Objective &amp; Metric Definition</text>
