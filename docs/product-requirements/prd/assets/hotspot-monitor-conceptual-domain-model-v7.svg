<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="1430" viewBox="0 0 2180 1430" role="img" aria-labelledby="title desc">
<title id="title">Hotspot Monitor 概念实体关系图 v7</title>
<desc id="desc">模块按实体主要归属分区。实线表示模块内关系，虚线表示跨模块输入、引用与反馈；所有连接均在模块留白或外缘中路由。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#344054"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker><style>
.bg{fill:#fff}.title{font:700 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}.zone{rx:20;stroke-width:2}.zt{font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.ze{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}.node{rx:13;stroke-width:2}.id{font:700 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}.zh{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}.en{font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}.note{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}.pzh{font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#831843}.pen{font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#9d174d}.edge{fill:none;stroke:#344054;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#d)}.rail{fill:none;stroke:#667085;stroke-width:1.8;stroke-dasharray:8 6}.lab{font:500 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}.sdid{font:700 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}.sdzh{font:700 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}.sden{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
</style></defs>
<rect class="bg" width="2180" height="1430"/><text class="title" x="42" y="56">Hotspot Monitor｜概念实体关系图（v7）</text><text class="sub" x="42" y="84">实线：模块内形成 / 维护关系；虚线：跨模块输入、引用或反馈。模块内留白用于路由，连线不穿过实体卡片。</text><line class="edge" x1="1580" y1="75" x2="1620" y2="75"/><text class="sub" x="1632" y="80" style="font-size:13px">模块内关系</text><line class="dash" x1="1780" y1="75" x2="1820" y2="75"/><text class="sub" x="1832" y="80" style="font-size:13px">跨模块关系</text>

<!-- ownership zones -->
<rect class="zone" x="28" y="126" width="330" height="980" fill="#eff8ff" stroke="#84caff"/><text class="zt" x="52" y="164" fill="#175cd3">M1 · 热点发现</text><text class="ze" x="52" y="187">Hotspot Discovery</text>
<rect class="zone" x="386" y="126" width="460" height="980" fill="#fff6ed" stroke="#fdb022"/><text class="zt" x="410" y="164" fill="#b54708">M2 · 事件智能</text><text class="ze" x="410" y="187">Event Intelligence</text>
<rect class="zone" x="874" y="126" width="270" height="980" fill="#f0fdf4" stroke="#86efac"/><text class="zt" x="898" y="164" fill="#15803d">M3 · 机会决策</text><text class="ze" x="898" y="187">Opportunity Decision</text>
<rect class="zone" x="1172" y="126" width="530" height="980" fill="#fdf2fa" stroke="#f9a8d4"/><text class="zt" x="1196" y="164" fill="#be185d">M4 · 任务中心</text><text class="ze" x="1196" y="187">Task Center</text>
<rect class="zone" x="1730" y="126" width="420" height="980" fill="#f5f3ff" stroke="#c4b5fd"/><text class="zt" x="1754" y="164" fill="#6d28d9">M5 · 效果与学习</text><text class="ze" x="1754" y="187">Measurement &amp; Learning</text>

<!-- M1 -->
<rect class="node" x="56" y="300" width="274" height="103" fill="#fff" stroke="#84caff"/><text class="id" x="76" y="328">CE-01</text><text class="zh" x="76" y="356">监测范围</text><text class="en" x="76" y="379">Monitoring Scope</text><text class="note" x="76" y="397">主题、地区、来源、阈值与规则</text>
<rect class="node" x="56" y="500" width="120" height="112" fill="#fff" stroke="#84caff"/><text class="id" x="74" y="527">CE-02</text><text class="zh" x="74" y="556">信号</text><text class="en" x="74" y="579">Signal</text><text class="note" x="74" y="598">原始变化</text>
<rect class="node" x="210" y="500" width="120" height="112" fill="#fff" stroke="#84caff"/><text class="id" x="228" y="527">CE-03</text><text class="zh" x="228" y="556">未来事件</text><text class="en" x="228" y="579">Future Event</text><text class="note" x="228" y="598">预案与节点</text>
<rect class="node" x="56" y="760" width="274" height="116" fill="#fff" stroke="#84caff"/><text class="id" x="76" y="788">CE-04 · M1 输出</text><text class="zh" x="76" y="816">候选事件</text><text class="en" x="76" y="839">Candidate Event</text><text class="note" x="76" y="859">等待聚合、核验与事件化</text>
<path class="edge" d="M140 403V455H116V500"/><text class="lab" x="60" y="447">配置采集</text><path class="edge" d="M246 403V455H270V500"/><text class="lab" x="225" y="447">配置跟踪</text><path class="edge" d="M116 612V690H141V760"/><text class="lab" x="60" y="680">触发 / 补充</text><path class="edge" d="M270 612V690H245V760"/><text class="lab" x="210" y="680">预案触发 / 匹配</text>

<!-- M2: peer entities -->
<rect class="node" x="416" y="300" width="400" height="106" fill="#fff" stroke="#fdb022"/><text class="id" x="438" y="328">CE-05 · 跨模块共享根对象</text><text class="zh" x="438" y="357">事件</text><text class="en" x="438" y="380">Event</text><text class="note" x="438" y="397">现实或未来、可随新证据演化的事件</text>
<rect class="node" x="416" y="510" width="175" height="112" fill="#fff" stroke="#fdb022"/><text class="id" x="438" y="538">CE-06</text><text class="zh" x="438" y="567">事实</text><text class="en" x="438" y="590">Fact</text><text class="note" x="438" y="609">可确认或排除的主张</text>
<rect class="node" x="641" y="510" width="175" height="112" fill="#fff" stroke="#fdb022"/><text class="id" x="663" y="538">CE-07</text><text class="zh" x="663" y="567">证据</text><text class="en" x="663" y="590">Evidence</text><text class="note" x="663" y="609">支撑或反驳事实</text>
<rect class="node" x="416" y="760" width="400" height="142" fill="#fff" stroke="#fdb022"/><text class="id" x="438" y="788">CE-08 · M2 核心产出</text><text class="zh" x="438" y="817">事件卡</text><text class="en" x="438" y="840">Event Card</text><text class="note" x="438" y="863">对 Event 的版本化统一档案，汇集事实、证据、热力、生命周期、窗口与风险</text><text class="note" x="438" y="883">与其他实体并列关联，不构成父子关系。</text>
<path class="dash" d="M330 818H386V353H416"/><path class="edge" d="M503 406V510"/><text class="lab" x="516" y="467">形成 / 更新</text><path class="edge" d="M641 566H591"/><text class="lab" x="592" y="552">支撑 / 反驳</text><path class="edge" d="M503 622V700H535V760"/><text class="lab" x="545" y="689">建档</text><path class="edge" d="M728 622V700H695V760"/><text class="lab" x="700" y="689">引用证据</text>

<!-- M3 -->
<rect class="node" x="898" y="760" width="222" height="142" fill="#fff" stroke="#86efac"/><text class="id" x="920" y="788">CE-09</text><text class="zh" x="920" y="817">机会卡</text><text class="en" x="920" y="840">Opportunity Card</text><text class="note" x="920" y="863">目标、受众、价值、风险、资源</text><text class="note" x="920" y="883">与四档机会决策</text>
<path class="dash" d="M816 831H898"/><text class="lab" x="824" y="814">决策输入</text>

<!-- M4: intentionally given its own space -->
<rect class="node" x="1200" y="300" width="450" height="118" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1222" y="329">CE-10</text><text class="zh" x="1222" y="358">任务方案</text><text class="en" x="1222" y="381">Task Plan</text><text class="note" x="1222" y="401">各渠道参与/作用、资源、窗口、风险边界与成功标准</text>
<path class="dash" d="M1120 831H1158V359H1200"/><text class="lab" x="1130" y="814">机会输入</text>
<rect x="1200" y="480" width="450" height="360" rx="16" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/><text class="id" x="1222" y="510">CE-11 · 抽象父实体</text><text class="pzh" x="1222" y="542">交付物草稿</text><text class="pen" x="1222" y="566">Execution Deliverable Draft</text><text class="note" x="1222" y="590">四类草稿共用版本、预检、审核与修订机制；每类均有独立业务字段。</text>
<rect class="node" x="1222" y="630" width="190" height="82" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1240" y="655">交付物类型</text><text class="zh" x="1240" y="681" style="font-size:16px">社媒内容草稿</text><text class="en" x="1240" y="702" style="font-size:12px">Social Content Draft</text>
<rect class="node" x="1436" y="630" width="190" height="82" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1454" y="655">交付物类型</text><text class="zh" x="1454" y="681" style="font-size:16px">私域触达草稿</text><text class="en" x="1454" y="702" style="font-size:12px">Private Outreach Draft</text>
<rect class="node" x="1222" y="732" width="190" height="82" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1240" y="757">交付物类型</text><text class="zh" x="1240" y="783" style="font-size:16px">活动方案草稿</text><text class="en" x="1240" y="804" style="font-size:12px">Campaign Proposal Draft</text>
<rect class="node" x="1436" y="732" width="190" height="82" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1454" y="757">交付物类型</text><text class="zh" x="1454" y="783" style="font-size:16px">KOL 触达草稿</text><text class="en" x="1454" y="804" style="font-size:12px">KOL Outreach Draft</text>
<path class="edge" d="M1425 418V480"/><text class="lab" x="1437" y="452">生成</text>
<rect class="node" x="1200" y="900" width="205" height="110" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1218" y="930">CE-12</text><text class="zh" x="1218" y="960">行动任务</text><text class="en" x="1218" y="983">Action Task</text><text class="note" x="1218" y="1001">基于可交接草稿的渠道级执行</text>
<rect class="node" x="1445" y="900" width="205" height="110" fill="#fff" stroke="#f9a8d4"/><text class="id" x="1463" y="930">CE-13</text><text class="zh" x="1463" y="960">任务回执</text><text class="en" x="1463" y="983">Task Receipt</text><text class="note" x="1463" y="1001">接收、进度、异常与完成</text>
<path class="edge" d="M1425 840V880H1302V900"/><text class="lab" x="1314" y="869">审核通过后交接</text><path class="edge" d="M1405 955H1445"/><text class="lab" x="1409" y="943">回传</text>

<!-- M5: placed high with room for its feedback relationships -->
<rect class="node" x="1770" y="300" width="340" height="125" fill="#fff" stroke="#c4b5fd"/><text class="id" x="1792" y="329">CE-14</text><text class="zh" x="1792" y="358">结果</text><text class="en" x="1792" y="381">Outcome</text><text class="note" x="1792" y="403">传播、产品、商业、成本与风险结果</text>
<rect class="node" x="1770" y="540" width="340" height="125" fill="#fff" stroke="#c4b5fd"/><text class="id" x="1792" y="569">CE-15 · 跨模块策略对象</text><text class="zh" x="1792" y="598">策略建议</text><text class="en" x="1792" y="621">Strategy Recommendation</text><text class="note" x="1792" y="643">优化发现规则、机会判断与任务模板</text>
<path class="dash" d="M1650 955H1718V362H1770"/><path class="edge" d="M1940 425V540"/><text class="lab" x="1952" y="490">复盘</text>

