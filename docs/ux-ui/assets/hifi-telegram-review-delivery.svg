<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Telegram 内部审核投递</title><desc id="d">Phase 0 社媒内容草稿投递、快捷审核和系统回写状态。</desc><style>.bg{fill:#f6f8fb}.c{fill:#fff;stroke:#d9e0ea}.b{fill:#eaf1ff}.g{fill:#e7f7ef}.a{fill:#fff5df}.r{fill:#ffeded}.t{font:14px system-ui;fill:#667085}.h{font:700 24px system-ui;fill:#18212f}.s{font:700 17px system-ui;fill:#18212f}.btn{fill:#2563eb}.w{fill:#fff}</style><rect class="bg" width="1440" height="900"/><text x="48" y="58" class="h">Telegram 内部审核投递</text><text x="48" y="88" class="t">Phase 0 · 协作出口 · 系统内部为权威来源</text><rect x="48" y="124" width="818" height="724" rx="14" class="c"/><text x="76" y="168" class="s">社媒内容草稿 v3</text><text x="76" y="198" class="t">Event EVT-204 · 响应窗口剩余 18 分钟 · 预检通过</text><rect x="76" y="230" width="762" height="190" rx="12" class="b"/><text x="100" y="270" class="s">监管听证会时间提前，预测市场出现显著波动</text><text x="100" y="310" class="t">依据：Fact 4 条 · Evidence 7 条 · 1 条待确认内容已排除</text><text x="100" y="350" class="t">完整正文、来源与版本差异在系统审核页查看。</text><text x="76" y="468" class="s">内部审核目标</text><rect x="76" y="490" width="762" height="94" rx="10" class="a"/><text x="100" y="527" class="s">Predx 内容运营审核群 · 管理员已批准</text><text x="100" y="558" class="t">仅供内部审核，不构成社媒发布或外部私域触达</text><text x="76" y="630" class="s">Telegram 快捷操作</text><rect x="76" y="654" width="168" height="48" rx="9" class="btn"/><text x="160" y="684" text-anchor="middle" class="s w">通过</text><rect x="260" y="654" width="168" height="48" rx="9" class="c"/><text x="344" y="684" text-anchor="middle" class="s">需修改</text><rect x="444" y="654" width="168" height="48" rx="9" class="c"/><text x="528" y="684" text-anchor="middle" class="s">驳回</text><rect x="628" y="654" width="210" height="48" rx="9" class="c"/><text x="733" y="684" text-anchor="middle" class="s">打开系统复杂审核</text><text x="76" y="756" class="t">快捷结论只有成功回写系统后才生效。</text><rect x="894" y="124" width="498" height="724" rx="14" class="c"/><text x="922" y="168" class="s">投递与回写时间线</text><rect x="922" y="204" width="442" height="102" rx="10" class="g"/><text x="946" y="242" class="t">✓ Bot 已投递 · 10:22</text><text x="946" y="276" class="s">Telegram message #1842</text><rect x="922" y="330" width="442" height="102" rx="10" class="g"/><text x="946" y="368" class="t">✓ 内容运营点击“通过” · 10:25</text><text x="946" y="402" class="s">审核者 Rachel · 范围：草稿 v3</text><rect x="922" y="456" width="442" height="130" rx="10" class="r"/><text x="946" y="494" class="t">! 审核结论尚未回写系统</text><text x="946" y="528" class="s">系统当前仍显示“待审核”，不可交接发布</text><text x="946" y="560" class="s">重试同步 / 打开系统确认 / 升级管理员</text><rect x="922" y="626" width="442" height="108" rx="10" class="a"/><text x="946" y="664" class="t">响应窗口剩余 15 分钟</text><text x="946" y="698" class="s">5 分钟后仍未同步将升级给内容负责人</text></svg>
