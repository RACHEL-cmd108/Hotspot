="190" y="401" class="t">营销｜预测挑战</text><text x="610" y="401" class="s">规划中</text><text x="860" y="401" class="s">活动负责人</text><text x="1080" y="401" class="s">人工更新 16m</text><text x="1280" y="401" class="s">等待素材</text><line x1="74" y1="434" x2="1366" y2="434" class="line"/><rect x="74" y="464" width="88" height="28" rx="14" class="r"/><text x="118" y="483" text-anchor="middle" class="s">异常</text><text x="190" y="483" class="t">KOL｜首封触达 20 人</text><text x="610" y="483" class="s">X 不可用 · 人工降级</text><text x="860" y="483" class="s">渠道负责人</text><text x="1080" y="483" class="s">能力检查失败</text><text x="1280" y="483" class="s">导出/复制</text><line x1="74" y1="516" x2="1366" y2="516" class="line"/><rect x="74" y="546" width="88" height="28" rx="14" class="a"/><text x="118" y="565" text-anchor="middle" class="s">执行中</text><text x="190" y="565" class="t">社媒｜后续解释串</text><text x="610" y="565" class="s">人工声明已发布</text><text x="860" y="565" class="s">内容运营</text><text x="1080" y="565" class="s">等待平台验证</text><text x="1280" y="565" class="s">补帖子链接</text><rect x="74" y="636" width="1292" height="152" rx="12" class="p"/><text x="98" y="674" class="t">回执解释</text><text x="98" y="714" class="s">人工声明、Bot 发送、平台确认和负责人更新是不同来源；每条回执显示主体、时间和可信等级。</text><text x="98" y="752" class="s">超过预期时间仍无回执时标记“回执延迟”，不得自动改为已完成、失败或取消。</text></svg>
