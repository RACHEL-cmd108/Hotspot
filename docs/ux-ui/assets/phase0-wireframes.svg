<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Phase 0 响应闭环线框图</title><desc id="d">内容运营从X趋势到Telegram内部审核结论的关键页面衔接。</desc><style>.bg{fill:#f6f8fb}.frame{fill:#fff;stroke:#95a6bf;stroke-width:2}.bar{fill:#dce5f2}.line{stroke:#b2c0d2;stroke-width:3;fill:none}.blue{fill:#eaf1ff;stroke:#76a4f7}.amber{fill:#fff5df;stroke:#e7b13e}.txt{font:13px system-ui;fill:#596a80}.h{font:700 18px system-ui;fill:#18212f}.s{font:700 14px system-ui;fill:#18212f}</style><rect class="bg" width="1440" height="900"/><text x="48" y="56" class="h">Phase 0：内容运营突发热点快速响应</text><text x="48" y="84" class="txt">这不是系统页面；它用低保真方式说明关键页面与跳转。</text><g><rect x="48" y="138" width="250" height="278" rx="12" class="frame"/><rect x="48" y="138" width="250" height="38" rx="12" class="bar"/><text x="72" y="163" class="s">1. 我的响应台</text><rect x="70" y="196" width="204" height="42" rx="6" class="amber"/><rect x="70" y="252" width="204" height="42" rx="6" class="blue"/><rect x="70" y="308" width="204" height="42" rx="6" class="frame"/><text x="80" y="222" class="txt">响应窗口 / Fact 缺口</text><text x="80" y="278" class="txt">待审核社媒草稿</text><text x="80" y="334" class="txt">Telegram 同步异常</text></g><g><rect x="358" y="138" width="250" height="278" rx="12" class="frame"/><rect x="358" y="138" width="250" height="38" rx="12" class="bar"/><text x="382" y="163" class="s">2. Event 工作区</text><rect x="380" y="196" width="204" height="32" rx="6" class="frame"/><rect x="380" y="240" width="204" height="32" rx="6" class="frame"/><rect x="380" y="284" width="204" height="32" rx="6" class="amber"/><text x="392" y="217" class="txt">Fact：确认 / 待确认</text><text x="392" y="261" class="txt">Evidence：支持 / 质疑</text><text x="392" y="305" class="txt">窗口 / 风险 / 版本</text></g><g><rect x="668" y="138" width="250" height="278" rx="12" class="frame"/><rect x="668" y="138" width="250" height="38" rx="12" class="bar"/><text x="692" y="163" class="s">3. Opportunity / Task Plan</text><rect x="690" y="196" width="204" height="34" rx="6" class="frame"/><rect x="690" y="242" width="204" height="34" rx="6" class="blue"/><rect x="690" y="288" width="204" height="34" rx="6" class="frame"/><text x="702" y="218" class="txt">四档机会决策</text><text x="702" y="264" class="txt">AI 方案 1–3，人工选定</text><text x="702" y="310" class="txt">仅内容发布已启用</text></g><g><rect x="978" y="138" width="250" height="278" rx="12" class="frame"/><rect x="978" y="138" width="250" height="38" rx="12" class="bar"/><text x="1002" y="163" class="s">4. 社媒交付物草稿</text><rect x="1000" y="196" width="204" height="96" rx="6" class="blue"/><rect x="1000" y="306" width="204" height="32" rx="6" class="frame"/><text x="1012" y="222" class="txt">正文 / Fact 引用 / 版本</text><text x="1012" y="254" class="txt">预检：通过 / 阻塞</text><text x="1012" y="327" class="txt">投递内部审核目标</text></g><g><rect x="358" y="530" width="324" height="280" rx="12" class="frame"/><rect x="358" y="530" width="324" height="38" rx="12" class="bar"/><text x="382" y="555" class="s">5. Telegram 内部审核投递</text><rect x="382" y="592" width="276" height="56" rx="6" class="blue"/><rect x="382" y="664" width="84" height="34" rx="6" class="frame"/><rect x="478" y="664" width="84" height="34" rx="6" class="frame"/><rect x="574" y="664" width="84" height="34" rx="6" class="frame"/><text x="394" y="618" class="txt">Bot 投递草稿到内部审核群</text><text x="398" y="686" class="txt">通过</text><text x="486" y="686" class="txt">修改</text><text x="586" y="686" class="txt">驳回</text><text x="382" y="746" class="txt">结论必须回写系统；失败可重试/转入系统。</text></g><g><rect x="758" y="530" width="324" height="280" rx="12" class="frame"/><rect x="758" y="530" width="324" height="38" rx="12" class="bar"/><text x="782" y="555" class="s">6. 审核结论与发布交接</text><rect x="782" y="592" width="276" height="40" rx="6" class="blue"/><rect x="782" y="646" width="276" height="40" rx="6" class="frame"/><rect x="782" y="700" width="276" height="40" rx="6" class="frame"/><text x="794" y="617" class="txt">通过：可创建人工发布交接</text><text x="794" y="671" class="txt">修改：生成新版本并再次审核</text><text x="794" y="725" class="txt">发布：人工声明 / 平台确认分离</text></g><path d="M298 276H358M608 276H668M918 276H978M1103 416V470H520V530M682 670H758" class="line"/><text x="1080" y="454" class="txt">审核投递</text><text x="694" y="504" class="txt">快捷结论或系统复杂审核</text><rect x="48" y="842" width="1344" height="38" rx="8" class="amber"/><text x="72" y="867" class="txt">完整产品另行启用私域触达、营销活动和 KOL 合作；它们不作为 Phase 0 的真实运行路径。</text></svg>
