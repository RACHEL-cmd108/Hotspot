<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">异常恢复中心</title><desc id="desc">展示 Telegram 失败、X 私信降级和回执延迟的影响范围与恢复动作。</desc><style>.bg{fill:#f6f8fb}.c{fill:#fff;stroke:#d9e0ea}.r{fill:#ffeded;stroke:#eea0a0}.a{fill:#fff5df;stroke:#efc36d}.b{fill:#eaf1ff;stroke:#9fbaf0}.t{font:700 18px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.btn{fill:#2563eb}.w{fill:#fff}</style><rect class="bg" width="1440" height="900"/><text x="48" y="58" class="t" font-size="28">异常与恢复</text><text x="48" y="88" class="s">只展示需要人处理的异常；正常执行留在对象时间线</text><rect x="48" y="126" width="1344" height="210" rx="14" class="r"/><text x="74" y="168" class="s">Telegram · 外部运营社群</text><text x="74" y="206" class="t" font-size="24">Predx 中文社区发送失败</text><text x="74" y="244" class="s">原因：Bot 缺少发送媒体权限　影响：1 个目标失败，另 2 个目标已成功</text><text x="74" y="278" class="s">下一责任人：连接器管理员　窗口：16 分钟　已发送内容不会重复</text><rect x="1010" y="236" width="110" height="42" rx="8" class="btn"/><text x="1065" y="263" text-anchor="middle" class="s w">重新验证</text><rect x="1134" y="236" width="100" height="42" rx="8" class="c"/><text x="1184" y="263" text-anchor="middle" class="s">换目标</text><rect x="1248" y="236" width="116" height="42" rx="8" class="c"/><text x="1306" y="263" text-anchor="middle" class="s">停止该消息</text><rect x="48" y="362" width="1344" height="210" rx="14" class="a"/><text x="74" y="404" class="s">X · KOL 首封批次</text><text x="74" y="442" class="t" font-size="24">自动私信能力不可用，已降级</text><text x="74" y="480" class="s">影响：20 位 KOL 尚未触达　已发送：0　名单、模板和批准边界保持有效</text><text x="74" y="514" class="s">下一责任人：KOL/渠道负责人　可导出名单、复制个性化首封并记录人工发送</text><rect x="1110" y="472" width="124" height="42" rx="8" class="btn"/><text x="1172" y="499" text-anchor="middle" class="s w">人工发送</text><rect x="1248" y="472" width="116" height="42" rx="8" class="c"/><text x="1306" y="499" text-anchor="middle" class="s">取消批次</text><rect x="48" y="598" width="1344" height="210" rx="14" class="b"/><text x="74" y="640" class="s">营销活动 · Task Receipt</text><text x="74" y="678" class="t" font-size="24">负责人回执延迟 2 小时</text><text x="74" y="716" class="s">系统不知道活动是否已开始，不会推定完成或失败。最近有效状态：已承接。</text><text x="74" y="750" class="s">下一责任人：活动负责人　操作：提醒、人工更新、重新分派或升级</text><rect x="1110" y="708" width="124" height="42" rx="8" class="btn"/><text x="1172" y="735" text-anchor="middle" class="s w">提醒负责人</text><rect x="1248" y="708" width="116" height="42" rx="8" class="c"/><text x="1306" y="735" text-anchor="middle" class="s">升级</text></svg>
