<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">内容运营与反馈中心第一期产品模块架构</title>
  <desc id="d">第一期只接收系统已发现的热门内容、内容洞察和选定角度，通过结构化表单生成社媒草稿或视频参考脚本，不提供链接解析或开放式对话。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#183c34" flood-opacity=".1"/></filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7da99d"/></marker>
    <style>.title{font:700 30px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}.sub{font:400 14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#687672}.h{font:700 20px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}.p{font:400 14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#52615d}.num{font:700 12px Inter,system-ui,sans-serif;fill:#126153}.label{font:700 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#126153}.arrow{stroke:#7da99d;stroke-width:2.5;fill:none;marker-end:url(#a)}.white{font:600 15px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#fff}.foot{font:700 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#d9eee8}.no{font:600 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#9a4747}</style>
  </defs>
  <rect width="1200" height="760" fill="#f5f8f6"/>
  <text x="60" y="58" class="title">内容运营与反馈中心 · 第一期模块架构</text>
  <text x="60" y="87" class="sub">从系统已分析的热门内容出发，以结构化条件生成新草稿；用户侧 AI 不承担即时解析与开放式研究</text>
  <rect x="60" y="118" width="1080" height="82" rx="14" fill="#fff0e6"/>
  <text x="90" y="145" class="label">唯一合法生成输入</text>
  <text x="90" y="171" class="p">Hot Content Sample　＋　Content Insight（版本）　＋　Selected Angle</text>
  <text x="685" y="171" class="no">不接收：Event / Discussion 直接生成 · 链接解析 · 开放式聊天</text>
  <path d="M365 390H425" class="arrow"/><path d="M775 390H835" class="arrow"/>
  <g filter="url(#s)"><rect x="60" y="240" width="305" height="300" rx="18" fill="#fff"/><rect x="425" y="240" width="350" height="300" rx="18" fill="#fff"/><rect x="835" y="240" width="305" height="300" rx="18" fill="#fff"/></g>
  <circle cx="98" cy="281" r="18" fill="#fff0e6"/><text x="98" y="286" text-anchor="middle" class="num">01</text><text x="130" y="287" class="h">结构化生成</text>
  <text x="90" y="335" class="p">• 选择系统推荐 Angle</text><text x="90" y="367" class="p">• 账号角色与目标受众</text><text x="90" y="399" class="p">• 形式、语气与长度</text><text x="90" y="431" class="p">• 保留与规避信息</text><text x="90" y="463" class="p">• 社媒草稿 / 视频参考脚本</text><text x="90" y="495" class="p">• 修改有限条件后重新生成</text>
  <circle cx="463" cy="281" r="18" fill="#e3f2ed"/><text x="463" y="286" text-anchor="middle" class="num">02</text><text x="495" y="287" class="h">草稿与版本</text>
  <text x="455" y="335" class="p">• 编辑、复制、保存</text><text x="455" y="367" class="p">• Draft Version 与历史</text><text x="455" y="399" class="p">• Generation Request 追溯</text><text x="455" y="431" class="p">• Content Insight 与 Angle 追溯</text><text x="455" y="463" class="p">• 事实、差异化与表达边界检查</text><text x="455" y="495" class="p">• 采用、放弃与人工发布记录</text>
  <circle cx="873" cy="281" r="18" fill="#fcecef"/><text x="873" y="286" text-anchor="middle" class="num">03</text><text x="905" y="287" class="h">反馈与复盘</text>
  <text x="865" y="335" class="p">• Preference Feedback</text><text x="865" y="367" class="p">• Quality Correction</text><text x="865" y="399" class="p">• 采用与拒绝原因</text><text x="865" y="431" class="p">• 首个可用草稿耗时</text><text x="865" y="463" class="p">• 重生成与编辑后采用率</text><text x="865" y="495" class="p">• 质量与系统健康指标</text>
  <rect x="60" y="584" width="1080" height="92" rx="14" fill="#126153"/><text x="90" y="615" class="foot">闭环输出</text><text x="90" y="648" class="white">Social Content Draft / Reference Video Script　·　Draft Version　·　Adoption Record　·　Preference Feedback　·　Quality Correction</text>
  <text x="600" y="719" text-anchor="middle" class="sub">共享项目配置：Product Profile · Expression Boundary · 账号角色 · 内容形式 · 长期偏好</text>
</svg>
