<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">营销活动方案审核</title><desc id="desc">展示活动目标、受众、创意、预算、时间、风险和执行清单。</desc><style>.bg{fill:#f6f8fb}.c{fill:#fff;stroke:#d9e0ea}.b{fill:#eaf1ff}.a{fill:#fff5df}.g{fill:#e7f7ef}.t{font:700 19px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.btn{fill:#2563eb}.w{fill:#fff}.line{stroke:#d9e0ea}</style><rect class="bg" width="1440" height="900"/><text x="48" y="58" class="s">Task Plan TP-204 › Campaign Proposal v2</text><text x="48" y="94" class="t" font-size="28">监管听证会预测挑战</text><rect x="48" y="132" width="930" height="718" rx="14" class="c"/><text x="74" y="174" class="t">活动方案</text><g transform="translate(74 206)"><rect width="270" height="126" rx="10" class="b"/><text x="20" y="36" class="s">目标</text><text x="20" y="74" class="t">提升市场参与与讨论</text><text x="20" y="102" class="s">目标参与 +18%</text></g><g transform="translate(364 206)"><rect width="270" height="126" rx="10" class="c"/><text x="20" y="36" class="s">受众</text><text x="20" y="74" class="t">加密政策关注者</text><text x="20" y="102" class="s">Predx 活跃 + 潜在用户</text></g><g transform="translate(654 206)"><rect width="270" height="126" rx="10" class="a"/><text x="20" y="36" class="s">预算 / 风险</text><text x="20" y="74" class="t">$2,000 · 中</text><text x="20" y="102" class="s">需要增长负责人确认</text></g><text x="74" y="386" class="t">创意与渠道</text><text x="74" y="424" class="s">24 小时预测挑战 · X 内容串 + Telegram 社群互动 + 产品内专题入口</text><text x="74" y="474" class="t">时间与指标</text><text x="74" y="512" class="s">启动：听证会前 6 小时　结束：结果后 2 小时　指标：参与、留存、分享、成本</text><text x="74" y="562" class="t">执行清单</text><rect x="74" y="584" width="850" height="188" rx="10" class="c"/><text x="96" y="622" class="s">□ 创建挑战规则　　　　　　负责人：产品运营　待承接</text><text x="96" y="662" class="s">□ 生成内容与社群素材　　　负责人：内容运营　依赖审核</text><text x="96" y="702" class="s">□ 配置活动入口　　　　　　负责人：活动负责人　未开始</text><text x="96" y="742" class="s">□ 结果回收　　　　　　　　负责人：数据团队　依赖活动结束</text><rect x="1002" y="132" width="390" height="718" rx="14" class="c"/><text x="1028" y="174" class="t">审核</text><rect x="1028" y="206" width="338" height="112" rx="10" class="a"/><text x="1050" y="244" class="s">系统预检</text><text x="1050" y="280" class="t">预算、资源、风险待确认</text><text x="1028" y="366" class="s">审核者：增长负责人</text><text x="1028" y="406" class="s">截止：4 小时内</text><text x="1028" y="446" class="s">当前不自动创建落地页或投放</text><rect x="1028" y="704" width="150" height="46" rx="9" class="btn"/><text x="1103" y="733" text-anchor="middle" class="s w">通过方案</text><rect x="1192" y="704" width="150" height="46" rx="9" class="c"/><text x="1267" y="733" text-anchor="middle" class="s">需修改</text></svg>
