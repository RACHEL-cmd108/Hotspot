<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">未来事件中心</title>
  <desc id="desc">展示预计事件、监测窗口、预案、负责人和实时信号匹配状态；启动只形成候选或事件上下文，不会直接创建渠道行动。</desc>
  <style>
    .bg{fill:#f6f8fb}.nav{fill:#172131}.card{fill:#fff;stroke:#d9e0ea;stroke-width:1.5}.b{fill:#eaf1ff}.g{fill:#e7f7ef}.a{fill:#fff5df}.p{fill:#f1edff}.t{font:700 18px system-ui;fill:#18212f}.h{font:700 26px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.xs{font:12px system-ui;fill:#667085}.w{fill:#fff}.line{stroke:#d9e0ea}.btn{fill:#2563eb}
  </style>
  <rect class="bg" width="1440" height="900"/><rect class="nav" width="236" height="900"/><text x="28" y="54" class="t w">Hotspot Monitor</text><text x="30" y="118" class="s w">工作台</text><rect x="18" y="138" width="200" height="42" rx="8" fill="#334a69"/><text x="32" y="165" class="s w">热点与事件</text><text x="30" y="222" class="s w">机会</text><text x="30" y="266" class="s w">任务中心</text>
  <text x="276" y="54" class="h">未来事件中心</text><text x="276" y="82" class="s">M1 预案与监测窗口；事件启动只补充 Candidate/Event 上下文，不直接产生 Opportunity 或行动任务。</text><rect x="1168" y="34" width="224" height="42" rx="8" class="btn"/><text x="1280" y="61" text-anchor="middle" class="s w">新建未来事件</text>
  <rect x="276" y="110" width="1116" height="52" rx="10" class="card"/><text x="300" y="142" class="s">未来 30 天 ▾　　全部领域 ▾　　全部负责人 ▾　　预案状态 ▾　　日历 / 列表</text>
  <rect x="276" y="188" width="764" height="430" rx="14" class="card"/><text x="302" y="226" class="t">时间轴与监测窗口</text><text x="302" y="254" class="xs">时间轴同时表达预计发生时间和前/中/后监测窗口；不将预测时间表述为事实。</text>
  <line x1="340" y1="320" x2="968" y2="320" class="line"/><text x="340" y="298" class="xs">8/12</text><text x="540" y="298" class="xs">8/14</text><text x="740" y="298" class="xs">8/16</text><text x="930" y="298" class="xs">8/18</text>
  <rect x="386" y="350" width="300" height="48" rx="8" class="b"/><text x="402" y="379" class="s">前监测　监管听证会　中监测</text><rect x="606" y="338" width="18" height="72" rx="9" fill="#2563eb"/><text x="638" y="382" class="t">预计 8/14 14:00 UTC</text>
  <rect x="506" y="440" width="332" height="48" rx="8" class="p"/><text x="522" y="469" class="s">前监测　宏观数据发布　后监测</text><rect x="696" y="428" width="18" height="72" rx="9" fill="#7556d8"/><text x="728" y="472" class="t">预计 8/16 12:30 UTC</text>
  <rect x="340" y="530" width="240" height="34" rx="8" class="a"/><text x="356" y="552" class="xs">手动提前启动需留痕</text><text x="302" y="592" class="xs">点击事件打开详情、改期、取消或查看匹配的实时 Signal / Candidate。</text>
  <rect x="1064" y="188" width="328" height="430" rx="14" class="card"/><text x="1090" y="226" class="t">监管听证会</text><text x="1090" y="254" class="s">预计发生：8/14 14:00 UTC</text><rect x="1090" y="278" width="276" height="66" rx="10" class="g"/><text x="1110" y="306" class="xs">预案状态</text><text x="1110" y="330" class="t">已就绪 · 小林</text><text x="1090" y="382" class="s">窗口：前 24h　中 4h　后 8h</text><text x="1090" y="418" class="s">实时匹配：2 条 Signal · 1 个 Candidate</text><text x="1090" y="454" class="s">启动状态：自动窗口已开启</text><text x="1090" y="490" class="s">关联 Event：EV-1842</text><rect x="1090" y="534" width="276" height="48" rx="9" class="card"/><text x="1228" y="564" text-anchor="middle" class="s">查看匹配与审计记录</text>
  <rect x="276" y="644" width="1116" height="208" rx="14" class="card"/><text x="302" y="682" class="t">即将进入窗口</text><text x="302" y="714" class="xs">事件</text><text x="650" y="714" class="xs">负责人 / 预案</text><text x="940" y="714" class="xs">匹配状态</text><line x1="300" y1="728" x2="1368" y2="728" class="line"/><text x="302" y="766" class="s">美国监管听证会　·　前监测已开启</text><text x="650" y="766" class="s">小林　·　已就绪</text><text x="940" y="766" class="s">2 Signal / 1 Candidate</text><line x1="300" y1="786" x2="1368" y2="786" class="line"/><text x="302" y="824" class="s">宏观数据发布　·　将在 36 小时后开启</text><text x="650" y="824" class="s">研究运营　·　待补预案</text><text x="940" y="824" class="s">尚无实时匹配</text>
</svg>
