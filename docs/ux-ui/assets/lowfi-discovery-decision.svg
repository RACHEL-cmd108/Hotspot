<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
 <title id="title">低保真线框图：发现、事件与机会决定</title><desc id="desc">PG-03 至 PG-08 的热点雷达、候选例外、未来事件、监测范围、Event 和 Opportunity 页面骨架。</desc>
 <style>.bg{fill:#f3f4f6}.p{fill:#fff;stroke:#4b5563;stroke-width:2}.b{fill:#e5e7eb;stroke:#6b7280}.x{fill:#fff;stroke:#9ca3af}.m{fill:#f3f4f6;stroke:#9ca3af}.d{fill:#d1d5db;stroke:#6b7280}.t{font:11px system-ui;fill:#374151}.s{font:10px system-ui;fill:#4b5563}.h{font:700 14px system-ui;fill:#111827}</style>
 <rect class="bg" width="1440" height="1260"/><text x="36" y="36" class="h">低保真线框图 B · M1 发现、M2 事件与 M3 机会决定</text>
 <g transform="translate(28 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-03 实时热点雷达</text><rect class="m" x="16" y="54" width="398" height="28"/><text x="28" y="73" class="s">平台 · 地区 · 主题 · 时间 · 来源状态 [筛选 / 保存视图]</text><rect class="x" x="16" y="98" width="245" height="218"/><text x="28" y="122" class="h">Top 10 / 热度趋势</text><path d="M32 276 L74 236 L118 256 L164 180 L208 218 L244 142" fill="none" stroke="#6b7280" stroke-width="2"/><text x="28" y="300" class="s">排名、变化、触发依据；Signal 明示为原始信号。</text><rect class="x" x="278" y="98" width="136" height="218"/><text x="290" y="122" class="h">来源健康</text><rect class="m" x="290" y="142" width="100" height="20"/><rect class="m" x="290" y="174" width="88" height="20"/><text x="290" y="226" class="s">最近成功采集</text><rect class="x" x="16" y="336" width="398" height="132"/><text x="28" y="360" class="h">触发日志 / Signal 预览</text><text x="28" y="386" class="s">正常触发自动形成/更新 Candidate；例外才进入 PG-04。</text></g>
 <g transform="translate(505 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-04 候选事件队列 · 仅例外</text><rect class="x" x="16" y="54" width="220" height="404"/><text x="28" y="80" class="h">待处理 / 疑似重复</text><rect class="m" x="28" y="96" width="194" height="48"/><rect class="m" x="28" y="156" width="194" height="48"/><rect class="m" x="28" y="216" width="194" height="48"/><text x="38" y="126" class="s">Candidate #31 · 置信度 / 依据</text><text x="38" y="186" class="s">Candidate #32 · 疑似同一事件</text><rect class="x" x="252" y="54" width="162" height="404"/><text x="264" y="80" class="h">并排比较</text><text x="264" y="108" class="s">Signal / 时间地区</text><text x="264" y="132" class="s">Future Event / Event</text><text x="264" y="156" class="s">下游影响</text><rect class="d" x="264" y="188" width="124" height="26"/><text x="278" y="206" class="s">合并 / 拆分</text><rect class="x" x="264" y="226" width="124" height="26"/><text x="278" y="244" class="s">校正上下文</text><text x="264" y="286" class="s">理由必填；原始 Signal 不删除。</text></g>
 <g transform="translate(982 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-05 未来事件中心</text><rect class="x" x="16" y="54" width="240" height="246"/><text x="28" y="80" class="h">日历 / 前中后窗口</text><path d="M34 110H236M34 144H236M34 178H236M82 96V282M130 96V282M178 96V282" stroke="#9ca3af"/><rect class="d" x="134" y="148" width="38" height="24"/><text x="28" y="326" class="s">创建、改期、取消、提前启动。</text><rect class="x" x="274" y="54" width="140" height="246"/><text x="286" y="80" class="h">预案 / 匹配</text><rect class="m" x="286" y="98" width="104" height="32"/><rect class="m" x="286" y="142" width="104" height="32"/><text x="286" y="206" class="s">关联 Candidate / Event</text><rect class="x" x="16" y="350" width="398" height="108"/><text x="28" y="376" class="h">启动结果</text><text x="28" y="402" class="s">只形成/更新 Candidate/Event 上下文，不直接创建行动。</text></g>
 <g transform="translate(28 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-06 监测范围</text><rect class="x" x="16" y="54" width="132" height="390"/><text x="28" y="82" class="s">来源/平台</text><text x="28" y="112" class="s">地区/主题</text><text x="28" y="142" class="s">关键词</text><text x="28" y="172" class="s">阈值</text><text x="28" y="202" class="s">提醒</text><text x="28" y="232" class="s">匹配规则</text><rect class="x" x="164" y="54" width="250" height="390"/><text x="178" y="82" class="h">规则版本编辑器</text><rect class="m" x="178" y="102" width="210" height="28"/><rect class="m" x="178" y="142" width="210" height="56"/><text x="178" y="226" class="s">测试 Signal 预览命中结果</text><rect class="d" x="178" y="252" width="100" height="28"/><text x="193" y="271" class="s">发布版本</text><text x="178" y="320" class="s">展示影响范围、生效时间、回滚版本。</text></g>
 <g transform="translate(505 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-07 Event 工作区</text><rect class="m" x="16" y="54" width="398" height="54"/><text x="28" y="78" class="h">事件一句话定义 · 置信度 · 阶段 · 风险 · 窗口 · 版本</text><rect class="x" x="16" y="126" width="182" height="266"/><text x="28" y="152" class="h">Fact → Evidence</text><rect class="m" x="28" y="170" width="146" height="38"/><rect class="m" x="42" y="220" width="132" height="28"/><rect class="m" x="42" y="260" width="132" height="28"/><text x="28" y="330" class="s">支持 / 质疑 / 排除来源抽屉</text><rect class="x" x="214" y="126" width="200" height="266"/><text x="226" y="152" class="h">事件监测</text><path d="M230 342 L262 292 L296 310 L330 232 L394 260" fill="none" stroke="#6b7280" stroke-width="2"/><text x="226" y="370" class="s">热度、扩散、关键节点；不以热度替代事实。</text><rect class="x" x="16" y="414" width="398" height="42"/><text x="28" y="440" class="s">进入 Opportunity；冲突/风险进入异常中心。</text></g>
 <g transform="translate(982 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-08 Opportunity 工作区</text><rect class="m" x="16" y="54" width="398" height="66"/><text x="28" y="79" class="h">目标 · 受众 · 价值 · 资源 · 风险 · 窗口</text><text x="28" y="102" class="s">根 Event / Event Card 版本与系统推断依据</text><rect class="x" x="16" y="140" width="398" height="110"/><text x="28" y="166" class="h">热点整体响应决定</text><rect class="d" x="28" y="184" width="78" height="32"/><rect class="x" x="116" y="184" width="78" height="32"/><rect class="x" x="204" y="184" width="78" height="32"/><rect class="x" x="292" y="184" width="92" height="32"/><text x="34" y="205" class="s">优先参与</text><text x="134" y="205" class="s">参与</text><text x="222" y="205" class="s">观察</text><text x="308" y="205" class="s">不参与</text><rect class="x" x="16" y="272" width="398" height="108"/><text x="28" y="298" class="h">自动参与依据（Phase 0）</text><text x="28" y="324" class="s">策略、触发时间、非高风险判定；仅审计，不作日常覆盖。</text><text x="28" y="354" class="s">参与/优先参与 → PG-09；观察→重评；不参与→复盘。</text></g>
</svg>
