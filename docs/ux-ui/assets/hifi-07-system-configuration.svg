<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">系统设置高保真设计</title><desc id="d">系统配置、版本差异与审计页面。</desc><style>.b{fill:#f4f7f7}.p{fill:#fff;stroke:#d6dfdf}.g{fill:#087b71}.s{fill:#edf7f5}.o{fill:#f8e6db}.h{font:700 25px Inter,-apple-system,'PingFang SC',sans-serif;fill:#172026}.h2{font:700 16px Inter,-apple-system,'PingFang SC',sans-serif;fill:#172026}.tx{font:500 14px Inter,-apple-system,'PingFang SC',sans-serif;fill:#172026}.sm{font:500 12px Inter,-apple-system,'PingFang SC',sans-serif;fill:#647276}.w{font:700 15px Inter,-apple-system,'PingFang SC',sans-serif;fill:#fff}</style><rect class="b" width="1600" height="1000"/><rect width="224" height="1000" fill="#fff"/><rect x="224" width="1376" height="62" fill="#fff" stroke="#d6dfdf"/><rect x="22" y="22" width="30" height="30" class="g"/><text x="29" y="42" class="w" font-size="11">PX</text><text x="63" y="35" class="tx" font-weight="700">热点运营系统</text><text x="63" y="51" class="sm">Operations OS</text><text x="24" y="100" class="sm">运营工作区</text><text x="28" y="134" class="tx">运营总览</text><text x="28" y="192" class="tx">热点监测</text><text x="28" y="250" class="tx">运营排期</text><text x="28" y="308" class="tx">事件管理</text><text x="28" y="366" class="tx">内容发布</text><text x="28" y="424" class="tx">复盘优化</text><text x="24" y="500" class="sm">系统</text><rect x="12" y="514" width="200" height="51" class="s"/><rect x="12" y="514" width="3" height="51" class="g"/><text x="28" y="536" class="tx" font-weight="700">系统设置</text><text x="28" y="553" class="sm">Configuration</text><text x="255" y="37" class="sm">工作区 / 系统设置</text><text x="255" y="112" class="h">系统设置</text><text x="255" y="136" class="sm">所有修改先保存为草稿，发布前确认影响范围和版本差异；历史任务保持创建时版本</text><rect x="1095" y="94" width="105" height="35" class="p"/><text x="1119" y="117" class="tx">生产 v2.4</text><rect x="1212" y="94" width="113" height="35" class="g"/><text x="1235" y="117" class="w" font-size="12">保存为草稿</text><rect x="255" y="165" width="232" height="650" class="p"/><text x="277" y="199" class="sm">配置分类</text><rect x="267" y="213" width="208" height="36" class="s"/><text x="283" y="236" class="tx" fill="#087b71">接口与数据源</text><text x="283" y="278" class="tx">监控与触发规则</text><text x="283" y="320" class="tx">重点主题</text><text x="283" y="362" class="tx">账号与 Skills</text><text x="283" y="404" class="tx">产品资料</text><text x="283" y="446" class="tx">风险与预检</text><text x="283" y="488" class="tx">发布与数据追踪</text><text x="283" y="530" class="tx">排期事件源</text><text x="283" y="572" class="tx">权限与版本</text><text x="283" y="614" class="tx">审计记录</text><rect x="507" y="165" width="818" height="650" class="p"/><text x="533" y="200" class="h2">接口与数据源</text><text x="533" y="223" class="sm">配置接入、同步频率、最大陈旧时间、失败重试与降级策略</text><rect x="533" y="245" width="766" height="34" fill="#edf2f2"/><g class="sm"><text x="552" y="267">对象</text><text x="800" y="267">作用 / 配置摘要</text><text x="1104" y="267">运行状态</text><text x="1214" y="267">操作</text></g><g><text x="552" y="318" class="tx" font-weight="700">X 榜单 API</text><text x="800" y="318" class="sm">采集五个地区 Top30 · 每 1 小时</text><rect x="1104" y="300" width="50" height="20" class="s"/><text x="1115" y="315" class="sm" fill="#087b71">正常</text><text x="1214" y="318" class="sm" fill="#087b71">配置 →</text><line x1="533" y1="341" x2="1299" y2="341" stroke="#e5ebeb"/><text x="552" y="383" class="tx" font-weight="700">X 帖子指标 API</text><text x="800" y="383" class="sm">浏览、点赞、回复、转发追踪</text><rect x="1104" y="365" width="50" height="20" class="o"/><text x="1115" y="380" class="sm" fill="#b55020">异常</text><text x="1214" y="383" class="sm" fill="#087b71">配置 →</text><line x1="533" y1="406" x2="1299" y2="406" stroke="#e5ebeb"/><text x="552" y="448" class="tx" font-weight="700">内容生成模型</text><text x="800" y="448" class="sm">执行已发布账号与 Content Skills</text><rect x="1104" y="430" width="50" height="20" class="s"/><text x="1115" y="445" class="sm" fill="#087b71">正常</text><text x="1214" y="448" class="sm" fill="#087b71">配置 →</text></g><rect x="533" y="492" width="766" height="115" class="s"/><text x="554" y="521" class="h2">此分区承担什么作用？</text><text x="554" y="547" class="sm">配置接口地址、认证方式、请求参数、同步频率、最大陈旧时间、失败重试和降级方案。</text><text x="554" y="570" class="sm">凭据只在受保护配置中管理，页面、异常和审计记录不得展示密钥或令牌。</text><text x="533" y="662" class="h2">发布前影响预览</text><rect x="533" y="680" width="766" height="93" class="p"/><text x="553" y="709" class="tx" font-weight="700">草稿 v2.5 → 生产 v2.4</text><text x="553" y="733" class="sm">影响对象：新建 X 榜单采集、后续 Candidate Event；在途任务继续使用 v2.4。</text><text x="553" y="755" class="sm">需授权角色发布；发布后可回滚，审计记录操作者、原因、时间与版本。</text></svg>
