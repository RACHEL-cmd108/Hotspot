<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Telegram 私域触达</title><desc id="desc">内部审核目标与外部运营社群隔离，消息批准后由 Bot 发布。</desc><style>.bg{fill:#f6f8fb}.c{fill:#fff;stroke:#d9e0ea}.b{fill:#eaf1ff}.g{fill:#e7f7ef}.a{fill:#fff5df}.r{fill:#ffeded}.t{font:700 19px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.btn{fill:#2563eb}.w{fill:#fff}.line{stroke:#d9e0ea}</style><rect class="bg" width="1440" height="900"/><text x="48" y="58" class="t" font-size="28">私域触达｜Private Outreach Draft</text><text x="48" y="88" class="s">系统内部权威版本 · Telegram Bot 执行</text><rect x="48" y="126" width="760" height="724" rx="14" class="c"/><text x="74" y="168" class="t">市场异动快报 v2</text><rect x="74" y="196" width="708" height="184" rx="12" class="b"/><text x="98" y="236" class="t">市场异动：监管听证会时间提前</text><text x="98" y="276" class="s">相关预测市场过去 30 分钟出现显著波动。</text><text x="98" y="316" class="s">以下信息基于官方议程与已确认市场数据……</text><text x="98" y="352" class="s">查看完整事件 →</text><text x="74" y="430" class="t">目标目录</text><rect x="74" y="454" width="330" height="110" rx="10" class="a"/><text x="96" y="490" class="s">内部审核目标</text><text x="96" y="524" class="t">Predx 内容运营群</text><text x="96" y="550" class="s">仅协作 · 不构成外部发布</text><rect x="424" y="454" width="358" height="110" rx="10" class="g"/><text x="446" y="490" class="s">外部运营社群</text><text x="446" y="524" class="t">Predx 中文社区</text><text x="446" y="550" class="s">Bot 可发消息 · 已批准</text><text x="74" y="616" class="t">人工批准</text><text x="74" y="650" class="s">社群运营 · 已通过 · 目标 1 个 · 逐条批准</text><rect x="74" y="690" width="210" height="50" rx="9" class="btn"/><text x="179" y="721" text-anchor="middle" class="t w">批准并由 Bot 发送</text><rect x="828" y="126" width="564" height="724" rx="14" class="c"/><text x="854" y="168" class="t">发送与回执</text><text x="854" y="214" class="s">目标</text><text x="1030" y="214" class="t">Predx 中文社区</text><text x="854" y="258" class="s">Bot 权限</