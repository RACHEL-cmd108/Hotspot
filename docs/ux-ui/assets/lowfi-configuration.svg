<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
 <title id="title">低保真线框图：业务字典与连接器配置</title><desc id="desc">PG-15 业务字典和 PG-16 连接器与目标目录页面骨架。</desc>
 <style>.bg{fill:#f3f4f6}.p{fill:#fff;stroke:#4b5563;stroke-width:2}.b{fill:#e5e7eb;stroke:#6b7280}.x{fill:#fff;stroke:#9ca3af}.m{fill:#f3f4f6;stroke:#9ca3af}.d{fill:#d1d5db;stroke:#6b7280}.s{font:11px system-ui;fill:#374151}.h{font:700 16px system-ui;fill:#111827}</style>
 <rect class="bg" width="1440" height="760"/><text x="36" y="40" class="h">低保真线框图 D · 配置与治理</text>
 <g transform="translate(38 84)"><rect class="p" width="640" height="620" rx="8"/><rect class="b" width="640" height="42" rx="8"/><text x="18" y="28" class="h">PG-15 业务字典</text><rect class="x" x="18" y="62" width="158" height="514"/><text x="32" y="94" class="s">来源</text><text x="32" y="126" class="s">渠道</text><text x="32" y="158" class="s">受众</text><text x="32" y="190" class="s">风险</text><text x="32" y="222" class="s">指标</text><rect class="x" x="194" y="62" width="428" height="514"/><text x="210" y="94" class="h">条目 / 版本 / 引用</text><rect class="m" x="210" y="112" width="390" height="30"/><rect class="m" x="210" y="152" width="390" height="30"/><rect class="m" x="210" y="192" width="390" height="30"/><text x="210" y="260" class="s">定义 · 所有者 · 状态 · 被哪些规则/对象引用</text><rect class="d" x="210" y="286" width="124" height="28"/><text x="226" y="305" class="s">编辑 / 弃用</text><text x="210" y="350" class="s">被历史对象引用时不可硬删除；显示替代映射和影响预览。</text></g>
 <g transform="translate(762 84)"><rect class="p" width="640" height="620" rx="8"/><rect class="b" width="640" height="42" rx="8"/><text x="18" y="28" class="h">PG-16 连接器与目标目录</text><rect class="x" x="18" y="62" width="188" height="514"/><text x="32" y="94" class="h">连接器状态</text><rect class="m" x="32" y="114" width="150" height="36"/><rect class="m" x="32" y="162" width="150" height="36"/><text x="32" y="226" class="s">健康 / 授权 / 最近投递</text><rect class="x" x="224" y="62" width="398" height="220"/><text x="240" y="94" class="h">内部审核目标</text><text x="240" y="122" class="s">Telegram 工作群 / Google Docs 等；仅协作出口</text><rect class="m" x="240" y="144" width="350" height="30"/><rect class="d" x="240" y="192" width="118" height="28"/><text x="258" y="211" class="s">验证 / 批准</text><rect class="x" x="224" y="300" width="398" height="184"/><text x="240" y="332" class="h">外部运营目标</text><text x="240" y="360" class="s">私域社群等；与内部审核目标明确隔离。</text><text x="240" y="392" class="s">授权失效、目标撤销、投递失败进入异常中心。</text><text x="224" y="534" class="s">仅连接器管理员变更；草稿页只可选择已批准目标摘要。</text></g>
</svg>
