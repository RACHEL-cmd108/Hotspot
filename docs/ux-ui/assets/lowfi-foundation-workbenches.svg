<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">低保真线框图：基础与双层工作台</title><desc id="desc">PG-01 登录与权限、PG-02A 我的响应台、PG-02B 全局运营台的桌面页面骨架。</desc>
  <style>.bg{fill:#f3f4f6}.page{fill:#fff;stroke:#4b5563;stroke-width:2}.bar{fill:#e5e7eb;stroke:#6b7280}.box{fill:#fff;stroke:#9ca3af}.muted{fill:#f3f4f6;stroke:#9ca3af}.dark{fill:#d1d5db;stroke:#6b7280}.txt{font:12px system-ui;fill:#374151}.sm{font:10px system-ui;fill:#4b5563}.h{font:700 17px system-ui;fill:#111827}.label{font:700 12px system-ui;fill:#111827}</style>
  <rect class="bg" width="1440" height="980"/><text x="36" y="38" class="h">低保真线框图 A · 基础与双层工作台（桌面 Web）</text><text x="36" y="62" class="txt">灰阶仅表达信息、操作与层级；不代表最终视觉风格。</text>
  <g transform="translate(28 92)"><rect class="page" width="420" height="840" rx="8"/><rect class="bar" width="420" height="42" rx="8"/><text x="18" y="27" class="label">PG-01 登录与权限</text><rect class="muted" x="32" y="92" width="356" height="210" rx="6"/><text x="54" y="126" class="h">Hotspot Monitor</text><rect class="box" x="54" y="150" width="312" height="34"/><text x="66" y="172" class="sm">企业账号 / 单点登录</text><rect class="dark" x="54" y="198" width="312" height="38" rx="4"/><text x="154" y="223" class="txt">登录</text><text x="54" y="270" class="sm">会话失效、认证失败、无可用工作空间在此说明。</text><rect class="box" x="32" y="338" width="356" height="178"/><text x="54" y="368" class="label">工作空间与权限</text><rect class="muted" x="54" y="386" width="312" height="32"/><text x="66" y="407" class="sm">增长运营工作空间 · 已授权</text><rect class="muted" x="54" y="430" width="312" height="32"/><text x="66" y="451" class="sm">数据策略工作空间 · 申请访问</text><rect class="box" x="54" y="474" width="138" height="26"/><text x="76" y="492" class="sm">申请权限</text><rect class="box" x="32" y="548" width="356" height="132"/><text x="54" y="578" class="label">受限深链</text><text x="54" y="604" class="sm">保留原对象路径；获权后返回。</text><text x="54" y="628" class="sm">未授权前不展示热点/内容/任务正文。</text><text x="32" y="794" class="sm">跳转：PG-02A / PG-02B，或返回原深链对象。</text></g>
