<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
 <title id="title">低保真线框图：任务方案、交付、回执与学习</title><desc id="desc">PG-09 至 PG-14 的 Task Plan、任务中心、草稿、任务回执、Outcome 和异常页面骨架。</desc>
 <style>.bg{fill:#f3f4f6}.p{fill:#fff;stroke:#4b5563;stroke-width:2}.b{fill:#e5e7eb;stroke:#6b7280}.x{fill:#fff;stroke:#9ca3af}.m{fill:#f3f4f6;stroke:#9ca3af}.d{fill:#d1d5db;stroke:#6b7280}.t{font:11px system-ui;fill:#374151}.s{font:10px system-ui;fill:#4b5563}.h{font:700 14px system-ui;fill:#111827}</style>
 <rect class="bg" width="1440" height="1260"/><text x="36" y="36" class="h">低保真线框图 C · M4 任务协同、M5 学习与异常恢复</text>
 <g transform="translate(28 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-09 Task Plan 工作区</text><rect class="m" x="16" y="54" width="398" height="54"/><text x="28" y="78" class="h">目标 · 成功标准 · 窗口 · 资源 · 风险 · 当前版本</text><rect class="x" x="16" y="126" width="190" height="96"/><rect class="x" x="224" y="126" width="190" height="96"/><rect class="x" x="16" y="238" width="190" height="96"/><rect class="x" x="224" y="238" width="190" height="96"/><text x="28" y="154" class="h">内容发布行动卡</text><text x="28" y="177" class="s">建议 / 已选入（策略）</text><text x="236" y="154" class="h">私域触达行动卡</text><text x="236" y="177" class="s">建议 / 待选择</text><text x="28" y="266" class="h">营销活动行动卡</text><text x="28" y="289" class="s">未建议 / 待选择</text><text x="236" y="266" class="h">KOL 合作行动卡</text><text x="236" y="289" class="s">建议 / 待选择</text><rect class="x" x="16" y="354" width="398" height="96"/><text x="28" y="380" class="h">渠道依赖与影响分析</text><text x="28" y="405" class="s">取消 KOL → 内容 CTA / 窗口 / KPI 是否变化？</text><rect class="d" x="28" y="418" width="108" height="22"/><text x="42" y="434" class="s">查看重规划</text></g>
 <g transform="translate(505 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-10 任务中心</text><rect class="m" x="16" y="54" width="398" height="28"/><text x="28" y="73" class="s">类型 · 状态 · 责任人 · 窗口 · 风险 [筛选]</text><rect class="x" x="16" y="98" width="92" height="300"/><rect class="x" x="116" y="98" width="92" height="300"/><rect class="x" x="216" y="98" width="92" height="300"/><rect class="x" x="316" y="98" width="98" height="300"/><text x="26" y="124" class="h">待处理</text><text x="126" y="124" class="h">审核中</text><text x="226" y="124" class="h">交接中</text><text x="326" y="124" class="h">异常</text><rect class="m" x="26" y="146" width="70" height="44"/><rect class="m" x="126" y="146" width="70" height="44"/><rect class="m" x="226" y="146" width="70" height="44"/><rect class="m" x="326" y="146" width="74" height="44"/><text x="16" y="438" class="s">统一队列只汇总；进入草稿、任务或异常页完成具体操作。</text></g>
 <g transform="translate(982 72)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-11 交付物草稿处理</text><rect class="m" x="16" y="54" width="398" height="42"/><text x="28" y="79" class="s">Event · Task Plan · 渠道 · 版本 · Fact/Evidence · 截止</text><rect class="x" x="16" y="114" width="246" height="254"/><text x="28" y="140" class="h">内容候选 / 草稿正文</text><rect class="m" x="28" y="158" width="220" height="46"/><rect class="m" x="28" y="216" width="220" height="46"/><rect class="m" x="28" y="274" width="220" height="46"/><text x="28" y="348" class="s">至少 3 条候选；选择、复制、打开平台、回填链接。</text><rect class="x" x="278" y="114" width="136" height="254"/><text x="290" y="140" class="h">预检 / 审核</text><text x="290" y="170" class="s">规则结果</text><text x="290" y="198" class="s">版本差异</text><text x="290" y="226" class="s">审核意见</text><rect class="d" x="290" y="254" width="100" height="24"/><text x="302" y="271" class="s">投递 / 重试</text><text x="16" y="424" class="s">普通内容不显示“人工审核通过”；高风险/其他类型进入指定审核。</text></g>
 <g transform="translate(28 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-12 行动任务与回执</text><rect class="x" x="16" y="54" width="170" height="346"/><text x="28" y="80" class="h">Action Task</text><text x="28" y="108" class="s">目标 / 责任人 / 执行目标</text><text x="28" y="134" class="s">依赖 / 窗口 / 当前状态</text><rect class="d" x="28" y="162" width="112" height="24"/><text x="44" y="179" class="s">确认交接</text><rect class="x" x="204" y="54" width="210" height="346"/><text x="216" y="80" class="h">Receipt 时间线</text><path d="M230 110V326" stroke="#6b7280" stroke-width="2"/><circle cx="230" cy="130" r="5" fill="#6b7280"/><circle cx="230" cy="190" r="5" fill="#6b7280"/><circle cx="230" cy="250" r="5" fill="#6b7280"/><text x="244" y="134" class="s">已接收</text><text x="244" y="194" class="s">已关联</text><text x="244" y="254" class="s">待人工处理 / 延迟</text><text x="16" y="434" class="s">暂停、取消、改派、升级进入完整确认，不能改写草稿或计划。</text></g>
 <g transform="translate(505 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-13 Outcome 与复盘</text><rect class="x" x="16" y="54" width="250" height="196"/><text x="28" y="80" class="h">目标 / 实际 / 口径</text><path d="M32 212 L78 184 L124 198 L170 146 L246 166" fill="none" stroke="#6b7280" stroke-width="2"/><text x="28" y="236" class="s">数据来源、新鲜度、归因置信度、缺失/冲突。</text><rect class="x" x="282" y="54" width="132" height="196"/><text x="294" y="80" class="h">复盘结论</text><text x="294" y="110" class="s">保留 / 修订</text><text x="294" y="136" class="s">策略建议</text><rect class="x" x="16" y="272" width="398" height="120"/><text x="28" y="298" class="h">建议反馈范围</text><text x="28" y="324" class="s">创建指向监测范围、Opportunity 或 Task Plan 的变更建议；负责人确认才生效。</text></g>
 <g transform="translate(982 646)"><rect class="p" width="430" height="520" rx="8"/><rect class="b" width="430" height="38" rx="8"/><text x="16" y="25" class="h">PG-14 通知与异常中心</text><rect class="m" x="16" y="54" width="398" height="28"/><text x="28" y="73" class="s">当前责任人 · 剩余窗口 · 类型 [排序 / 筛选]</text><rect class="x" x="16" y="98" width="398" height="76"/><text x="28" y="124" class="h">未投递 · 剩余 02:14</text><text x="28" y="148" class="s">对象链 / 失败步骤 / 重试 / 换目标 / 升级</text><rect class="x" x="16" y="188" width="398" height="76"/><text x="28" y="214" class="h">计划变更待复核</text><text x="28" y="238" class="s">受影响草稿、责任人、保留/修订/终止入口</text><rect class="x" x="16" y="278" width="398" height="76"/><text x="28" y="304" class="h">回执延迟</text><text x="28" y="328" class="s">不能推定完成；人工更新、重新分派、升级。</text><text x="16" y="424" class="s">关闭通知不等于恢复对象，操作返回原对象工作区。</text></g>
</svg>
