 y="238" class="t">@PolicyAlpha · 有意向</text><text x="820" y="272" class="s">“可以聊，预算和发布时间是什么？”</text><text x="820" y="300" class="s">AI：询价 / 正向 · 风险低</text><rect x="798" y="342" width="568" height="148" rx="10" class="p"/><text x="820" y="378" class="s">✦ AI 回复建议</text><text x="820" y="414" class="t">感谢回复。预算范围为 $600–800……</text><text x="820" y="452" class="s">报价承诺需人工确认，尚未发送。</text><rect x="798" y="518" width="136" height="44" rx="9" class="btn"/><text x="866" y="546" text-anchor="middle" class="s w">确认发送</text><rect x="948" y="518" width="136" height="44" rx="9" class="c"/><text x="1016" y="546" text-anchor="middle" class="s">编辑</text><rect x="798" y="604" width="568" height="106" rx="10" class="r"/><text x="820" y="640" class="t">@CryptoDesk · 明确拒绝</text><text x="820" y="676" class="s">后续触达已自动停止 · 已记录拒绝</text></svg>
