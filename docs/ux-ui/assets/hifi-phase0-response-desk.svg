<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 0 我的响应台</title>
  <desc id="desc">内容运营的默认首页，聚焦合格热点触发、候选投递、人工选择和发布链接回填；同时保留全局运营台入口。</desc>
  <style>.bg{fill:#f6f8fb}.nav{fill:#172131}.card{fill:#fff;stroke:#d9e0ea;stroke-width:1.5}.b{fill:#eaf1ff}.g{fill:#e7f7ef}.a{fill:#fff5df}.r{fill:#ffeded}.t{font:700 18px system-ui;fill:#18212f}.h{font:700 26px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.xs{font:12px system-ui;fill:#667085}.w{fill:#fff}.btn{fill:#2563eb}.line{stroke:#c4d2e5;stroke-width:4}</style>
  <rect class="bg" width="1440" height="900"/><rect class="nav" width="236" height="900"/><text x="28" y="54" class="t w">Hotspot Monitor</text><text x="30" y="118" class="s w">工作台</text><rect x="18" y="138" width="200" height="42" rx="8" fill="#334a69"/><text x="32" y="165" class="s w">我的响应台</text><text x="32" y="210" class="s w">全局运营台</text><text x="30" y="270" class="s w">热点与事件</text><text x="30" y="314" class="s w">机会</text><text x="30" y="358" class="s w">任务中心</text>
  <text x="276" y="54" class="h">我的响应台</text><text x="276" y="82" class="s">小陈 · Phase 0 · 内容运营突发热点快速响应</text><rect x="1130" y="30" width="252" height="46" rx="9" class="card"/><text x="1256" y="59" text-anchor="middle" class="s">切换到全局运营台 →</text>
  <text x="276" y="126" class="t">现在需要你处理</text>
  <rect x="276" y="150" width="350" height="140" rx="14" class="a"/><text x="300" y="184" class="s">合格触发 · T0 + 2 分钟</text><text x="300" y="220" class="t">监管听证会时间变更</text><text x="300" y="252" class="s">候选投递截止：3 分钟后</text>
  <rect x="646" y="150" width="350" height="140" rx="14" class="b"/><text x="670" y="184" class="s">已投递候选 · 3 条</text><text x="670" y="220" class="t">等待人工选择</text><text x="670" y="252" class="s">距发布链接回填截止：12 分钟</text>
  <rect x="1016" y="150" width="366" height="140" rx="14" class="r"/><text x="1040" y="184" class="s">例外 · 1 项</text><text x="1040" y="220" class="t">候选投递目标不可达</text><text x="1040" y="252" class="s">重试 / 更换内部审核目标</text>
  <text x="276" y="344" class="t">本次热点响应链</text><rect x="276" y="366" width="1106" height="144" rx="14" class="card"/><line x1="340" y1="432" x2="1304" y2="432" class="line"/><g fill="#2563eb"><circle cx="340" cy="432" r="10"/><circle cx="500" cy="432" r="10"/><circle cx="660" cy="432" r="10"/><circle cx="820" cy="432" r="10"/><circle cx="980" cy="432" r="10"/></g><circle cx="1140" cy="432" r="10" fill="#b86400"/><circle cx="1300" cy="432" r="10" fill="#b86400"/><g class="xs"><text x="340" y="400" text-anchor="middle">Signal</text><text x="500" y="400" text-anchor="middle">Candidate</text><text x="660" y="400" text-anchor="middle">Event</text><text x="820" y="400" text-anchor="middle">Opportunity</text><text x="980" y="400" text-anchor="middle">Task Plan</text><text x="1140" y="400" text-anchor="middle">候选投递</text><text x="1300" y="400" text-anchor="middle">选择/回填</text></g><text x="302" y="482" class="s">普通内容：系统生成并规则预检 → Telegram 内部目标投递 → 小陈选择、手动发布并回填实际链接。</text>
  <text x="276" y="566" class="t">我的选择与发布待办</text><rect x="276" y="588" width="1106" height="190" rx="14" class="card"/><text x="302" y="626" class="xs">对象</text><text x="594" y="626" class="xs">候选 / 状态</text><text x="864" y="626" class="xs">剩余窗口</text><text x="1086" y="626" class="xs">下一步</text><line x1="302" y1="642" x2="1356" y2="642" stroke="#d9e0ea"/>
  <text x="302" y="682" class="t">监管听证会快讯</text><text x="594" y="682" class="s">3 条预检通过 · 尚未选择</text><text x="864" y="682" class="s">12 分钟</text><rect x="1086" y="656" width="218" height="42" rx="8" class="btn"/><text x="1195" y="682" text-anchor="middle" class="s w">选择候选并发布</text>
  <line x1="302" y1="720" x2="1356" y2="720" stroke="#d9e0ea"/><text x="302" y="754" class="t">市场异动解释串</text><text x="594" y="754" class="s">已选择 1 条 · 等待链接回填</text><text x="864" y="754" class="s">4 分钟</text><text x="1086" y="754" class="s">粘贴实际帖子链接</text>
  <text x="276" y="836" class="xs">规则预检通过不等同于人工审核、平台发布成功或平台回执；点击异常不能以关闭通知替代对象恢复。</text>
</svg>
