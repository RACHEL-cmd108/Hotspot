<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">普通社媒内容选择与发布交接</title>
  <desc id="desc">普通内容显示至少三条规则预检候选，由内容运营选择一条、手动发布并回填实际链接；规则预检不被表示为人工审核或平台成功。</desc>
  <style>.bg{fill:#f6f8fb}.nav{fill:#172131}.card{fill:#fff;stroke:#d9e0ea;stroke-width:1.5}.selected{fill:#f5f8ff;stroke:#2563eb;stroke-width:2}.b{fill:#eaf1ff}.g{fill:#e7f7ef}.a{fill:#fff5df}.t{font:700 18px system-ui;fill:#18212f}.h{font:700 26px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.xs{font:12px system-ui;fill:#667085}.w{fill:#fff}.btn{fill:#2563eb}.line{stroke:#d9e0ea}</style>
  <rect class="bg" width="1440" height="900"/><rect class="nav" width="236" height="900"/><text x="28" y="54" class="t w">Hotspot Monitor</text><text x="30" y="118" class="s w">工作台</text><text x="30" y="162" class="s w">热点与事件</text><text x="30" y="206" class="s w">机会</text><rect x="18" y="222" width="200" height="42" rx="8" fill="#334a69"/><text x="32" y="249" class="s w">任务中心</text>
  <text x="276" y="52" class="s">Event EV-1842 › Task Plan TP-204 › Content Deliverable Draft</text><text x="276" y="90" class="h">选择社媒内容并交接发布</text><text x="276" y="118" class="s">普通内容 · 低风险 · 规则预检通过；小陈选择后在 X 手动发布，系统只记录实际链接与回执。</text>
  <rect x="276" y="146" width="810" height="556" rx="14" class="card"/><text x="302" y="184" class="t">三个可选候选</text><text x="302" y="212" class="xs">均引用 Event Card v3 的确认事实；可以查看差异、来源与预检明细。</text>
  <g transform="translate(302 238)"><rect width="758" height="116" rx="10" class="selected"/><circle cx="28" cy="30" r="10" fill="#2563eb"/><circle cx="28" cy="30" r="4" fill="#fff"/><text x="54" y="34" class="t">候选 A · 快讯</text><text x="54" y="62" class="s">美国参议院加密监管听证会已提前举行，市场正在重新定价监管时间表。</text><text x="54" y="94" class="xs">274 / 280 · 事实 6/6 · 来源完整 · 风险规则通过</text></g>
  <g transform="translate(302 370)"><rect width="758" height="116" rx="10" class="card"/><circle cx="28" cy="30" r="10" fill="#fff" stroke="#aab6c6"/><text x="54" y="34" class="t">候选 B · 解释串首帖</text><text x="54" y="62" class="s">时间变更意味着什么？用三个问题理解监管听证会与相关市场信号。</text><text x="54" y="94" class="xs">241 / 280 · 事实 6/6 · 来源完整 · 风险规则通过</text></g>
  <g transform="translate(302 502)"><rect width="758" height="116" rx="10" class="card"/><circle cx="28" cy="30" r="10" fill="#fff" stroke="#aab6c6"/><text x="54" y="34" class="t">候选 C · 社群引导</text><text x="54" y="62" class="s">我们整理了事件时间线、来源与市场变化；先看事实，再参与讨论。</text><text x="54" y="94" class="xs">226 / 280 · 事实 6/6 · 来源完整 · 风险规则通过</text></g>
  <rect x="1110" y="146" width="282" height="556" rx="14" class="card"/><text x="1136" y="184" class="t">选择与发布</text><rect x="1136" y="212" width="230" height="98" rx="10" class="g"/><text x="1154" y="242" class="xs">规则预检</text><text x="1154" y="270" class="t">候选 A 通过</text><text x="1154" y="294" class="xs">不等同人工审核或发布成功</text><text x="1136" y="350" class="s">选择人：小陈</text><text x="1136" y="382" class="s">发布截止：11 分钟后</text><rect x="1136" y="418" width="230" height="42" rx="8" class="btn"/><text x="1251" y="444" text-anchor="middle" class="s w">复制候选 A</text><rect x="1136" y="474" width="230" height="42" rx="8" class="card"/><text x="1251" y="500" text-anchor="middle" class="s">在新标签打开 X</text><text x="1136" y="558" class="xs">发布后回填实际帖子链接</text><rect x="1136" y="574" width="230" height="40" rx="8" class="card"/><text x="1150" y="600" class="xs">https://x.com/…</text><text x="1136" y="656" class="xs">平台验证：尚未开始</text>
  <rect x="276" y="728" width="1116" height="124" rx="14" class="a"/><text x="302" y="764" class="t">交接后的状态语义</text><text x="302" y="794" class="s">人工选择 → 待交接；小陈接收后 → 进行中；链接回填是人工声明，平台验证与指标回收仍需独立回执。</text><text x="302" y="824" class="s">修改候选需重新预检；高风险内容不走本流程，转入审核/修订工作区。</text>
</svg>
