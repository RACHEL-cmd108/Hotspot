<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">热点情报中心产品模块架构</title>
  <desc id="desc">展示系统主动发现如何形成 Event、Discussion 和 X/YouTube Hot Content，以及热点情报中心的自动分析产出和下游边界。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#183c34" flood-opacity=".09"/></filter>
    <style>
      .title{font:700 30px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}.sub{font:400 14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#687672}.heading{font:700 19px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}.section{font:700 11px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#126153;letter-spacing:.8px}.text{font:400 12.5px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#52615d}.strong{font:650 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#273834}.number{font:700 12px Inter,system-ui,sans-serif;fill:#126153}.output{font:650 11.5px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#273834}.foot{font:650 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f5f8f6"/>
  <text x="60" y="61" class="title">热点情报中心 · 产品模块架构</text>
  <text x="60" y="91" class="sub">配置内主动发现 → 后台 Agent 自动识别与分析 → 形成可复用情报对象；第一期无链接提交和开放对话</text>

  <g filter="url(#shadow)"><rect x="60" y="126" width="340" height="526" rx="18" fill="#fff"/><rect x="430" y="126" width="340" height="526" rx="18" fill="#fff"/><rect x="800" y="126" width="340" height="526" rx="18" fill="#fff"/></g>

  <rect x="60" y="126" width="340" height="74" rx="18" fill="#e3f2ed"/><rect x="60" y="182" width="340" height="18" fill="#e3f2ed"/>
  <circle cx="96" cy="163" r="18" fill="#fff"/><text x="96" y="168" text-anchor="middle" class="number">01</text><text x="127" y="160" class="heading">Event 情报</text><text x="127" y="181" class="text">发生了什么，以及为什么现在值得响应</text>
  <text x="86" y="229" class="section">固定来源</text><text x="86" y="255" class="strong">X 热搜榜</text><text x="176" y="255" class="text">地区榜 · Top N · 趋势快照</text><text x="86" y="279" class="strong">未来事件</text><text x="176" y="279" class="text">时间/时区 · 来源 · 观察窗口</text>
  <line x1="86" y1="299" x2="374" y2="299" stroke="#dce7e3"/>
  <text x="86" y="326" class="section">核心处理</text><text x="86" y="352" class="text">单个或多个 Signal → 识别明确现实变化</text><text x="86" y="374" class="text">匹配/去重 → 正式、候选、更新或拆分 Event</text><text x="86" y="396" class="text">形成榜单变化标签与 Response Moment</text>
  <line x1="86" y1="416" x2="374" y2="416" stroke="#dce7e3"/>
  <text x="86" y="443" class="section">主要产品产出</text>
  <rect x="86" y="459" width="132" height="25" rx="6" fill="#e3f2ed"/><text x="98" y="476" class="output">Event Record</text><rect x="225" y="459" width="149" height="25" rx="6" fill="#f3f7f5"/><text x="237" y="476" class="output">Trend Footprint</text>
  <rect x="86" y="491" width="132" height="25" rx="6" fill="#f3f7f5"/><text x="98" y="508" class="output">Fact / Evidence</text><rect x="225" y="491" width="149" height="25" rx="6" fill="#f3f7f5"/><text x="237" y="508" class="output">Event Timeline</text>
  <rect x="86" y="523" width="132" height="25" rx="6" fill="#f3f7f5"/><text x="98" y="540" class="output">Context Pack</text><rect x="225" y="523" width="149" height="25" rx="6" fill="#f3f7f5"/><text x="237" y="540" class="output">Response Moment</text>
  <text x="86" y="581" class="section">看板呈现</text><text x="86" y="606" class="text">事件卡 · 趋势标签 · 事实状态 · 完整事件档案</text><text x="86" y="628" class="text">例外：无法收敛为现实变化时保留 Trend Signal</text>

  <rect x="430" y="126" width="340" height="74" rx="18" fill="#eaf2fa"/><rect x="430" y="182" width="340" height="18" fill="#eaf2fa"/>
  <circle cx="466" cy="163" r="18" fill="#fff"/><text x="466" y="168" text-anchor="middle" class="number">02</text><text x="497" y="160" class="heading">Discussion 洞察</text><text x="497" y="181" class="text">重点圈层正在讨论什么，分歧在哪里</text>
  <text x="456" y="229" class="section">主动发现来源</text><text x="456" y="255" class="strong">X 主题圈</text><text x="545" y="255" class="text">重点账号 · 主题关键词</text><text x="456" y="279" class="strong">热搜代表帖</text><text x="545" y="279" class="text">观点 · 争议 · 情绪</text>
  <line x1="456" y1="299" x2="744" y2="299" stroke="#dce7e3"/>
  <text x="456" y="326" class="section">核心处理</text><text x="456" y="352" class="text">单条或多条 Signal → 识别注意力对象并去重</text><text x="456" y="374" class="text">分析观点、争议焦点、用户问题与代表内容</text><text x="456" y="396" class="text">来源可追溯；观点传播不等于事实成立</text>
  <line x1="456" y1="416" x2="744" y2="416" stroke="#dce7e3"/>
  <text x="456" y="443" class="section">主要产品产出</text>
  <rect x="456" y="459" width="132" height="25" rx="6" fill="#eaf2fa"/><text x="468" y="476" class="output">Discussion Record</text><rect x="595" y="459" width="149" height="25" rx="6" fill="#f4f7fb"/><text x="607" y="476" class="output">Attention Snapshot</text>
  <rect x="456" y="491" width="132" height="25" rx="6" fill="#f4f7fb"/><text x="468" y="508" class="output">Viewpoint Map</text><rect x="595" y="491" width="149" height="25" rx="6" fill="#f4f7fb"/><text x="607" y="508" class="output">Representative Posts</text>
  <rect x="456" y="523" width="132" height="25" rx="6" fill="#f4f7fb"/><text x="468" y="540" class="output">Controversy / Q&amp;A</text><rect x="595" y="523" width="149" height="25" rx="6" fill="#f4f7fb"/><text x="607" y="540" class="output">Discussion Analysis</text>
  <text x="456" y="581" class="section">看板呈现</text><text x="456" y="606" class="text">讨论卡 · 扩圈/争议标签 · 观点地图 · 讨论档案</text><text x="456" y="628" class="text">边界：观点传播不等于事实成立</text>

  <rect x="800" y="126" width="340" height="74" rx="18" fill="#f0ecfa"/><rect x="800" y="182" width="340" height="18" fill="#f0ecfa"/>
  <circle cx="836" cy="163" r="18" fill="#fff"/><text x="836" y="168" text-anchor="middle" class="number">03</text><text x="867" y="160" class="heading">X / YouTube 热门内容</text><text x="867" y="181" class="text">哪些具体内容值得拆解，哪些机制可迁移</text>
  <text x="826" y="229" class="section">主动发现来源</text><text x="826" y="255" class="strong">X 帖子</text><text x="906" y="255" class="text">热搜代表帖 · 主题圈帖子</text><text x="826" y="279" class="strong">YouTube</text><text x="906" y="279" class="text">官方热门 · 关键词 · 重点频道</text>
  <line x1="826" y1="299" x2="1114" y2="299" stroke="#dce7e3"/>
  <text x="826" y="326" class="section">核心处理</text><text x="826" y="352" class="text">系统主动发现 → 去重 → 获取原文/字幕与公开数据</text><text x="826" y="374" class="text">按帖子/视频识别 Hook、结构与表达机制</text><text x="826" y="396" class="text">分析可迁移因素、不可复制条件与数据边界</text>
  <line x1="826" y1="416" x2="1114" y2="416" stroke="#dce7e3"/>
  <text x="826" y="443" class="section">主要产品产出</text>
  <rect x="826" y="459" width="132" height="25" rx="6" fill="#f0ecfa"/><text x="838" y="476" class="output">Hot Content Sample</text><rect x="965" y="459" width="149" height="25" rx="6" fill="#f7f5fb"/><text x="977" y="476" class="output">Performance Snapshot</text>
  <rect x="826" y="491" width="132" height="25" rx="6" fill="#f7f5fb"/><text x="838" y="508" class="output">Content Structure</text><rect x="965" y="491" width="149" height="25" rx="6" fill="#f7f5fb"/><text x="977" y="508" class="output">Audience Response</text>
  <rect x="826" y="523" width="132" height="25" rx="6" fill="#f7f5fb"/><text x="838" y="540" class="output">Content Insight</text><rect x="965" y="523" width="149" height="25" rx="6" fill="#f7f5fb"/><text x="977" y="540" class="output">Transferable Playbook</text>
  <text x="826" y="581" class="section">看板呈现</text><text x="826" y="606" class="text">帖子/视频卡 · 表现标签 · 拆解摘要 · 内容洞察</text><text x="826" y="628" class="text">边界：当前公开表现，不承诺因果归因或爆款预测</text>

  <rect x="60" y="686" width="1080" height="83" rx="14" fill="#126153"/>
  <text x="88" y="716" class="foot">统一交付给运营决策中心</text><text x="88" y="742" style="font:400 13px Inter,system-ui,-apple-system,'PingFang SC',sans-serif;fill:#d9eee8">可检索对象 + 最新分析版本 + 来源与证据 + 热度/注意力标签 + 数据完整度 + 风险与表达边界</text>
  <text x="88" y="760" style="font:400 11px Inter,system-ui,-apple-system,'PingFang SC',sans-serif;fill:#a9d3c7">后台 Agent 自动分析；无链接提交/开放对话；本中心不决定运营角度、不生成草稿、不自动发布</text>
</svg>
