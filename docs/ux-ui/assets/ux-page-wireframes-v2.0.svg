<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">热点运营系统关键页面线框图</title><desc id="desc">PG-01至PG-07的低保真页面骨架，说明每个页面的稳定区域和主要跳转。</desc>
  <style>.bg{fill:#f5f8f7}.title{font:700 29px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172421}.sub,.txt{font:400 13px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#61716d}.panel{fill:#fff;stroke:#c9d8d5;stroke-width:1.4}.bar{fill:#0b756d}.nav{fill:#e9f1ef}.block{fill:#f3f7f6;stroke:#d9e4e1;stroke-width:1}.accent{fill:#e5f3f0;stroke:#83bdb5;stroke-width:1}.alert{fill:#fbf1ea;stroke:#e1ad8e;stroke-width:1}.wire{stroke:#a2b4b0;stroke-width:1}.name{font:700 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18332e}.small{font:600 11px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#526561}.hint{font:400 11px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6d7e7a}.flow{stroke:#087b71;stroke-width:1.7;fill:none;marker-end:url(#a)} </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#087b71"/></marker></defs>
  <rect class="bg" width="1800" height="1120"/><text x="50" y="52" class="title">关键页面低保真线框 · PG-01—PG-07</text><text x="50" y="80" class="sub">稳定骨架与主要工作区域。绿色箭头为高频跨页跳转；具体字段、状态和权限以 ux-04 / ux-05 为准。</text>
  <!-- common shell helper represented in every panel -->
  <g transform="translate(50 115)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-01 运营总览</text><rect x="101" y="84" width="372" height="47" class="accent"/><text x="115" y="107" class="small">结果指标：时间范围、口径、表现与首发用时</text><rect x="101" y="143" width="215" height="104" class="block"/><text x="115" y="166" class="small">结果趋势 / 账号表现</text><rect x="328" y="143" width="145" height="104" class="alert"/><text x="341" y="166" class="small">仅人工介入</text><text x="341" y="184" class="hint">异常、待选、待回填</text></g>
  <g transform="translate(650 115)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-02 热点监测</text><rect x="101" y="84" width="372" height="29" class="block"/><text x="114" y="104" class="small">平台 → 地区筛选 · Top30 · 快照时间</text><rect x="101" y="125" width="242" height="122" class="block"/><text x="115" y="148" class="small">热搜排行榜（原始趋势项）</text><line x1="115" y1="160" x2="327" y2="160" class="wire"/><line x1="115" y1="181" x2="327" y2="181" class="wire"/><line x1="115" y1="202" x2="327" y2="202" class="wire"/><rect x="355" y="125" width="118" height="122" class="accent"/><text x="367" y="148" class="small">重点主题</text><text x="367" y="166" class="hint">跨区聚合</text><text x="367" y="198" class="hint">热点内容：预留</text></g>
  <g transform="translate(1250 115)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-03 运营排期</text><rect x="101" y="84" width="372" height="29" class="block"/><text x="114" y="104" class="small">类别 / 来源 / 确认状态 / 准备状态筛选</text><rect x="101" y="125" width="235" height="122" class="block"/><text x="115" y="148" class="small">月历与 Future Event</text><path d="M115 164H321M115 184H321M115 204H321M165 164V226M215 164V226M265 164V226" class="wire"/><rect x="348" y="125" width="125" height="122" class="accent"/><text x="360" y="148" class="small">事件详情</text><text x="360" y="168" class="hint">来源 / 窗口</text><text x="360" y="190" class="hint">预热 / 活动入口</text></g>
  <g transform="translate(50 475)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-04 事件管理</text><rect x="101" y="84" width="120" height="163" class="block"/><text x="112" y="107" class="small">Event 列表</text><line x1="112" y1="121" x2="210" y2="121" class="wire"/><line x1="112" y1="147" x2="210" y2="147" class="wire"/><line x1="112" y1="173" x2="210" y2="173" class="wire"/><rect x="233" y="84" width="240" height="163" class="accent"/><text x="246" y="107" class="small">Event Card / 研判详情</text><text x="246" y="129" class="hint">事实 · Evidence · 窗口 · 风险</text><rect x="246" y="143" width="95" height="24" class="block"/><text x="255" y="159" class="hint">校正 / 合并</text><rect x="349" y="143" width="110" height="24" class="block"/><text x="359" y="159" class="hint">查看账号任务</text><text x="246" y="192" class="hint">活动准备建议（并行入口）</text></g>
  <g transform="translate(650 475)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-05 内容发布</text><rect x="101" y="84" width="372" height="29" class="block"/><text x="114" y="104" class="small">账号任务筛选：Event · 账号 · 状态 · 风险</text><rect x="101" y="125" width="155" height="122" class="block"/><text x="113" y="148" class="small">账号响应任务</text><line x1="113" y1="164" x2="244" y2="164" class="wire"/><line x1="113" y1="188" x2="244" y2="188" class="wire"/><rect x="268" y="125" width="205" height="122" class="accent"/><text x="281" y="148" class="small">同账号候选 A / B / C</text><text x="281" y="170" class="hint">预检 → 选择 / 调整 / 复制</text><rect x="281" y="194" width="178" height="34" class="block"/><text x="294" y="215" class="small">URL 或失败原因回填</text></g>
  <g transform="translate(1250 475)"><rect width="500" height="275" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="205" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-06 复盘优化</text><rect x="101" y="84" width="372" height="29" class="block"/><text x="114" y="104" class="small">Event / 账号 / Skill / 规则 / 观察窗口筛选</text><rect x="101" y="125" width="180" height="122" class="block"/><text x="114" y="148" class="small">表现结果与口径</text><text x="114" y="170" class="hint">来源 / 更新时间 / 缺失状态</text><rect x="293" y="125" width="180" height="122" class="accent"/><text x="306" y="148" class="small">优化建议</text><text x="306" y="170" class="hint">证据 / 影响 / 版本差异</text><text x="306" y="192" class="hint">批准后进入设置草稿</text></g>
  <g transform="translate(650 830)"><rect width="500" height="225" rx="12" class="panel"/><rect width="500" height="34" rx="12" class="bar"/><rect y="24" width="500" height="10" fill="#0b756d"/><rect x="14" y="51" width="72" height="155" class="nav"/><text x="27" y="75" class="small">一级导航</text><text x="101" y="70" class="name">PG-07 系统设置</text><rect x="101" y="84" width="120" height="122" class="block"/><text x="113" y="108" class="small">设置分类</text><text x="113" y="129" class="hint">数据源 / 主题</text><text x="113" y="148" class="hint">账号 / Skill</text><text x="113" y="167" class="hint">规则 / 风险</text><rect x="233" y="84" width="240" height="122" class="accent"/><text x="246" y="108" class="small">配置详情与影响预览</text><text x="246" y="130" class="hint">编辑 → 草稿 → 差异 → 授权发布</text><text x="246" y="151" class="hint">回滚与审计</text></g>
  <path d="M550 625H650" class="flow"/><path d="M1150 625H1250" class="flow"/><path d="M1500 750V815H1100V830" class="flow"/><path d="M1500 390V430H300V475" class="flow"/><text x="558" y="614" class="small">Event</text><text x="1156" y="614" class="small">任务</text><text x="1300" y="806" class="small">批准的优化建议</text><text x="710" y="421" class="small">实时趋势 / Future Event 在事件中心汇合</text>
</svg>
