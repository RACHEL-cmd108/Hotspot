<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">运营决策中心第一期产品模块架构</title>
  <desc id="d">后台 Agent 从 Event、Discussion 和 Hot Content Sample 判断运营机会并推荐承接角度。Event 与 Discussion 仅阅读分析，只有 Hot Content 可以通过结构化条件进入内容生成。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#183c34" flood-opacity=".1"/></filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7da99d"/></marker>
    <style>
      .title{font:700 30px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}
      .sub{font:400 14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#687672}
      .h{font:700 20px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172522}
      .p{font:400 14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#52615d}
      .num{font:700 12px Inter,system-ui,sans-serif;fill:#126153}
      .label{font:700 13px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#126153}
      .white{font:600 15px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#fff}
      .arrow{stroke:#7da99d;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#9db8b1;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f5f8f6"/>
  <text x="60" y="60" class="title">运营决策中心 · 第一期产品模块架构</text>
  <text x="60" y="89" class="sub">后台 Agent 自动判断机会并推荐 Angle；用户侧不提供开放式对话</text>

  <rect x="60" y="122" width="1080" height="68" rx="14" fill="#eaf2fa"/>
  <text x="90" y="149" class="label">上游输入</text>
  <text x="90" y="174" class="p">Event / Discussion / Hot Content Sample　·　Context Pack / Content Insight　·　Evidence　·　Response Moment　·　项目配置</text>

  <path d="M600 190V224" class="arrow"/>
  <g filter="url(#s)">
    <rect x="270" y="225" width="660" height="96" rx="18" fill="#fff"/>
  </g>
  <circle cx="310" cy="260" r="18" fill="#f0ecfa"/><text x="310" y="265" text-anchor="middle" class="num">AI</text>
  <text x="343" y="266" class="h">后台 Agent 判断层</text>
  <text x="310" y="298" class="p">机会成立性 · 为什么是现在 · 响应窗口 · 风险与限制 · 推荐 Angle · 无法判断</text>

  <path d="M470 321V364" class="arrow"/>
  <path d="M730 321V364" class="arrow"/>
  <g filter="url(#s)">
    <rect x="60" y="365" width="340" height="220" rx="18" fill="#fff"/>
    <rect x="430" y="365" width="340" height="220" rx="18" fill="#fff"/>
    <rect x="800" y="365" width="340" height="220" rx="18" fill="#fff"/>
  </g>

  <circle cx="98" cy="405" r="18" fill="#fff0e6"/><text x="98" y="410" text-anchor="middle" class="num">01</text>
  <text x="130" y="411" class="h">今日运营机会</text>
  <text x="90" y="454" class="p">• 三类对象混合机会流</text>
  <text x="90" y="484" class="p">• 可解释标签与动态排序</text>
  <text x="90" y="514" class="p">• 推荐 Angle、窗口与风险</text>
  <text x="90" y="544" class="p">• 收藏、观察、采用与纠错</text>

  <circle cx="468" cy="405" r="18" fill="#eaf2fa"/><text x="468" y="410" text-anchor="middle" class="num">02</text>
  <text x="500" y="411" class="h">对象阅读详情</text>
  <text x="460" y="454" class="p">• Event Context Pack</text>
  <text x="460" y="484" class="p">• Discussion Analysis</text>
  <text x="460" y="514" class="p">• Hot Content Insight</text>
  <text x="460" y="544" class="p">• 来源、版本、机会与 Angle</text>
  <rect x="462" y="558" width="276" height="22" rx="11" fill="#f6e9e7"/>
  <text x="600" y="574" text-anchor="middle" style="font:600 12px Inter,system-ui,-apple-system,'PingFang SC',sans-serif;fill:#9b4f43">无聊天 · 无自由追问 · 无补充研究</text>

  <circle cx="838" cy="405" r="18" fill="#e3f2ed"/><text x="838" y="410" text-anchor="middle" class="num">03</text>
  <text x="870" y="411" class="h">热门内容结构化生成</text>
  <text x="830" y="454" class="p">• 仅 Hot Content 可进入</text>
  <text x="830" y="484" class="p">• 选择系统推荐 Angle</text>
  <text x="830" y="514" class="p">• 填写受众、形式、语气等</text>
  <text x="830" y="544" class="p">• 形成 Generation Request</text>

  <path d="M970 585V627" class="arrow"/>
  <rect x="60" y="627" width="1080" height="76" rx="14" fill="#126153"/>
  <text x="90" y="657" style="font:700 13px Inter,system-ui,-apple-system,'PingFang SC',sans-serif;fill:#d9eee8">交付内容运营中心（仅 Hot Content）</text>
  <text x="90" y="685" class="white">来源对象与版本　·　Selected Angle　·　Generation Request　·　风险与表达边界　→　社媒草稿 / 视频参考脚本</text>

  <path d="M230 585V665H60" class="dash"/>
  <text x="215" y="613" text-anchor="end" class="sub">反馈回流排序与复盘</text>
  <text x="600" y="738" text-anchor="middle" class="sub">Event / Discussion 只读分析，不直接生成；第一期不含链接即时解析与 Object Workspace</text>
</svg>
