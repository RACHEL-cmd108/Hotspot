    .bg{fill:#f6f8fb}.nav{fill:#172131}.card{fill:#fff;stroke:#d9e0ea;stroke-width:1.5}.selected{fill:#f5f8ff;stroke:#2563eb;stroke-width:2}.off{fill:#fafbfc;stroke:#d9e0ea;stroke-width:1.5}.warn{fill:#fff5df;stroke:#e3ab43;stroke-width:1.5}.blue{fill:#eaf1ff}.purple{fill:#f1edff}.green{fill:#e7f7ef}.t{font:700 18px system-ui;fill:#18212f}.h{font:700 26px system-ui;fill:#18212f}.s{font:14px system-ui;fill:#667085}.xs{font:12px system-ui;fill:#667085}.w{fill:#fff}.btn{fill:#2563eb}.line{stroke:#9cbcff;stroke-width:2;fill:none}.dash{stroke:#b6c0ce;stroke-width:2;stroke-dasharray:5 5;fill:none}
  </style>
