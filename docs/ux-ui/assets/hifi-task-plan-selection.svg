  <text x="276" y="50" class="s">Event EV-1842 › Opportunity OP-882（优先参与）› Task Plan TP-204</text>
  <text x="276" y="88" class="h">选择渠道组合</text><text x="276" y="116" class="s">系统已生成方案 v4；在此选择四类行动，不重新决定这个热点是否参与。</text>
  <rect x="276" y="142" width="1116" height="76" rx="12" class="blue"/>
