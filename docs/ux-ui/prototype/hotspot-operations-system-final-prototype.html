function overview(){return head('运营总览','先看运营结果，再处理异常、任务进度与当前热点。','<button class="btn">过去7天⌄</button><button class="btn primary" data-go="tasks">进入任务中心</button>')+`<section class="stats"><div class="stat"><label>48小时表现良好率</label><strong>71%</strong><span class="small">27/38 条达到1,000+浏览</span></div>${[['总浏览量','1.82M','↑18.6%'],['互动总量','42.6K','↑9.4%'],['已发布内容','38','9个账号'],['平均首发用时','12m','↓3分钟']].map(x=>`<div class="stat"><label>${x[0]}</label><strong>${x[1]}</strong><span class="delta">${x[2]}</span></div>`).join('')}</section><div class="two grid" style="margin-top:14px"><section class="card"><h2>结果趋势</h2>${chart()}</section><section class="card"><h2>需要人工处理</h2>${[['red','稳定币法案','生成3次失败'],['','GPT-6快讯','候选待选择'],['','美国CPI','待URL回填']].map(x=>`<div class="attention"><i class="severity ${x[0]}"></i><span><b>${x[1]}</b><br><small class="muted">${x[2]}</small></span><button class="btn mini" data-go="tasks">处理</button></div>`).join('')}</section></div><div class="section"><div><h2>当前榜单重点</h2><p class="small">只做聚合摘要；完整排行榜在热点监测</p></div><button class="btn link" data-go="monitor">查看Top30 →</button></div><div class="three grid">${TREND.Worldwide.slice(0,3).map(x=>`<div class="topic"><span class="number">#${x.rank}</span><h3>${x.name}</h3><span class="small">${x.change} · ${x.heat}</span></div>`).join('')}</div>`}
function monitor(){return head('热点监测','完整呈现和聚合各地区排行榜；是否进入响应由事件库承接。','<button class="btn">最近成功采集 10:00</button><button class="btn primary" data-action="refresh">立即采集</button>')+`<div class="subtabs">${[['ranking','热搜排行榜'],['topics','重点主题追踪'],['regions','跨区聚合'],['content','热点内容']].map(x=>`<button class="subtab ${S.mt===x[0]?'active':''}" data-mt="${x[0]}">${x[1]}</button>`).join('')}</div>${S.mt==='ranking'?ranking():S.mt==='topics'?topics():S.mt==='regions'?regionsView():hotContent()}`}
function ranking(){const rows=TREND[S.region];return `<section class="card"><div class="card-head"><div class="filters"><select class="filter" id="regionFilter">${regions.map(x=>`<option ${x===S.region?'selected':''}>${x}</option>`).join('')}</select><button class="btn">当前Top30</button><button class="btn">对比09:00快照</button></div><span class="small">共30条 · 其中${rows.filter(x=>x.signal==='已触发').length}条满足自动触发</span></div><div class="ranking header"><span>排名</span><span>热搜词/话题</span><span>变化</span><span>热度量级</span><span>聚合状态</span><span>操作</span></div>${rows.map(x=>`<div class="ranking"><strong>#${x.rank}</strong><span><b>${x.name}</b><br><small class="muted">${S.region}榜单原始条目</small></span>${tag(x.change,x.change.includes('↑')?'orange':x.rank<=5?'green':'')}<span>${x.heat}</span>${tag(x.signal,x.signal==='已触发'?'green':'')}<button class="btn link" data-action="trend-detail">查看聚合 →</button></div>`).join('')}</section><div class="note">此页保留完整Top30。满足前5、上升≥10位、重点主题或跨区条件的条目由系统在后台形成或归并Event，但排行榜本身不因此消失。</div>`}

function hotContent(){return `<div class="note"><b>热点内容分析入口</b><br>这里承载后续的热点叙事、热门帖子结构、传播账号、观点分歧和内容机会分析，不与事件响应流程混在一起。</div><div class="content-module">${[['叙事与口径','识别同一热点正在传播的主要叙事、不同说法和变化。'],['热门内容拆解','分析高互动帖子的标题、结构、表达形式和视觉素材。'],['传播网络','分析主要传播账号、地区扩散与讨论群体。']].map(x=>`<article class="content-card"><h2>${x[0]}</h2><p>${x[1]}</p>${tag('后续模块','orange')}<br><button class="btn link" data-action="content-module">查看模块规划 →</button></article>`).join('')}</div>`}
function eventCenter(){let list=E.filter(e=>S.eventStatus==='全部'||e.status===S.eventStatus);const e=list.find(x=>x.id===S.event)||list[0];if(e)S.event=e.id;return head('事件中心','管理已经形成的Event、自动响应状态与异常纠错。','<select class="filter" id="eventStatus"><option>全部</option>'+['内容生成中','待发布','处理异常','已完成'].map(x=>`<option ${x===S.eventStatus?'selected':''}>${x}</option>`).join('')+'</select><button class="btn" data-event-library>已完成事件库</button>')+`<div class="event-layout"><aside class="event-list"><input class="filter" style="width:100%;margin-bottom:7px" placeholder="搜索Event">${list.length?list.map(x=>`<button class="event-item ${e&&x.id===e.id?'active':''}" data-event="${x.id}"><b>${x.title}</b><br><span class="small">${x.status} · ${x.regions}</span><div style="margin-top:5px">${tag(x.verify,x.verify==='存在冲突'?'red':'green')}</div></button>`).join(''):'<div class="note">当前状态下没有Event。</div>'}</aside>${e?eventDetail(e):'<section class="event-detail">请选择其他状态。</section>'}</div>`}
function eventDetail(e){return `<section class="event-detail"><div class="card-head"><div><span class="small">EV-${1841+E.indexOf(e)} · 最近更新3分钟前</span><h1 style="font-size:21px">${e.title}</h1><div class="inline">${tag(e.status,e.status==='处理异常'?'red':e.status==='已完成'?'green':'orange')}${tag(e.verify,e.verify==='存在冲突'?'red':'green')}</div></div><button class="btn primary" data-go="tasks">查看账号任务</button></div><div class="fact"><b>一句话事实摘要</b><br>${e.summary}</div><div class="event-metrics"><div class="event-metric"><small class="muted">地区</small><br><b>${e.regions}</b></div><div class="event-metric"><small class="muted">触发原因</small><br><b>${e.trigger}</b></div><div class="event-metric"><small class="muted">依据数量</small><br><b>${e.urls.length}</b></div><div class="event-metric"><small class="muted">任务进度</small><br><b>2/3</b></div></div><div class="event-actions"><button class="btn" data-event-action="correct">校正摘要/依据</button><button class="btn" data-event-action="merge">合并Event</button><button class="btn" data-event-action="split">拆分Event</button><button class="btn" data-event-action="relate">管理关联</button></div><h2>事实依据</h2>${e.urls.map((u,i)=>`<div class="evidence"><span><b>依据 ${i+1}</b><a class="url" href="${u}" target="_blank" rel="noreferrer">${u}</a><small class="muted">X默认热门排序 · 原帖来源</small></span><a class="btn mini" href="${u}" target="_blank" rel="noreferrer">打开原帖 ↗</a></div>`).join('')}<h2 style="margin-top:18px">关联Event</h2>${e.related.length?e.related.map(x=>`<div class="relation"><b>${x}</b><br><small class="muted">用于当前内容上下文，不覆盖旧Event。</small></div>`).join(''):'<div class="note">暂时没有关联Event。</div>'}${e.status==='已完成'?`<h2 style="margin-top:18px">已发布结果</h2><div class="three grid"><div class="event-metric"><small>已发布账号</small><br><b>3</b></div><div class="event-metric"><small>累计浏览</small><br><b>28.4K</b></div><div class="event-metric"><small>累计互动</small><br><b>1,240</b></div></div>`:''}</section>`}
function futureCenter(){let list=F.filter(f=>(S.futureCategory==='全部'||f.category===S.futureCategory)&&(S.futureGrade==='全部'||f.grade===S.futureGrade)&&(S.futureSource==='全部'||f.source===S.futureSource)&&(S.futureAction==='全部'||f.action===S.futureAction));const f=list.find(x=>x.id===S.future)||list[0];if(f)S.future=f.id;return head('未来事件中心','用来源和证据持续追踪尚未发生的事件，在窗口期前完成内容与活动准备。','<button class="btn">批量导入</button><button class="btn primary" data-action="add-future">+添加事件</button>')+`<div class="filter-purpose"><div class="purpose"><b>类别</b><br><small>聚焦不同运营工作域</small></div><div class="purpose"><b>证据等级</b><br><small>决定可公开表达程度</small></div><div class="purpose"><b>来源</b><br><small>识别官方、内置或人工</small></div><div class="purpose"><b>需要行动</b><br><small>提取已进入准备窗口的事件</small></div></div><section class="card" style="margin-bottom:14px"><div class="filters"><select class="filter" id="fc"><option>全部</option>${['宏观','体育','科技','节日'].map(x=>`<option ${x===S.futureCategory?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="fg"><option>全部</option>${['A','B','C','D'].map(x=>`<option ${x===S.futureGrade?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="fs"><option>全部</option>${['官方','系统内置','人工导入'].map(x=>`<option ${x===S.futureSource?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="fa"><option>全部</option>${['需要行动','保持观察'].map(x=>`<option ${x===S.futureAction?'selected':''}>${x}</option>`).join('')}</select><span class="small">当前显示 ${list.length} 个事件</span></div></section><div class="calendar-layout"><section class="card"><div class="future-row table-head"><span>时间</span><span>未来事件</span><span>类别</span><span>证据</span><span>来源</span><span>行动</span></div>${list.length?list.map(x=>`<div class="future-row ${f&&x.id===f.id?'active':''}" data-future="${x.id}"><b>${x.date}</b><span><b>${x.title}</b><br><small class="muted">评分${x.score} · ${x.status}</small></span><span>${x.category}</span>${tag(x.grade,x.grade==='A'?'green function futureDetail(f){return `<aside class="event-detail"><span class="small">${f.category} · ${f.date}</span><h1 style="font-size:21px">${f.title}</h1><p>${f.summary}</p><div class="inline">${tag('证据'+f.grade,f.grade==='A'?'green':'orange')}${tag(f.status,f.status==='Activate'?'green':'orange')}<span class="score">${f.score}</span></div><h2 style="margin-top:16px">证据与来源</h2>${f.sources.map(s=>`<div class="source-row"><a href="${s[1]}" ${s[1]!=='#'?'target="_blank"':''}>${s[0]} ↗</a><br><small class="muted">${s[1]}</small><p>${s[2]}</p></div>`).join('')}<h2 style="margin-top:16px">窗口与准备</h2><div class="note"><b>${f.action}</b><br>${f.status==='Activate'?'已进入预热窗口，可以启动账号内容生成与活动探索。':'继续补充证据、关键词和背景，不使用确定口径发布。'}</div><button class="btn primary" style="width:100%;margin-bottom:8px" data-preheat="${f.title}">进入预热任务并生成内容</button><button class="btn" style="width:100%" data-campaign="${f.id}">查看3个营销活动候选</button></aside>`}
function taskCenter(){let list=T.filter(t=>(S.taskEvent==='全部'||t.event===S.taskEvent)&&(S.taskRole==='全部'||t.role===S.taskRole)&&(S.taskStatus==='全部'||t.status===S.taskStatus)&&(S.taskRisk==='全部'||t.risk===S.taskRisk));const t=list.find(x=>x.id===S.task)||list[0];if(t)S.task=t.id;return head('任务中心','筛选并执行每个账号对Event的一次响应任务。','<button class="btn">导出任务</button>')+`<section class="summary-grid">${[['进行中','6'],['待选择','2'],['待发布','1'],['异常','1'],['追踪中','8'],['今日完成','17']].map(x=>`<div class="summary-cell"><span class="small">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</section><section class="card"><div class="filters"><select class="filter" id="te"><option value="全部">Event：全部</option>${[...new Set(T.map(x=>x.event))].map(x=>`<option ${x===S.taskEvent?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="tr"><option value="全部">账号类型：全部</option>${[...new Set(T.map(x=>x.role))].map(x=>`<option ${x===S.taskRole?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="ts"><option value="全部">状态：全部</option>${[...new Set(T.map(x=>x.status))].map(x=>`<option ${x===S.taskStatus?'selected':''}>${x}</option>`).join('')}</select><select class="filter" id="tk"><option value="全部">风险：全部</option>${[...new Set(T.map(x=>x.risk))].map(x=>`<option ${x===S.taskRisk?'selected':''}>${x}</option>`).join('')}</select><span class="small">当前 ${list.length} 条任务</span></div><div class="task-head" style="margin-top:14px"><span>ID</span><span>账号任务</span><span>关联Event</span><span>状态</span><span>风险</span><span>时间</span></div>${list.length?list.map(x=>`<div class="task-row ${t&&x.id===t.id?'active':''}" data-task="${x.id}"><span>${x.code}</span><div class="account"><span class="account-icon">${x.account.slice(0,2)}</span><span><b>${x.account}</b><br><small class="muted">${x.role}</small></span></div><span>${x.event}</span>${tag(x.status,x.status==='异常'?'red':x.status.includes('待')?'orange':'green')}${tag(x.risk,x.risk==='中'?'orange':'green')}<span>${x. function taskDetail(t){return `<section class="card" id="taskDetail" style="margin-top:14px"><div class="card-head"><div><span class="small">${t.code} · ${t.role}</span><h2>${t.account} · ${t.event}</h2></div><button class="btn" data-open-event="${E.find(e=>e.title===t.event)?.id||'e1'}">Event依据 →</button></div>${t.copies.length?`<div class="candidate-grid">${t.copies.map((c,i)=>`<article class="candidate ${S.candidate===i?'selected':S.candidate!==null?'locked':''}"><b>候选${String.fromCharCode(65+i)}</b><div class="copy">${c}</div><div class="candidate-actions">${S.candidate===i?'<button class="btn" data-cancel>取消</button><button class="btn primary" data-copy>复制</button>':`<button class="btn" data-candidate="${i}" ${S.candidate!==null?'disabled':''}>选择</button>`}</div></article>`).join('')}</div><div class="task-tools"><div class="tool-box"><h3>与AI调整</h3><textarea placeholder="补充本轮生成要求"></textarea><button class="btn primary" data-action="regen">重新生成3条</button></div><div class="tool-box"><h3>发布回填</h3><input placeholder="X发布URL"><select><option>或选择发布失败原因</option><option>平台限制</option><option>内容过时</option><option>人工放弃</option></select><button class="btn primary" data-action="submit-task">提交回填</button></div></div>`:`<div class="note ${t.status==='异常'?'warning':''}"><b>${t.status==='异常'?'重试3次后生成失败':'正在生成3条候选'}</b><br><button class="btn primary" style="margin-top:8px" data-action="retry">重新运行</button></div>`}</section>`}

const TOPIC_TRENDS={AI:[['OpenAI GPT-6','Worldwide','98K','新上榜','e1'],['AI agents','United States','61K','↑ 14',null],['ChatGPT','United Kingdom','47K','↑ 8',null],['NVIDIA AI chips','Japan','39K','↑ 11','e5']],加密监管:[['Stablecoin Act','United States','72K','↑ 12','e3'],['Crypto ETF','Worldwide','54K','↑ 10',null],['SEC crypto rules','United States','36K','新上榜',null]],体育大赛:[['World Cup','Worldwide','92K','新上榜','e4'],['Champions League','United Kingdom','68K','↑ 15',null],['Premier League','Worldwide','43K','↑ 9',null]]};
const monitorNavigationCSS=document.createElement('style');monitorNavigationCSS.textContent=`
.topic-detail-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:14px}.topic-detail-summary{display:grid;grid-template-columns:1.5fr repeat(3,1fr);border:1px solid var(--line);background:#fff;margin-bottom:14px}.topic-detail-summary>div{padding:14px 16px;border-right:1px solid var(--line)}.topic-detail-summary>div:last-child{border:0}.topic-detail-summary strong{display:block;font-size:23px;color:var(--g)}.topic-trend-head,.topic-trend-row{display:grid;grid-template-columns:minmax(220px,1.5fr) 130px 100px 100px 130px 135px;gap:10px;align-items:center}.topic-trend-head{padding:9px;background:#edf2f2;color:var(--muted);font-size:11px}.topic-trend-row{padding:12px 9px;border-bottom:1px solid var(--line2)}.topic-trend-row:hover{background:#f5f9f8}.topic-spark{display:flex;align-items:flex-end;gap:2px;height:28px}.topic-spark i{display:block;width:5px;background:#8fc5bd}.topic-spark i:last-child{background:var(--g)}@media(max-width:1180px){.topic-detail-summary{grid-template-columns:repeat(2,1fr)}.topic-trend-head,.topic-trend-row{grid-template-columns:minmax(190px,1.5fr) 110px 90px 100px 120px}.topic-trend-head>:nth-child(3),.topic-trend-row>:nth-child(3){display:none}}
`;document.head.appendChild(monitorNavigationCSS);
function normalizedTrendName(name){return name.replace(/ 日本| 한국/g,'')}
function findEventForTrend(name){const n=normalizedTrendName(name);if(/GPT-6|OpenAI/i.test(n))return E.find(x=>x.id==='e1');if(/CPI/i.test(n))return E.find(x=>x.id==='e2');if(/Stablecoin/i.test(n))return E.find(x=>x.id==='e3');if(/World Cup/i.test(n))return E.find(x=>x.id==='e4');if(/NVIDIA/i.test(n))return E.find(x=>x.id==='e5');return null}
function ensureEventForTrend(name,region='Worldwide',rank='—'){const known=findEventForTrend(name);if(known)return known;const clean=normalizedTrendName(name),id='trend-'+clean.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+region.toLowerCase().replace(/[^a-z]+/g,'');let event=E.find(x=>x.id===id);if(!event){event={id,title:clean+'成为热搜上升话题',summary:`${clean}进入${region}热搜榜并出现明显讨论增长，系统已聚合该榜单条目及当前可取得的热门帖子。`,status:'内容生成中',verify:'信息一致',regions:region,trigger:`榜单第${rank}位 / 热点监测跳转`,urls:[`https://x.com/search?q=${encodeURIComponent(clean)}&src=trend_click&f=live`],related:[]};E.push(event)}return event}
ranking=function(){const rows=TREND[S.region];return `<section class="card"><div class="card-head"><div class="filters"><select class="filter" id="regionFilter">${regions.map(x=>`<option ${x===S.region?'selected':''}>${x}</option>`).join('')}</select><button class="btn">当前Top30</button><button class="btn">对比09:00快照</button></div><span class="small">共30条 · 其中${rows.filter(x=>x.signal==='已触发').length}条满足自动触发</span></div><div class="ranking header"><span>排名</span><span>热搜词/话题</span><span>变化</span><span>热度量级</span><span>聚合状态</span><span>操作</span></div>${rows.map((x,i)=>`<div class="ranking"><strong>#${x.rank}</strong><span><b>${x.name}</b><br><small class="muted">${S.region}榜单原始条目</small></span>${tag(x.change,x.change.includes('↑')?'orange':x.rank<=5?'green':'')}<span>${x.heat}</span>${tag(x.signal,x.signal==='已触发'?'green':'')}${x.signal==='已触发'?`<button class="btn link" data-trend-row="${i}">查看聚合 →</button>`:'<span class="small">尚未触发响应</span>'}</div>`).join('')}</section><div class="note">排行榜只承担热点呈现与聚合。已满足触发条件的条目可直接进入对应的实时响应Event；持续观察的条目不会提前创建响应Event。</div>`};
function topicDetailView(name){const items=TOPIC_TRENDS[name]||[];const cross=items.filter(x=>x[1]==='Worldwide').length+2;return `<div class="topic-detail-breadcrumb"><button class="btn link" data-topic-back>重点主题追踪</button><span class="muted">/</span><b>${name}</b></div><section class="topic-detail-summary"><div><span class="small">当前主题</span><h1 style="font-size:22px;margin:3px 0">${name}上升话题</h1><span class="small">展示具体Event候选，不把宽泛主题本身当成Event</span></div><div><span class="small">正在上升</span><strong>${items.length}</strong><span class="small">具体话题</span></div><div><span class="small">跨区信号</span><strong>${cross}</strong><span class="small">地区扩散</span></div><div><span class="small">已触发响应</span><strong>${items.filter(x=>x[4]||findEventForTrend(x[0])).length}</strong><span class="small">可进入实时响应</span></div></section><section class="card"><div class="card-head"><div><h2>全部上升话题</h2><p class="small">按榜单变化与当前热度排序</p></div><div class="filters"><button class="btn">全部地区</button><button class="btn">热度优先⌄</button></div></div><div class="topic-trend-head"><span>具体话题</span><span>主要地区</span><span>热度</span><span>排名变化</span><span>近期趋势</span><span>操作</span></div>${items.map((x,i)=>`<div class="topic-trend-row"><span><b>${x[0]}</b><br><small class="muted">${name}主题 · 语义匹配</small></span><span>${x[1]}</span><strong>${x[2]}</strong>${tag(x[3],x[3].includes('↑')?'orange':'green')}<span class="topic-spark">${[7,11,9,15,18,24].map((h,j)=>`<i style="height:${h+i*j}px"></i>`).join('')}</span><button class="btn link" data-topic-event="${i}">进入实时响应 →</button></div>`).join('')}</section>`}
topics=function(){if(S.topicDetail)return topicDetailView(S.topicDetail);return `<div class="three grid">${[['AI','12','GPT-6、AI agents、ChatGPT'],['加密监管','7','Stablecoin Act、Crypto ETF'],['体育大赛','9','World Cup、Champions League']].map(x=>`<article class="topic"><div class="topic-top"><div><h2>${x[0]}</h2><span class="small">宽泛主题 · 语义聚合</span></div><span class="number">${x[1]}</span></div><p>${x[2]}</p><button class="btn link" data-topic-open="${x[0]}">查看该主题全部上升话题 →</button></article>`).join('')}</div>`};
const bindV10Base=bind;bind=function(){bindV10Base();document.querySelectorAll('[data-trend-row]').forEach(x=>x.onclick=()=>{const row=TREND[S.region][+x.dataset.trendRow],event=ensureEventForTrend(row.name,S.region,row.rank);S.event=event.id;S.eventStatus='全部';go('events')});document.querySelectorAll('[data-topic-open]').forEach(x=>x.onclick=()=>{S.topicDetail=x.dataset.topicOpen;render()});document.querySelector('[data-topic-back]')?.addEventListener('click',()=>{S.topicDetail=null;render()});document.querySelectorAll('[data-topic-event]').forEach(x=>x.onclick=()=>{const item=TOPIC_TRENDS[S.topicDetail][+x.dataset.topicEvent],event=item[4]?E.find(e=>e.id===item[4]):ensureEventForTrend(item[0],item[1]);S.event=event.id;S.eventStatus='全部';go('events')})};
