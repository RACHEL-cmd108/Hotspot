function render(){let body=state.detailEvent?eventDetailPage(state.detailEvent):{events:eventsPage,candidates:candidatePage,content:contentPage,config:configPage}[state.page]();document.getElementById('app').innerHTML=shell(body);let route=state.detailEvent?`events/${state.detailEvent}`:state.page;history.replaceState({},'',`${location.pathname}#/${route}`);bind();document.querySelector('[data-more-filters]')?.addEventListener('click',()=>{state.moreEventFilters=!state.moreEventFilters;render()});document.querySelectorAll('[data-copy-full-pack]').forEach(b=>b.addEventListener('click',()=>copyText(packText(activePackEvent()),'完整 Context Pack 已复制')));document.querySelectorAll('[data-view-pack]').forEach(b=>b.addEventListener('click',viewPackModal));document.querySelectorAll('[data-fact-filter]').forEach(b=>b.addEventListener('click',()=>{state.factFilter=b.dataset.factFilter;render()}));document.querySelectorAll('[data-fact-id]').forEach(b=>b.addEventListener('click',()=>{state.selectedFact=b.dataset.factId;render()}));document.querySelectorAll('.fact-workspace [data-filter]').forEach(b=>b.onclick=e=>e.stopPropagation())}
function eventTrace(x){let rows=[];if(x.sources.includes('X Trend'))rows.push(['X Trend · '+(x.triggers.find(t=>/大类|Top 5|Rising|region/.test(t))||'命中调查规则'),'榜单快照和代表帖子已保存；排名与最近成功快照比较']);if(x.sources.includes('Topic Circle'))rows.push(['Topic Circle · '+(x.triggers.find(t=>/First-party|In-circle|Cross-circle|Spike/.test(t))||'命中圈层规则'),'来源角色、authority_scope、滚动窗口与独立账号数已核验']);if(x.sources.includes('Future Event'))rows.push(['Future Event · '+(x.triggers.find(t=>/Action Score/.test(t))||'达到 80 分'),'进入 Event 匹配，但不自动提升事实确认状态']);rows.push(['统一匹配结果：'+(x.sources.length>1?'复用唯一 Event ':'创建 Event ')+x.id.toUpperCase(),'主体、动作、对象、时间、地点和事实含义完成比较']);return rows.map(r=>`<div class="trace-item"><b>${r[0]}</b><small>${r[1]}</small></div>`).join('')}
function eventDrawer(id){let x=events.find(e=>e.id===id);if(!x)return;document.getElementById('drawer').className='drawer-wrap show';document.getElementById('drawer').innerHTML=`<aside class="drawer"><div class="drawer-head between"><div><div class="tagrow">${pill(x.status)}${x.sources.map(s=>pill(s)).join('')}</div><h1 style="margin-top:10px">${x.title}</h1><span class="muted">唯一 Event · ${x.pack} · 更新 ${x.time}</span></div>${btn('关闭','','data-close')}</div><div class="drawer-body"><h2>为什么进入 Event 层</h2><div class="trace">${eventTrace(x)}</div><div class="detail-grid"><div class="detail-box"><b>来源标签</b>${x.sources.join(' · ')}</div><div class="detail-box"><b>触发标签</b>${x.triggers.join(' · ')}</div><div class="detail-box"><b>内部关注</b>${x.attention}；用于排序和跟踪</div><div class="detail-box"><b>事实状态</b>${x.fact}；独立由 Evidence 判断</div></div><div class="warning"><b>规则边界</b><br>多来源、跨区和高流量只增加关注权重，不会自动提升事实确认等级。</div><h2>Fact / Evidence</h2><div class="fact">${pill(x.fact==='高'?'已确认':'待确认')}<b>${x.title}</b><span class="muted">主要来源</span></div><div class="fact">${pill('已确认')}<b>来源与发生时间已记录</b><span class="muted">原始快照</span></div><div class="fact">${pill('待确认')}<b>影响范围仍在更新</b><span class="muted">补充 Evidence</span></div><h2 style="margin-top:18px">Event 产品产出</h2><div class="detail-grid">${['Event Record','Trend Footprint','Fact / Evidence','Event Timeline','Context Pack','Response Moment'].map((n,i)=>`<div class="detail-box"><b>${n}</b><span class="meta">${i===2?'证据状态可追溯':'已生成 / 最新版本'}</span></div>`).join('')}</div></div><div class="modal-foot">${btn('标记路由错误','','data-review')}${btn('确认可供下游使用','primary','data-ready')}</div></aside>`;bindOverlay()}
function videoDrawer(id){let x=contents.find(v=>v.id===id);if(!x)return;let pending=x.pack==='待拆解';document.getElementById('drawer').className='drawer-wrap show';document.getElementById('drawer').innerHTML=`<aside class="drawer"><div class="drawer-head between"><div><div class="tagrow">${pill(x.source)}${x.keywords.map(k=>pill(k)).join('')}${x.tags.slice(0,2).map(t=>pill(t)).join('')}</div><h1 style="margin-top:10px">${x.title}</h1><span class="muted">${x.author} · ${x.duration} · ${x.pack}</span></div>${btn('关闭','','data-close')}</div><div class="drawer-body"><div class="video-snapshot"><div><span class="meta">当前播放</span><b>${x.metric}</b></div><div><span class="meta">账号突破倍数</span><b>${x.breakout}</b></div><div><span class="meta">粉丝穿透率</span><b>${x.penetration}</b></div><div><span class="meta">传播速度</span><b>${x.velocity}</b></div></div>${pending?`<div class="warning"><b>拆解任务等待中</b><br>需读取时间戳转录、必要画面帧和账号近期基线；分析前不生成归因或复刻建议。</div>`:`<div class="analysis-stack"><section class="analysis-block"><h2>1. 主要原因</h2><div class="analysis-row"><span>选题</span><b>${x.keywords.join(' · ')} 对应的当前变化</b></div><div class="analysis-row"><span>为什么吸引人</span><b>${x.reason}</b></div><div class="analysis-row"><span>核心流量判断</span><b>已选定唯一主驱动，并完成账号基线校正。</b></div></section><section class="analysis-block"><h2>2. 具体表现</h2><div class="analysis-row"><span>关键手法</span><b>${x.technique}</b></div><div class="analysis-row"><span>作用</span><b>降低理解成本，同时维持对核心结论的预期。</b></div></section><section class="analysis-block"><h2>3. 复刻建议</h2><div class="analysis-row"><span>可复刻机制</span><b>${x.replicate}</b></div><div class="analysis-row"><span>产品二创选题</span><b>优先选择已有公开数据、可用产品验证的新事件。</b></div><div class="analysis-row"><span>产品如何进入</span><b>作为查询、验证或对比的必要步骤，不打断内容证明链。</b></div></section><div class="boundary-note"><b>不可复制边界：</b>不直接复制创作者人设、文案、原素材、Meme 或固定发布时间。</div></div>`}</div><div class="modal-foot">${btn('标记需复核','','data-review')}${btn(pending?'保留等待':'确认分析可用','primary','data-ready')}</div></aside>`;bindOverlay()}
function simpleDrawer(title,type,body){document.getElementById('drawer').className='drawer-wrap show';document.getElementById('drawer').innerHTML=`<aside class="drawer"><div class="drawer-head between"><div><div class="eyebrow">${type}</div><h1>${title}</h1></div>${btn('关闭','','data-close')}</div><div class="drawer-body">${body}</div><div class="modal-foot">${btn('标记需复核','','data-review')}${btn('确认分析可用','primary','data-ready')}</div></aside>`;bindOverlay()}
function activePackEvent(){return events.find(e=>e.id===state.detailEvent)||events[0]}
function copyText(text,success){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast(success)).catch(()=>fallbackCopy(text,success))}else fallbackCopy(text,success)}
function fallbackCopy(text,success){let area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast(success)}
function viewPackModal(){let x=activePackEvent();document.getElementById('modal').className='modal-wrap show';document.getElementById('modal').innerHTML=`<div class="modal schema-modal"><div class="modal-head"><div><h2>原始 Event Context Pack</h2><span class="muted">${x.id.toUpperCase()} · ${x.pack} · JSON</span></div>${btn('关闭','','data-close')}</div><div class="modal-body"><div class="schema-toolbar"><span class="pack-status">Schema 校验通过，可供下游读取</span>${btn('复制完整上下文','primary sm','data-copy-full-pack')}</div><pre class="schema-view">${packText(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></div></div>`;bindOverlay();document.querySelector('[data-copy-full-pack]')?.addEventListener('click',()=>copyText(packText(x),'完整 Context Pack 已复制'))}
function ruleModal(){document.getElementById('modal').className='modal-wrap show';document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-head"><div><h2>三类热点源与 Event 触发规则 v2</h2><span class="muted">三条路径独立触发，统一匹配 Event</span></div>${btn('关闭','','data-close')}</div><div class="modal-body"><div class="steps"><div class="step done">1 · Signal</div><div class="step done">2 · Candidate Cluster</div><div class="step done">3 · 来源规则</div><div class="step active">4 · Event 匹配</div></div><div class="rule-note"><div><b>X 热搜</b>七大类直接调查；普通热搜三选一。</div><div><b>关注圈层</b>S1/S2 权限单点，或流量、圈内、跨圈触发。</div><div><b>未来事件</b>Action Score ≥80。</div></div><div class="warning">命中规则意味着进入 Event 理解与匹配，不等于事实已经确认，也不触发自动发布。</div></div></div>`;bindOverlay()}
function simulate(){if(state.simulated){toast('已经完成本轮模拟');return}state.simulated=true;events.unshift({id:'e5',title:'AI 浏览器隐私政策调整进入调查',summary:'第三个不同账号加入同一 Candidate Cluster，命中 B2h_circle ≥ 3。',status:'Candidate',sources:['Topic Circle'],triggers:['In-circle','B2h=3'],attention:'新触发',fact:'待核实',time:'刚刚',pack:'Context Pack v1'});render();toast('Candidate 已命中 In-circle 门槛，并创建 Candidate Event')}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function bindOverlay(){document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>{document.getElementById('drawer').className='drawer-wrap';document.getElementById('modal').className='modal-wrap'});document.querySelector('[data-ready]')?.addEventListener('click',()=>{document.getElementById('drawer').className='drawer-wrap';toast('对象已确认，可交付运营决策中心')});document.querySelector('[data-review]')?.addEventListener('click',()=>{document.getElementById('drawer').className='drawer-wrap';toast('已进入人工路由复核，保留原始 Signal 和版本')})}
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{state.page=x.dataset.page;state.detailEvent=null;state.filter='全部';render()});document.querySelectorAll('[data-event]').forEach(x=>{x.onclick=e=>{if(e.target.closest('[data-filter]'))return;openEventDetail(x.dataset.event)};x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEventDetail(x.dataset.event)}}});document.querySelector('[data-back]')?.addEventListener('click',()=>{state.detailEvent=null;render()});document.querySelectorAll('[data-detail-tab]').forEach(x=>x.onclick=()=>{state.detailTab=x.dataset.detailTab;render()});document.querySelector('[data-copy-pack]')?.addEventListener('click',()=>toast('Context Pack ID 已复制'));document.querySelector('[data-review-detail]')?.addEventListener('click',()=>toast('已创建事件数据纠错任务'));document.querySelectorAll('[data-candidate]').forEach(x=>{let open=()=>simpleDrawer(x.querySelector('h2').textContent,'CANDIDATE CLUSTER','<h2>当前门槛进度</h2>'+x.querySelector('.condition-grid').outerHTML+'<div class="warning">未命中规则时继续保留 Signal / Candidate Cluster，不强制创建 Event。</div>');x.onclick=open;x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});document.querySelectorAll('[data-content]').forEach(x=>{let open=()=>videoDrawer(x.dataset.content);x.onclick=e=>{if(e.target.closest('[data-filter]'))return;open()};x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});document.querySelectorAll('[data-qf],[data-filter]').forEach(x=>x.onclick=e=>{e.stopPropagation();state.filter=x.dataset.qf||x.dataset.filter;render()});document.querySelector('[data-clear]')?.addEventListener('click',()=>{state.filter='全部';state.query='';render()});document.querySelector('[data-search]')?.addEventListener('input',e=>{state.query=e.target.value;render();let input=document.querySelector('[data-search]');input?.focus();input?.setSelectionRange(state.query.length,state.query.length)});document.querySelector('[data-run]')?.addEventListener('click',e=>{let b=e.currentTarget,old=b.textContent;b.textContent='采集中…';b.disabled=true;setTimeout(()=>{b.textContent=old;b.disabled=false;toast(state.page==='content'?'视频采集完成：官方热门 3 条，关键词 5 条':'采集完成：27 Signal、4 Candidate、2 Event 更新')},850)});document.querySelector('[data-simulate]')?.addEventListener('click',simulate);document.querySelectorAll('[data-rules]').forEach(x=>x.onclick=ruleModal);document.querySelectorAll('[data-config-tab]').forEach(x=>x.onclick=()=>{state.configTab=x.dataset.configTab;render()});document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{x.classList.toggle('on');toast(x.classList.contains('on')?'任务已启用':'任务已暂停')})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('drawer').className='drawer-wrap';document.getElementById('modal').className='modal-wrap'}});let routeParts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);let route=routeParts[0];if(['events','candidates','content','config'].includes(route))state.page=route;if(route==='events'&&routeParts[1]&&events.some(e=>e.id===routeParts[1]))state.detailEvent=routeParts[1];render();
</script></body></html>
