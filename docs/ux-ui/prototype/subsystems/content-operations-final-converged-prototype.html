<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>热点运营系统 · 内容运营可交互原型</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --paper: #ffffff;
      --ink: #17221f;
      --muted: #6f7b77;
      --soft: #e5f2ee;
      --soft-2: #f1f8f5;
      --line: #d8e2de;
      --line-2: #eaf0ed;
      --green: #0f6b5d;
      --green-2: #2f8375;
      --blue: #426f8b;
      --blue-bg: #eaf3f7;
      --red: #b4495c;
      --red-bg: #fff0f2;
      --orange: #ad632f;
      --orange-bg: #fff1e7;
      --shadow: 0 1px 2px rgba(20, 38, 32, .04);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    textarea, input { color: var(--ink); }

    .app {
      display: grid;
      grid-template-columns: 226px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--paper);
      border-right: 1px solid var(--line);
      padding: 23px 12px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 28px;
    }

    .logo {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--green-2);
      color: #fff;
      font-weight: 900;
    }

    .brand-title { font-weight: 800; line-height: 1.2; }
    .en, .tiny { display: block; color: #909c98; font-size: 11px; font-weight: 500; }
    .side-label {
      color: #9aa4a1;
      font-size: 11px;
      padding: 0 10px 15px;
    }

    .side-nav { display: grid; gap: 4px; }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #4f5c58;
      text-align: left;
      border-radius: 7px;
      padding: 12px 10px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .nav-btn.active {
      background: var(--soft);
      color: var(--green);
      font-weight: 800;
    }

    .nav-icon { font-size: 16px; color: currentColor; }
    .prototype-note {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: #899590;
      font-size: 10px;
      line-height: 1.45;
    }

    .main { min-width: 0; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--line);
    }

    .crumb { color: #53615d; }
    .crumb b { color: var(--ink); }
    .top-status {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-size: 13px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .avatar {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--green);
      font-weight: 800;
    }

    .page {
      max-width: 1360px;
      margin: 0 auto;
      padding: 28px 30px 88px;
    }

    .eyebrow {
      color: var(--green);
      font-size: 10px;
      letter-spacing: 5px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 30px; line-height: 1.16; margin-bottom: 8px; }
    h2 { font-size: 21px; line-height: 1.25; margin-bottom: 9px; }
    h3 { font-size: 16px; line-height: 1.35; margin-bottom: 6px; }
    p { margin-bottom: 0; }
    .muted { color: var(--muted); }
    .small { color: var(--muted); font-size: 12px; }

    .btn {
      min-height: 38px;
      border: 1px solid #cbd7d2;
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .btn.primary {
      color: #fff;
      background: var(--green-2);
      border-color: var(--green-2);
    }

    .btn.ghost {
      border-color: transparent;
      background: transparent;
      color: var(--green);
      min-height: 0;
      padding: 0;
    }

    .btn.danger { color: var(--red); }
    .btn.block { width: 100%; justify-content: center; }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      background: #eef2f0;
      color: #53615d;
      font-size: 11px;
      font-weight: 750;
      line-height: 1;
      width: max-content;
    }

    .pill.green { color: var(--green); background: var(--soft); }
    .pill.blue { color: var(--blue); background: var(--blue-bg); }
    .pill.orange { color: var(--orange); background: var(--orange-bg); }
    .pill.red { color: var(--red); background: var(--red-bg); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .metric {
      padding: 18px 20px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child { border-right: 0; }
    .metric strong { display: block; font-size: 29px; line-height: 1.1; margin-bottom: 6px; }
    .metric span { color: var(--muted); font-size: 12px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 13px 16px;
      margin-bottom: 18px;
    }

    .toolbar-label { font-weight: 800; margin-right: 3px; }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip-btn {
      border: 1px solid #cbd7d2;
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 650;
    }

    .chip-btn.active {
      color: #fff;
      background: var(--green-2);
      border-color: var(--green-2);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-main-aside { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 14px; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .recommend-card {
      padding: 18px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .recommend-card:hover { border-color: #88aba0; }
    .recommend-card h3 { font-size: 18px; margin: 12px 0 7px; }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .reason {
      margin-top: 14px;
      padding: 10px 12px;
      background: #f1f6f4;
      border-left: 3px solid var(--green-2);
      font-size: 13px;
    }

    .market-box {
      margin-top: 11px;
      border: 1px solid #cbe1dc;
      border-radius: 8px;
      padding: 10px 12px;
      background: #f8fcfa;
      font-size: 12px;
    }

    .market-box strong { color: var(--green); }

    .section-title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 12px 0 10px;
    }

    .section-title-row h2 { margin-bottom: 0; }
    .hint-right { color: var(--muted); font-size: 12px; }

    .inbox-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 14px;
    }

    .table {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-row {
      display: grid;
      grid-template-columns: minmax(260px, 1.4fr) 140px 160px 120px;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line-2);
    }

    .table-row:last-child { border-bottom: 0; }
    .table-row.header {
      background: #fafcfb;
      color: var(--muted);
      font-size: 12px;
      cursor: default;
    }

    .click-row { cursor: pointer; }
    .click-row:hover { background: #fbfdfc; }
    .table-row .red { color: var(--red); font-weight: 750; }
    .quick-import { padding: 18px; }
    .quick-import textarea {
      width: 100%;
      min-height: 152px;
      resize: vertical;
      border: 1px solid #cbd7d2;
      border-radius: 8px;
      padding: 12px;
      margin: 14px 0 12px;
      background: #fff;
    }

    .task-list { display: grid; gap: 10px; }
    .task-row {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 145px 150px 130px 116px;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      cursor: pointer;
    }

    .task-row:hover { border-color: #88aba0; }
    .task-title { font-weight: 850; margin-bottom: 5px; }
    .angle { color: var(--green); font-weight: 750; font-size: 13px; }

    .workspace-shell { min-height: calc(100vh - 64px); }
    .workspace-back {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 0 28px;
    }

    .workspace {
      max-width: 1360px;
      margin: 0 auto;
      padding: 27px 30px 90px;
    }

    .event-head {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .event-head h1 {
      font-size: 30px;
      margin: 12px 0 10px;
    }

    .badges { display: flex; gap: 7px; flex-wrap: wrap; }
    .latest {
      margin-top: 18px;
      background: #f7faf8;
      border-left: 3px solid var(--green-2);
      padding: 11px 13px;
      width: min(100%, 900px);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }

    .tab-btn {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 14px 13px 12px;
      font-weight: 700;
    }

    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green-2);
    }

    .workspace-section h2 { font-size: 24px; }
    .workspace-section > p { margin-bottom: 14px; }
    .opportunity {
      padding: 17px;
      margin-bottom: 13px;
    }

    .opportunity.selected {
      border: 2px solid var(--green-2);
      background: var(--soft-2);
      padding: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .info-panel { padding: 18px; }
    .info-row {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .info-row:first-of-type { border-top: 0; padding-top: 6px; }
    .angle-card {
      padding: 17px;
      margin-top: 12px;
      cursor: pointer;
    }

    .angle-card.selected {
      border: 2px solid var(--green-2);
      background: var(--soft-2);
      padding: 16px;
    }

    .angle-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .kitchen-modal {
      min-height: 100vh;
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }

    .kitchen-top {
      height: 103px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 27px;
    }

    .kitchen-top h1 {
      font-size: 25px;
      margin: 0 0 3px;
    }

    .close-btn {
      width: 48px;
      height: 48px;
      border: 1px solid #cbd7d2;
      background: #fff;
      border-radius: 10px;
      font-size: 24px;
      line-height: 1;
    }

    .wizard-progress {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      padding: 34px 27px 0;
      position: relative;
    }

    .wizard-progress:before {
      content: "";
      position: absolute;
      left: 27px;
      right: 27px;
      top: 45px;
      height: 2px;
      background: var(--line);
    }

    .progress-step {
      position: relative;
      border: 0;
      background: transparent;
      text-align: left;
      padding-top: 22px;
      color: #65716d;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      z-index: 1;
    }

    .progress-step:before {
      content: "";
      position: absolute;
      top: 5px;
      left: 0;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #cbd8d4;
    }

    .progress-step.done, .progress-step.active { color: var(--green); font-weight: 850; }
    .progress-step.done:before, .progress-step.active:before { background: var(--green); }

    .kitchen-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 365px;
      gap: 38px;
      padding: 42px 27px 22px;
      flex: 1;
    }

    .kitchen-main h2 {
      font-size: 28px;
      margin-bottom: 9px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 26px;
    }

    .select-card {
      min-height: 96px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      text-align: left;
      padding: 18px 18px 15px;
      position: relative;
    }

    .select-card.large { min-height: 124px; }
    .select-card.selected {
      border: 2px solid var(--green);
      background: #eff8f5;
      padding: 17px 17px 14px;
    }

    .select-card h3 { font-size: 19px; margin-bottom: 5px; }
    .select-card .check {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: none;
      place-items: center;
      background: var(--green);
      color: #fff;
      font-weight: 900;
    }

    .select-card.selected .check { display: grid; }
    .inline-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
      margin-bottom: 11px;
    }

    .inline-title b { font-size: 16px; }
    .custom-wide {
      width: 100%;
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 18px;
      justify-content: flex-start;
      border-style: dashed;
    }

    .plus {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      font-size: 27px;
      line-height: 1;
    }

    .custom-panel {
      margin-top: 14px;
      padding: 16px;
      background: #fbfdfc;
      border: 1px solid var(--line);
      border-radius: 10px;
      display: none;
    }

    .custom-panel.open { display: block; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #53615d;
      margin-bottom: 7px;
    }

    .input, .textarea {
      width: 100%;
      border: 1px solid #cbd7d2;
      border-radius: 8px;
      background: #fff;
      padding: 11px 12px;
    }

    .textarea { min-height: 104px; resize: vertical; }
    .mini-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .summary-panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px 22px 18px;
      height: max-content;
      background: #fbfdfc;
    }

    .summary-panel h3 { font-size: 20px; margin-bottom: 19px; }
    .summary-row {
      border-top: 1px solid var(--line);
      padding: 13px 0;
      font-size: 18px;
    }

    .summary-row:first-of-type { border-top: 0; }
    .summary-row span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 3px;
    }

    .kitchen-footer {
      border-top: 1px solid var(--line);
      padding: 15px 27px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--paper);
      position: sticky;
      bottom: 0;
    }

    .reader-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 19px 0 22px;
    }

    .reader-chip {
      border: 1px solid #cbd7d2;
      background: #fff;
      border-radius: 11px;
      padding: 11px 20px;
      font-weight: 800;
    }

    .reader-chip.selected {
      color: #fff;
      background: #10211d;
      border-color: #10211d;
    }

    .skill-import {
      grid-column: 1 / -1;
      border: 1px dashed #9eb8b1;
      border-radius: 9px;
      background: #fbfdfc;
      padding: 18px;
    }

    .import-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
      margin-top: 14px;
    }

    .parse-box {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 13px;
      background: #fff;
    }

    .assist-row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .draft-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .candidate-tabs {
      display: flex;
      width: max-content;
      border: 1px solid #cbd7d2;
      border-radius: 9px;
      overflow: hidden;
      margin: 0 auto 16px;
    }

    .candidate-tab {
      border: 0;
      background: #fff;
      padding: 11px 30px;
      font-weight: 800;
    }

    .candidate-tab.active { color: #fff; background: var(--green); }
    .draft {
      border: 1px solid var(--line);
      border-radius: 9px;
      min-height: 252px;
      padding: 18px 20px;
      font-size: 16px;
      white-space: pre-line;
    }

    .ai-box {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 15px 16px;
    }

    .ai-chat {
      display: grid;
      gap: 10px;
      margin: 13px 0;
    }

    .bubble {
      max-width: 82%;
      border-radius: 9px;
      padding: 11px 13px;
      background: #eef2f0;
    }

    .bubble.ai {
      border: 1px solid #cfe1db;
      background: #fbfdfc;
      max-width: 100%;
    }

    .diff {
      display: grid;
      grid-template-columns: 1fr 28px 1fr;
      gap: 11px;
      align-items: center;
      margin-top: 10px;
    }

    .diff-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-height: 68px;
    }

    .diff-card.before { color: #bd334e; background: #fff6f7; }
    .diff-card.after { color: var(--green); background: #f2faf7; }
    .input-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 9px; }

    .publish-layout {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 14px;
      margin-top: 15px;
    }

    .publish-card {
      padding: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .publish-card.selected {
      border: 2px solid var(--green-2);
      background: var(--soft-2);
      padding: 15px;
    }

    .publish-detail { padding: 18px; }
    .empty-state {
      border: 1px dashed #b9cbc5;
      border-radius: 9px;
      padding: 24px;
      background: #fbfdfc;
      color: var(--muted);
      text-align: center;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .draft-preview {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      padding: 16px;
      min-height: 220px;
      white-space: pre-line;
      margin: 14px 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 11px 14px;
      color: #fff;
      background: #10211d;
      border-radius: 9px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .18s, transform .18s;
      z-index: 30;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1120px) {
      .grid-main-aside, .inbox-layout, .kitchen-body, .publish-layout { grid-template-columns: 1fr; }
      .summary-panel { order: -1; }
      .task-row { grid-template-columns: minmax(250px, 1fr) 130px 120px; }

    function renderPublishing() {
      const active = publishing[state.selectedPublish];

      if (!selected.draft) selected.draft = state.draft;
      const counts = {
        all: publishing.length,
        waiting: publishing.filter(item => item.status === "待发布").length,
        copied: publishing.filter(item => item.status === "已复制").length,

                  <div class="card-top">
                    <div>
                      <h3>${escapeHtml(item.title)}</h3>
                      <p class="muted">${escapeHtml(item.format)} · ${escapeHtml(item.note)}</p>
                    </div>
                    ${pill(item.status, item.status === "已发布" ? "green" : item.status === "已复制" ? "blue" : item.status === "暂缓" ? "red" : "orange")}

            <section class="card publish-detail">

                <div>

                  <p class="muted">${escapeHtml(selected.format)} · 来自内容厨房采用稿</p>

                ${pill(selected.status, selected.status === "已发布" ? "green" : selected.status === "已复制" ? "blue" : selected.status === "暂缓" ? "red" : "orange")}

                <label><span class="field-label">发布状态</span><input class="input" value="${escapeHtml(selected.status)}" readonly /></label>

            <h3>本次默认制作输入</h3>
            <div class="info-row"><b>已继承 Angle</b><br>${event.angle}</div>

    function renderKitchen() {
      return `
        <div class="kitchen-modal">

    function renderGoalCard(title, desc, reason) {
      const selected = state.goals.includes(title);
      return `
        <button class="select-card ${selected ? "selected" : ""}" data-goal="${escapeHtml(title)}">

                </div>
                <div class="mini-actions" style="justify-content:flex-end">
                  <button class="btn" data-ignore-edit>忽略</button>
                  <button class="btn primary" data-apply-edit>应用修改</button>
                </div>
              </div>` : `<p class="muted">选择快捷指令或输入要求，发送后会生成可应用或忽略的建议。</p>`}
            </div>
            <div class="input-row">
              <input class="input" id="ai-instruction" placeholder="告诉 AI 你想怎么修改…" />
              <button class="btn primary" data-send-ai>发送</button>
            </div>
            <div class="mini-actions"><button class="btn" data-undo-edit>撤销最近应用</button><button class="btn" data-version-history>版本历史</button></div>
          </section>
        </div>
      `;
    }

    function render() {
      if (!["recommend", "inbox", "creation", "publish"].includes(state.page)) state.page = state.lastValidPage;
      else state.lastValidPage = state.page;
      if (!["product", "info", "angle", "kitchen"].includes(state.workspaceTab)) state.workspaceTab = state.lastValidWorkspaceTab;
      else state.lastValidWorkspaceTab = state.workspaceTab;
      if (state.kitchenOpen) {
        app.innerHTML = renderKitchen();
      } else if (state.workspace) {
        app.innerHTML = renderWorkspace();
      } else if (state.page === "recommend") {
        app.innerHTML = renderRecommend();
      } else if (state.page === "inbox") {
        app.innerHTML = renderInbox();
      } else if (state.page === "creation") {
        app.innerHTML = renderCreation();
      } else {
        app.innerHTML = renderPublishing();
      }
      bind();
    }

    function bind() {
      document.querySelectorAll("[data-page]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          if (!["recommend", "inbox", "creation", "publish"].includes(button.dataset.page)) return;
          state.page = button.dataset.page;
          state.workspace = false;
          state.kitchenOpen = false;
          render();
        });
      });

      document.querySelectorAll("[data-recommend-basis]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          state.recommendBasisFilter = button.dataset.recommendBasis;
          showToast(`已应用推荐依据：${state.recommendBasisFilter}`);
          render();
        });
      });

      document.querySelectorAll("[data-recommend-pace]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          state.recommendPaceFilter = button.dataset.recommendPace;
          showToast(`已应用处理节奏：${state.recommendPaceFilter}`);
          render();
        });
      });

      document.querySelectorAll("[data-inbox-filter]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          state.inboxFilter = button.dataset.inboxFilter;
          showToast(`已应用研判筛选：${state.inboxFilter}`);
          render();
        });
      });

      document.querySelectorAll("[data-creation-filter]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          state.creationFilter = button.dataset.creationFilter;
          showToast(`已应用任务筛选：${state.creationFilter}`);
          render();
        });
      });

      document.querySelectorAll("[data-publish-filter]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          persistPublishLink();
          state.publishFilter = button.dataset.publishFilter;
          showToast(`已应用发布筛选：${state.publishFilter}`);
          render();
        });
      });

      document.querySelectorAll("[data-open-workspace]").forEach(button => {
        button.addEventListener("click", () => {
          state.workspaceSource = state.page;
          state.workspace = true;
          state.kitchenOpen = false;
          state.page = "creation";
          render();
        });
      });

      document.querySelectorAll("[data-close-workspace]").forEach(button => {
        button.addEventListener("click", () => {
          state.workspace = false;
          state.page = state.workspaceSource;
          render();
        });
      });

      document.querySelectorAll("[data-workspace-tab]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          if (!["product", "info", "angle", "kitchen"].includes(button.dataset.workspaceTab)) return;
          state.workspaceTab = button.dataset.workspaceTab;
          render();
        });
      });

      document.querySelectorAll("[data-angle]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedAngle = Number(button.dataset.angle);
          render();
        });
      });

      document.querySelector("[data-save-quick-import]")?.addEventListener("click", event => {
        event.stopPropagation();
        state.quickImportSaved = true;
        showToast("已保存到上下文草稿，不进入推荐队列。");
        render();
      });

      document.querySelectorAll("[data-open-kitchen]").forEach(button => {
        button.addEventListener("click", () => {
          state.kitchenOpen = true;
          render();
        });
      });

      document.querySelectorAll("[data-close-kitchen]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          state.kitchenOpen = false;
          state.workspace = true;
          state.workspaceTab = "kitchen";
          render();
        });
      });

      document.querySelectorAll("[data-kstep]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          state.kitchenStep = Number(button.dataset.kstep);
          render();
        });
      });

      document.querySelectorAll("[data-prev-step]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          state.kitchenStep = Math.max(1, state.kitchenStep - 1);
          render();
        });
      });

      document.querySelectorAll("[data-next-step]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          if (state.kitchenStep < 4) {
            state.kitchenStep += 1;
            render();
            return;
          }
          state.kitchenOpen = false;
          state.workspace = false;
          state.page = "publish";
          publishing[0].draft = state.draft;
          publishing[0].format = state.format;
          publishing[0].note = `已采用${state.candidate}`;
          publishing[0].status = "待发布";
          publishing[0].link = "";
          state.selectedPublish = 0;
          state.publishFilter = "全部";
          state.savedDraft = true;
          showToast("已标记采用，终稿进入内容发布。");
          render();
        });
      });

      document.querySelectorAll("[data-goal]").forEach(button => {
        button.addEventListener("click", () => {
          const goal = button.dataset.goal;
          const index = state.goals.indexOf(goal);
          if (index >= 0) {
            if (state.goals.length === 1) {
              state.goalError = "至少保留 1 个目标。";
              render();
              return;
            }
            state.goals.splice(index, 1);
            state.goalError = "";
          } else {
            if (state.goals.length >= 3) {
              state.goalError = "最多选择 3 个目标，请先取消一个目标。";
              render();
              return;
            }
            state.goals.push(goal);
            state.goalError = "";
          }
          render();
        });
      });

      document.querySelector("[data-toggle-custom-goal]")?.addEventListener("click", () => {
        state.customGoalOpen = !state.customGoalOpen;
        render();
      });

      document.querySelector("[data-add-custom-goal]")?.addEventListener("click", () => {
        const input = document.querySelector("#custom-goal");
        state.customGoalText = input.value.trim();
        if (!state.customGoalText) {
          showToast("先写一句自定义目标。");
          return;
        }
        if (state.goals.length >= 3) {
          state.goalError = "最多选择 3 个目标，请先取消一个目标。";
          render();
          return;
        }
        if (state.customGoals.includes(state.customGoalText) || state.goals.includes(state.customGoalText)) {
          showToast("这个自定义目标已经加入。");
          return;
        }
        state.customGoals.push(state.customGoalText);
        state.goals.push(state.customGoalText);
        state.goalError = "";
        showToast("已加入本次目标，并保留原句给 Agent。");
        render();
      });

      document.querySelectorAll("[data-reader]").forEach(button => {
        button.addEventListener("click", () => {
          const reader = button.dataset.reader;
          if (state.readers.includes(reader)) {
            if (state.readers.length === 1) {
              showToast("至少保留 1 个主要读者。");
              return;
            }
            state.readers = state.readers.filter(item => item !== reader);
          } else {
            if (state.readers.length >= 3) {
              showToast("最多 1 个主要读者加 2 个次要读者。");
              return;
            }
            state.readers.push(reader);
          }
          render();
        });
      });

      document.querySelector("[data-toggle-custom-reader]")?.addEventListener("click", () => {
        state.customReaderOpen = !state.customReaderOpen;
        render();
      });

      document.querySelector("[data-add-custom-reader]")?.addEventListener("click", () => {
        const input = document.querySelector("#custom-reader");
        const value = input.value.trim();
        if (!value) {
          showToast("先写一句目标读者描述。");
          return;
        }
        if (state.readers.length >= 3) {
          showToast("最多 1 个主要读者加 2 个次要读者。");
          return;
        }
        const shortLabel = value.length > 16 ? `${value.slice(0, 16)}…` : value;
        if (state.customReaders.includes(shortLabel)) {
          showToast("这个目标读者已经加入。");
          return;
        }
        state.customReaders.push(shortLabel);
        state.readers.push(shortLabel);
        showToast("已加入本次目标读者。");
        render();
      });

      document.querySelectorAll("[data-skill]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedSkill = button.dataset.skill;
          render();
        });
      });

      document.querySelector("[data-toggle-skill-import]")?.addEventListener("click", () => {
        state.skillImportOpen = !state.skillImportOpen;
        render();
      });

      document.querySelector("[data-parse-skill]")?.addEventListener("click", () => {
        const input = document.querySelector("#skill-md");
        state.skillMarkdown = input.value.trim();
        if (!state.skillMarkdown) {
          showToast("Markdown 内容为空。");
          return;
        }
        state.skillParsed = true;
        showToast("已解析 Markdown。");
        render();
      });

      document.querySelector("#skill-file")?.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(".md")) {
          showToast("只支持 .md 文件，请重新选择。");
          return;
        }
        if (file.size > 1024 * 1024) {
          showToast("文件超过 1 MB，请精简后重试；当前原文已保留。");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          state.skillMarkdown = String(reader.result || "");
          state.skillParsed = false;
          showToast(`已读取 ${file.name}，请确认原文后解析。`);
          render();
        };
        reader.onerror = () => showToast("文件读取失败，原文已保留，可重试。");
        reader.readAsText(file);
      });

      document.querySelector("[data-use-skill]")?.addEventListener("click", () => {
        state.selectedSkill = "我的开发者 KOL Skill";
        state.skillImportOpen = false;
        showToast("已作为本次内容 Skill 使用。");
        render();
      });

      document.querySelectorAll("[data-format]").forEach(button => {
        button.addEventListener("click", () => {
          state.format = button.dataset.format;
          render();
        });
      });

      document.querySelectorAll("[data-assist]").forEach(button => {
        button.addEventListener("click", () => {
          const assist = button.dataset.assist;
          if (state.assists.includes(assist)) {
            state.assists = state.assists.filter(item => item !== assist);
          } else {
            state.assists.push(assist);
          }
          render();
        });
      });

      document.querySelectorAll("[data-candidate]").forEach(button => {
        button.addEventListener("click", () => {
          persistFreeText();
          state.candidate = button.dataset.candidate;
          state.draft = state.candidateDrafts[state.candidate];
          render();
        });
      });

      document.querySelectorAll("[data-ai-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          const input = document.querySelector("#ai-instruction");
          input.value = button.dataset.aiPrompt;
          input.focus();
          showToast(`已填入修改指令：${button.dataset.aiPrompt}`);
        });
      });

      document.querySelector("[data-apply-edit]")?.addEventListener("click", () => {
        persistFreeText();
        const source = "GPT-6 API 已经开放，但“新模型上线”不等于“现在就该迁移”。";
        if (!state.draft.includes(source)) {
          showToast("当前候选中已找不到建议对应原文，请重新生成建议。");
          return;
        }
        state.draftHistory.push({ candidate: state.candidate, draft: state.draft });
        state.draft = state.draft.replace(source, "GPT-6 API 开放了，先别急着迁移。");
        state.candidateDrafts[state.candidate] = state.draft;
        state.aiSuggestion = null;
        showToast("已应用建议修改。");
        render();
      });

      document.querySelector("[data-ignore-edit]")?.addEventListener("click", () => { state.aiSuggestion = null; showToast("已忽略建议，正文未改变。"); render(); });
      document.querySelector("[data-send-ai]")?.addEventListener("click", () => {
        persistFreeText();
        const instruction = document.querySelector("#ai-instruction").value.trim();
        if (!instruction) return showToast("请先填写修改要求。");
        state.aiSuggestion = { candidate: state.candidate, instruction };
        showToast("已生成修改建议，正文尚未改变。");
        render();
      });
      document.querySelector("[data-undo-edit]")?.addEventListener("click", () => {
        const index = state.draftHistory.map(item => item.candidate).lastIndexOf(state.candidate);
        if (index < 0) return showToast("当前候选暂无可撤销的应用记录。");
        state.draft = state.draftHistory[index].draft;
        state.draftHistory.splice(index, 1);
        state.candidateDrafts[state.candidate] = state.draft;
        showToast("已撤销最近一次应用。");
        render();
      });
      document.querySelector("[data-version-history]")?.addEventListener("click", () => showToast(`当前保留 ${state.draftHistory.length + 1} 个工作版本。`));

      document.querySelectorAll("[data-publish]").forEach(button => {
        button.addEventListener("click", () => {
          persistPublishLink();
          state.selectedPublish = Number(button.dataset.publish);
          render();
        });
      });

      document.querySelector("[data-copy]")?.addEventListener("click", async () => {
        persistPublishLink();
        const active = publishing[state.selectedPublish];
        try {
          await navigator.clipboard.writeText(active.draft);
          active.status = "已复制";
          showToast("已复制正文。");
        } catch {
          showToast("复制失败，请手动选择正文复制；状态未改变。");
        }
        render();
      });

      document.querySelector("[data-open-platform]")?.addEventListener("click", () => {
        persistPublishLink();
        const active = publishing[state.selectedPublish];
        showToast(active.status === "已复制" ? "原型演示：将打开 X 发布页。" : "请先成功复制正文，再打开 X 发布页。");
      });

      document.querySelector("[data-mark-published]")?.addEventListener("click", () => {
        persistPublishLink();
        const active = publishing[state.selectedPublish];
        if (!active.link) {
          active.status = "已复制";
          showToast("未填写链接，已保留为已复制，稍后可继续回填。");
          render();
          return;
        }
        try {
          const parsed = new URL(active.link);
          if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("protocol");
        } catch {
          showToast("请输入有效的 http/https 发布链接。");
          return;
        }
        active.status = "已发布";
        showToast("已标记发布并记录链接。");
        render();
      });

      document.querySelector("[data-mark-copied]")?.addEventListener("click", () => {
        persistPublishLink();
        publishing[state.selectedPublish].status = "已复制";
        showToast("已标记为已复制。");
        render();
      });

      document.querySelector("[data-mark-paused]")?.addEventListener("click", () => {
        persistPublishLink();
        publishing[state.selectedPublish].status = "暂缓";
        showToast("已标记暂缓发布。");
        render();
      });

      document.querySelector("[data-return-kitchen]")?.addEventListener("click", () => {
        persistPublishLink();
        state.page = "creation";
        state.workspace = true;
        state.workspaceTab = "kitchen";
        state.kitchenOpen = true;
        state.kitchenStep = 4;
        state.draft = publishing[state.selectedPublish].draft;
        state.candidateDrafts[state.candidate] = state.draft;
        showToast("已退回内容厨房 Step 4。");
        render();
      });

      document.querySelector("[data-add-publish]")?.addEventListener("click", () => {
        publishing.unshift({
          title: "手动新增终稿",
          format: state.format,
          note: "人工放入发布队列",
          status: "待发布",
          link: "",
          draft: state.draft
        });
        state.selectedPublish = 0;
        state.publishFilter = "全部";
        showToast("已新增一条待发布终稿。");
        render();
      });

      document.querySelectorAll("[data-open-workspace], [data-publish]").forEach(element => {
        element.tabIndex = 0;
        element.setAttribute("role", "button");
        element.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            element.click();
          }
        });
      });

      document.querySelectorAll(".toolbar .chip-btn").forEach(button => {
        button.addEventListener("click", event => {
          if (button.dataset.recommendBasis || button.dataset.recommendPace || button.dataset.inboxFilter || button.dataset.creationFilter || button.dataset.publishFilter) return;
          event.stopPropagation();
          button.parentElement.querySelectorAll(".chip-btn").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          showToast(`已应用筛选：${button.textContent.trim()}`);
        });
      });

      document.querySelectorAll("button").forEach(button => {
        const label = button.textContent.trim();
        if (["＋ 完整提交", "重新推荐", "暂不采用", "修改后采用", "保存为常用目标", "保存为常用读者", "保存到我的 Skill"].includes(label)) {
          button.addEventListener("click", event => {
            event.stopPropagation();
            persistFreeText();
            if (label === "暂不采用") state.selectedAngle = -1;
            if (label === "修改后采用") state.selectedAngle = Math.max(0, state.selectedAngle);
            showToast({
              "＋ 完整提交":"原型演示：已打开完整上下文提交流程。",
              "重新推荐":"已根据当前事件重新生成角度推荐。",
              "暂不采用":"已暂不采用当前角度。",
              "修改后采用":"已保存修改后采用状态。",
              "保存为常用目标":"已保存为常用目标。",
              "保存为常用读者":"已保存为常用读者。",
              "保存到我的 Skill":"已保存到我的 Skill 并用于当前任务。"
            }[label]);
          });
        }
      });
    }

    function persistFreeText() {
      persistPublishLink();
      const extra = document.querySelector("#extra-request");
      if (extra) state.extraRequest = extra.value;

      const draft = document.querySelector("#draft");
      if (draft) {
        state.draft = draft.innerText;
        state.candidateDrafts[state.candidate] = state.draft;
      }

      const customGoal = document.querySelector("#custom-goal");
      if (customGoal) state.customGoalText = customGoal.value;

      const skillMd = document.querySelector("#skill-md");
      if (skillMd) state.skillMarkdown = skillMd.value;
    }

    function persistPublishLink() {
      const input = document.querySelector("#publish-link");
      if (input && publishing[state.selectedPublish]) publishing[state.selectedPublish].link = input.value.trim();
    }

    render();
  </script>
</body>
</html>
