<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hotspot Monitor · v2 可点击原型</title>
  <style>
    :root{--ink:#18212f;--nav:#172131;--muted:#667085;--bg:#f6f8fb;--surface:#fff;--line:#d9e0ea;--blue:#2563eb;--blue50:#eaf1ff;--green:#16835a;--green50:#e7f7ef;--amber:#b86400;--amber50:#fff5df;--red:#c93636;--red50:#ffeded;--purple:#7556d8;--purple50:#f1edff;--r:12px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;margin:5px 12px 34px}.nav-label{font-size:11px;letter-spacing:.08em;color:#aebbd0;margin:22px 12px 8px}.nav{width:100%;border:0;background:transparent;color:#d9e2ef;text-align:left;padding:10px 12px;border-radius:8px;margin:1px 0;font-weight:650}.nav:hover,.nav.active{background:#334a69;color:#fff}.side small{position:absolute;bottom:22px;left:28px;right:24px;color:#aebbd0}.main{padding:30px 42px 96px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}h1{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.03em}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.sub,.muted{color:var(--muted)}.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}.tabs{display:flex;gap:5px;background:#e8eef6;border-radius:10px;padding:4px}.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:7px;color:var(--muted);font-weight:700}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #17213120}.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}.card.click{cursor:pointer;transition:.15s}.card.click:hover{transform:translateY(-2px);border-color:#9dbcf8;box-shadow:0 9px 20px #1721310d}.blue{background:var(--blue50);border-color:#9ec0ff}.green{background:var(--green50);border-color:#9ad3b4}.amber{background:var(--amber50);border-color:#edc16e}.red{background:var(--red50);border-color:#f0a1a1}.purple{background:var(--purple50);border-color:#cabff4}.label{font-size:12px;font-weight:700;color:var(--muted)}.value{font-size:28px;font-weight:800;margin:7px 0}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:#eef2f7;color:#526176;font-size:12px;font-weight:750}.pill.blue{background:var(--blue50);color:#174ea6;border:0}.pill.green{background:var(--green50);color:#137047;border:0}.pill.amber{background:var(--amber50);color:#995800;border:0}.pill.red{background:var(--red50);color:#a82525;border:0}.pill.purple{background:var(--purple50);color:#6345bb;border:0}.toolbar,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between;margin:16px 0}.primary,.secondary,.danger{border:0;border-radius:8px;padding:10px 13px;font-weight:750}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:var(--red);color:#fff}.link{border:0;background:transparent;color:var(--blue);font-weight:750;padding:0}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:12px;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border:0}.table button{white-space:nowrap}.chart{height:165px;display:flex;align-items:flex-end;gap:14px;padding:10px 10px 30px;border-bottom:1px solid var(--line);position:relative}.chart i{display:block;width:36px;background:#98baf8;border-radius:7px 7px 0 0;position:relative}.chart i.hot{background:var(--blue)}.chart i::after{content:attr(data-t);position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:11px;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;overflow:auto}.step{min-width:110px;text-align:center;color:var(--muted);font-weight:700}.dot{width:16px;height:16px;border-radius:50%;background:var(--blue);margin:10px auto}.dot.wait{background:#d99a26}.dot.off{background:#cbd5e1}.action{border:2px solid var(--line);text-align:left;background:#fff;border-radius:12px;padding:15px;min-height:168px}.action.selected{border-color:var(--blue);background:#f6f9ff}.action.pending{border-color:#e2ac43;background:var(--amber50)}.action p{color:var(--muted);margin:7px 0;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#17213170;z-index:4;padding:8vh 10vw}.modal.show{display:block}.dialog{background:#fff;max-width:700px;margin:auto;border-radius:14px;padding:22px;box-shadow:0 20px 50px #0004}.state{position:fixed;right:18px;bottom:18px;z-index:3;width:320px;background:#172131;color:#eaf1ff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 26px #17213155}.state summary{cursor:pointer;font-weight:750}.state pre{max-height:200px;overflow:auto;white-space:pre-wrap;font-size:11px;margin:9px 0 0}.note{border-left:4px solid var(--blue);padding:11px 13px;background:var(--blue50);border-radius:0 9px 9px 0;margin:14px 0}.empty{padding:36px;text-align:center;color:var(--muted)}.metric{padding:14px}.metric p{margin:0;color:var(--muted)}.hidden{display:none}@media(max-width:1279px){.app{grid-template-columns:72px 1fr}.side{padding:20px 10px}.brand{font-size:0;margin:8px 0 36px}.brand::after{content:"HM";font-size:18px}.nav-label,.side small{display:none}.nav{font-size:0;height:42px}.nav::first-letter{font-size:16px}.main{padding:24px}.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand">Hotspot Monitor</div>
      <div class="nav-label">工作台</div><button class="nav" data-page="response">我的响应台</button><button class="nav" data-page="global">全局运营台</button>
      <div class="nav-label">M1 — M2</div><button class="nav" data-page="radar">热点雷达</button><button class="nav" data-page="candidate">候选事件</button><button class="nav" data-page="future">未来事件</button><button class="nav" data-page="event">Event 工作区</button>
      <div class="nav-label">M3 — M5</div><button class="nav" data-page="opportunity">Opportunity</button><button class="nav" data-page="plan">Task Plan</button><button class="nav" data-page="tasks">任务中心</button><button class="nav" data-page="outcome">效果与学习</button>
      <div class="nav-label">系统</div><button class="nav" data-page="exception">异常中心</button><button class="nav" data-page="scope">监测范围</button><button class="nav" data-page="dictionary">业务字典</button><button class="nav" data-page="connector">连接器与目标</button><small>v2 原型 · 仅验证交互与状态，不代表生产系统。</small>
    </aside>
    <main class="main"><div id="app"></div></main>
  </div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><section class="dialog"><div class="toolbar"><h2 id="modal-title">详情</h2><button class="secondary" onclick="closeModal()">关闭</button></div><div id="modal-body"></div></section></div>
  <script>
    const state={page:'login',role:'小陈（内容运营）',opportunity:'待决策',planVersion:4,channels:{content:'已选入',community:'已选入',campaign:'未选入',kol:'拟取消'},selectedContent:'候选 A',task:'待交接',receipt:'尚无',candidateAudit:[],futureStarted:false,connector:'Telegram 内部审核目标正常'};
    const pageMeta={login:['PG-01','登录与权限'],response:['PG-02A','我的响应台'],global:['PG-02B','全局运营台'],radar:['PG-03','实时热点雷达'],candidate:['PG-04','候选事件队列'],future:['PG-05','未来事件中心'],scope:['PG-06','监测范围'],event:['PG-07','Event 工作区'],opportunity:['PG-08','Opportunity 工作区'],plan:['PG-09','Task Plan'],tasks:['PG-10','任务中心'],draft:['PG-11','交付物草稿'],receipt:['PG-12','行动任务与回执'],outcome:['PG-13','Outcome 与复盘'],exception:['PG-14','通知与异常中心'],dictionary:['PG-15','业务字典'],connector:['PG-16','连接器与目标目录']};
    const page=(id,body)=>`<div class="top"><div><div class="crumb">${pageMeta[id][0]} · Hotspot Monitor v2 可点击原型</div><h1>${pageMeta[id][1]}</h1></div>${id!=='login'?`<div class="tabs"><button class="${id==='response'?'active':''}" onclick="go('response')">我的响应台</button><button class="${id==='global'?'active':''}" onclick="go('global')">全局运营台</button></div>`:''}</div>${body}`;
    const metric=(label,value,text,cls='')=>`<article class="card metric ${cls}"><div class="label">${label}</div><div class="value">${value}</div><p>${text}</p></article>`;
    const go=id=>{state.page=id;render()};
    const modal=(title,body)=>{document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-body').innerHTML=body;document.querySelector('#modal').classList.add('show')};
    const closeModal=()=>document.querySelector('#modal').classList.remove('show');
    const render=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));document.querySelector('#app').innerHTML=views[state.page]()};
    const views={
      login:()=>page('login',`<section class="card" style="max-width:700px;margin:64px auto"><span class="pill blue">内部多角色桌面 Web</span><h2 style="font-size:28px;margin-top:18px">进入 Hotspot Monitor</h2><p class="sub">登录后按角色进入我的响应台或全局运营台；没有对象权限时只展示最少上下文与申请入口。</p><div class="grid two" style="margin:22px 0"><button class="action selected" onclick="state.role='小陈（内容运营）';go('response')"><b>小陈</b><p>内容候选选择、手动发布与链接回填</p></button><button class="action" onclick="state.role='小周（增长负责人）';go('global')"><b>小周</b><p>全局运营、Opportunity 与 Task Plan</p></button></div><button class="primary" onclick="go('response')">以当前角色登录</button> <button class="secondary" onclick="modal('权限申请','请求访问：KOL 批次、连接器配置或业务字典。申请不会自动授予权限。')">申请额外权限</button></section>`),
      response:()=>page('response',`<p class="sub">${state.role} · Phase 0 优先聚焦内容运营，但完整产品入口仍可见。</p><h2>现在需要你处理</h2><div class="grid three">${metric('合格触发','T0 + 2m','监管听证会时间变更 · 候选投递还有 3 分钟','amber')}${metric('已投递候选','3','等待人工选择 · 发布链接回填还有 12 分钟','blue')}${metric('例外','1','内部审核目标不可达 · 可重试或更换目标','red')}</div><h2 style="margin-top:24px">本次热点响应链</h2><section class="card pipeline">${['Signal','Candidate','Event','Opportunity','Task Plan','候选投递','选择/回填','Outcome'].map((x,i)=>`<div class="step"><span class="dot ${i>4?'wait':''}"></span>${x}<small>${i===5?'Telegram 内部目标':i===6?'小陈':i===7?'待回收':''}</small></div>`).join('')}</section><h2 style="margin-top:24px">我的待办</h2><section class="card"><table class="table"><tr><th>对象</th><th>状态</th><th>窗口</th><th>下一步</th></tr><tr><td><b>监管听证会快讯</b></td><td><span class="pill blue">3 条候选预检通过</span></td><td>12 分钟</td><td><button class="primary" onclick="go('draft')">选择并发布</button></td></tr><tr><td><b>市场异动解释串</b></td><td><span class="pill amber">已选择，待链接回填</span></td><td>4 分钟</td><td><button class="secondary" onclick="go('receipt')">回填链接</button></td></tr></table></section>`),
      global:()=>page('global',`<p class="sub">完整产品首页 · 展示 M1—M5 与四类行动的真实状态；未启用能力不伪造进度。</p><div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr))">${metric('M1 新候选','28','3 个例外待处理')}${metric('M2 重点事件','12','2 个接近窗口')}${metric('M3 待决策','7','Opportunity 等待决定','amber')}${metric('M4 行动中','34','四渠道任务 / 回执')}${metric('M5 待复盘','9','2 条口径冲突','purple')}</div><h2 style="margin-top:24px">四类行动进度</h2><div class="grid four"><article class="card blue click" onclick="go('draft')"><h3>内容发布</h3><p>待选择 3 · 待交接 5 · 发布中 7</p></article><article class="card green click" onclick="go('tasks')"><h3>私域触达</h3><p>待审核 3 · Bot 发送 6 · 部分成功 1</p></article><article class="card amber click" onclick="go('tasks')"><h3>营销活动</h3><p>待方案审核 2 · 待承接 2 · 进行中 4</p></article><article class="card purple click" onclick="go('tasks')"><h3>KOL 合作</h3><p>待批准 2 · 首封中 3 · 回复待确认 5</p></article></div><h2 style="margin-top:24px">跨模块风险与异常</h2><section class="card"><div class="row"><span class="pill amber">响应窗口不足 · 2 Event</span><span class="pill red">Telegram 部分发送失败 · 1 目标</span><span class="pill amber">Task Receipt 延迟 · 4 任务</span><span class="pill red">高风险草稿待风控 · 3 份</span><button class="link" onclick="go('exception')">进入异常中心 →</button></div></section>`),
      radar:()=>page('radar',`<p class="sub">原始 Signal 视图：热度与排名是发现线索，不能被表达为事实。</p><section class="card toolbar"><div class="row"><button class="secondary">X ▾</button><button class="secondary">5 个地区 ▾</button><button class="secondary">全部主题 ▾</button><button class="secondary">过去 60 分钟 ▾</button></div><span class="pill green">X 成功采集：2 分钟前</span></section><div class="grid two" style="margin-top:16px"><section class="card"><h2>Top 10 热点</h2><table class="table"><tr><th>排名</th><th>原始信号</th><th>热度 / 变化</th><th></th></tr>${['监管听证会时间变更','BTC 波动与宏观数据','预测市场政策讨论','平台产品公告','链上安全事件'].map((x,i)=>`<tr><td>#${i+1}</td><td><b>${x}</b><br><span class="muted">X · ${i%2?'EU / SG':'US / SG'} · 原始 Signal</span></td><td>${9.4-i*.5} · +${42-i*6}%</td><td><button class="link" onclick="${i?'go(\'candidate\')':'go(\'event\')'}">查看 →</button></td></tr>`).join('')}</table></section><aside class="card"><h2>热度与跨区域扩散</h2><div class="chart">${[30,42,54,70,94,82].map((h,i)=>`<i class="${i>3?'hot':''}" data-t="${10+i*10}:00" style="height:${h}%"></i>`).join('')}</div><p><span class="pill amber">监测提示</span></p><p class="sub">官方议程 Evidence 在 10:40 出现；事件置信度须在 Event 中依据 Fact/Evidence 判断。</p><h3>来源健康度</h3><p class="sub">X 正常 · 新闻延迟 14 分钟 · 预测市场正常</p></aside></div>`),
      candidate:()=>page('candidate',`<p class="sub">只处理系统标记的归并或上下文例外；正常合格触发自动形成或更新 Candidate。</p><section class="card"><table class="table"><tr><th>Candidate</th><th>系统标记</th><th>下游影响</th><th>操作</th></tr><tr><td><b>CE-443 监管听证会时间变更</b><br><span class="muted">3 个 Signal · 关联 Event EV-1842</span></td><td><span class="pill amber">疑似重复 86%</span></td><td>1 Event · 1 Opportunity</td><td><button class="primary" onclick="openMerge()">比较并处置</button></td></tr><tr><td><b>CE-444 嘉宾名单更新</b></td><td><span class="pill amber">上下文冲突</span></td><td>Event Fact 待确认</td><td><button class="secondary" onclick="audit('校正上下文')">校正上下文</button></td></tr></table></section><section class="card" style="margin-top:16px"><h2>处置审计</h2><p class="sub">${state.candidateAudit.length?state.candidateAudit.join('；'):'尚无人工例外处置。'}</p></section>`),
      future:()=>page('future',`<p class="sub">预计事件、监测窗口和预案；启动只形成 Candidate/Event 上下文，不会直接生成渠道行动。</p><div class="grid two"><section class="card"><h2>近期事件与监测窗口</h2><div class="chart">${[24,55,82,32,62,35].map((h,i)=>`<i class="${i===2?'hot':''}" data-t="8/${12+i}" style="height:${h}%"></i>`).join('')}</div><p style="margin-top:36px"><b>8/14 监管听证会：</b>前监测 24h · 中监测 4h · 后监测 8h</p><button class="primary" onclick="state.futureStarted=true;render()">手动提前启动（留痕）</button></section><aside class="card"><h2>监管听证会</h2><p><span class="pill green">预案已就绪</span></p><p>负责人：小林<br>预计：8/14 14:00 UTC<br>实时匹配：2 Signal / 1 Candidate</p><p class="note">${state.futureStarted?'已手动提前启动：只更新 Candidate/Event 上下文。':'自动窗口已开启；可在有明确依据时提前启动。'}</p><button class="secondary" onclick="go('event')">查看关联 Event</button></aside></div>`),
      scope:()=>page('scope',`<p class="sub">管理来源、地区、主题、关键词、阈值和提醒规则；不修改历史 Signal 或补发既往触发。</p><section class="card"><table class="table"><tr><th>规则</th><th>范围</th><th>最近命中</th><th>版本</th><th></th></tr><tr><td><b>HS-07 高优先级趋势</b></td><td>X · 5 地区 · 政策/市场</td><td>10:18 · CE-443</td><td>v12</td><td><button class="secondary" onclick="modal('测试 Signal','以样例 Signal 预览命中结果：会形成 Candidate，并不会把 Signal 当作事实。')">测试</button></td></tr><tr><td><b>FE-03 未来事件匹配</b></td><td>官方日程 + 监管词</td><td>8/14 Event</td><td>v4</td><td><button class="secondary" onclick="go('future')">查看未来事件</button></td></tr></table><div class="toolbar"><span class="sub">紧急变更仍需理由并保留回滚版本。</span><button class="primary" onclick="modal('发布规则版本','将显示影响范围和生效时间；该原型不持久化规则变更。')">发布新版本</button></div></section>`),
      event:()=>page('event',`<div class="toolbar"><div><span class="pill green">置信度 88% · 高</span> <span class="pill amber">响应窗口 42 分钟</span></div><button class="primary" onclick="go('opportunity')">进入 Opportunity</button></div><p class="sub">事件是什么、置信度、Evidence、窗口与热度监测必须同时可见；热度不替代事实状态。</p><div class="grid two"><section class="card"><h2>Event Card · 监管听证会时间变更</h2><p class="note"><b>已确认 Fact：</b>听证会提前至 8 月 14 日 14:00 UTC。<br><button class="link" onclick="modal('Evidence：美国参议院官方日程','一手来源 · 采集于 10:38 UTC · 支持该 Fact · 可在生产系统打开原文。')">查看来源、可信等级与采集时间 →</button></p><p class="note" style="border-color:#b86400;background:#fff5df"><b>待确认：</b>嘉宾名单两个版本冲突；含嘉宾立场的交付物会被阻止通过。<br><button class="link" onclick="modal('Evidence 冲突','官方议程支持；主办方社媒质疑。需要等待官方更新或风控定义使用边界。')">查看支持/质疑 Evidence →</button></p></section><aside class="card"><h2>事件监测</h2><div class="chart">${[28,38,51,63,96,80].map((h,i)=>`<i class="${i>3?'hot':''}" data-t="${10+i*10}:00" style="height:${h}%"></i>`).join('')}</div><p style="margin-top:34px" class="sub">跨 3 地区加速 · 关键节点：官方日程更新、窗口调整</p></aside></div>`),
      opportunity:()=>page('opportunity',`<p class="sub">先决定是否整体响应这个热点，再进入 Task Plan 选择四类渠道；这里不是逐渠道参与决定。</p><div class="grid three">${metric('受众匹配','高','Predx 用户与政策受众重合','blue')}${metric('目标价值','高','认知、活跃、社群讨论','purple')}${metric('品牌风险','中','嘉宾立场需排除','amber')}</div><section class="card" style="margin-top:18px"><h2>热点整体响应决定</h2><div class="row">${['优先参与','参与','观察','不参与'].map(x=>`<button class="${state.opportunity===x?'primary':'secondary'}" onclick="setOpportunity('${x}')">${x}</button>`).join('')}</div><p class="note">当前：<b>${state.opportunity}</b>。参与/优先参与才可进入 Task Plan；观察需要设置重评时间；不参与需要记录原因并进入复盘。</p><div class="toolbar"><button class="secondary" onclick="modal('AI 建议依据','Event Card v3、窗口 42 分钟、受众匹配与风险政策 RP-04。建议优先参与。')">查看 AI 依据</button><button class="primary" onclick="enterPlan()">继续到 Task Plan</button></div></section>`),
      plan:()=>page('plan',`<p class="sub">Opportunity：${state.opportunity} · 计划 v${state.planVersion}。在这里选择渠道组合；取消有关联的渠道将先显示影响与重规划。</p><section class="grid two">${channel('content','内容发布','3 条候选 · 低风险 · 18 分钟内选择','无依赖')}${channel('community','私域触达','2 条群消息 · 需社群运营审核','依赖：内容首条')}${channel('campaign','营销活动','1 个活动提案 · 资源待确认','替代承接：内容 + 私域')}${channel('kol','KOL 合作','20 位候选 · 首封需渠道/风控批准','依赖：内容事实引用')}</section><section class="card amber" style="margin-top:16px"><h2>依赖与影响分析</h2><p>${state.channels.kol==='拟取消'?'KOL 拟取消：内容覆盖 KPI、私域引流预期将受影响，结果为“需重规划”；已审核、已交接或已发布交付物不会被静默替换。':'四类行动当前无拟议取消；依赖以共享核心信息、CTA、资源和窗口明确表达。'}</p><div class="toolbar"><button class="secondary" onclick="modal('计划 v4 → v5 差异','按渠道对比选入/取消、依赖、交付物和预期结果；可确认、继续重规划或放弃变更。')">查看版本差异</button><button class="primary" onclick="confirmPlan()">确认渠道组合并生成交付物</button></div></section>`),
      tasks:()=>page('tasks',`<p class="sub">统一队列可看见四类行动进度；具体审核、交接与回执进入对象工作区。</p><div class="grid four">${[['内容发布','待选择 3 · 待交接 5','draft','blue'],['私域触达','Bot 发送 6 · 部分成功 1','receipt','green'],['营销活动','待负责人承接 2','draft','amber'],['KOL 合作','首封中 3 · 回复待确认 5','receipt','purple']].map(([a,b,c,d])=>`<article class="card ${d} click" onclick="go('${c}')"><h3>${a}</h3><p>${b}</p></article>`).join('')}</div><section class="card" style="margin-top:18px"><h2>当前任务</h2><table class="table"><tr><th>类型</th><th>Action Task</th><th>状态</th><th>责任人</th><th></th></tr><tr><td>内容发布</td><td>监管听证会快讯</td><td><span class="pill amber">${state.task}</span></td><td>小陈</td><td><button class="link" onclick="go('receipt')">查看交接 →</button></td></tr><tr><td>私域触达</td><td>市场异动更新</td><td><span class="pill green">进行中</span></td><td>Telegram Bot</td><td><button class="link" onclick="go('receipt')">查看回执 →</button></td></tr><tr><td>KOL 合作</td><td>首封触达批次</td><td><span class="pill red">异常</span></td><td>渠道运营</td><td><button class="link" onclick="go('exception')">处理异常 →</button></td></tr></table></section>`),
      draft:()=>page('draft',`<p class="sub">PG-11 · 普通内容走“预检候选 → 人工选择 → 手动发布交接”；高风险及其他渠道草稿走各自审核/修订流程。</p><div class="grid two"><section class="card"><h2>社媒内容 · 至少三条候选</h2>${['候选 A','候选 B','候选 C'].map((x,i)=>`<button class="action ${state.selectedContent===x?'selected':''}" style="width:100%;margin:7px 0" onclick="state.selectedContent='${x}';render()"><b>${x}${i===0?' · 快讯':''}</b><p>${i===0?'美国参议院加密监管听证会已提前举行，市场正在重新定价监管时间表。':i===1?'用三个问题理解时间变化与相关市场信号。':'先看事实、来源与市场变化，再参与讨论。'}</p><span class="pill green">事实 6/6 · 来源完整 · 风险规则通过</span></button>`).join('')}</section><aside class="card"><h2>选择与发布交接</h2><p><span class="pill green">规则预检通过</span></p><p class="sub">这不等同于人工审核、社媒发布成功或平台回执。</p><p>选择：<b>${state.selectedContent}</b><br>发布截止：11 分钟后</p><button class="primary" onclick="handoff()">选择并创建发布交接</button><button class="secondary" onclick="modal('高风险与其他类型','私域消息、营销活动、KOL 首封等草稿需相应审核者通过/需修改/驳回；高风险由品牌/风控审核。')">查看其他类型审核规则</button><p class="note">发布动作在 X 平台手动完成；系统仅回填实际链接并等待独立平台验证。</p></aside></div>`),
      receipt:()=>page('receipt',`<p class="sub">Action Task 与 Task Receipt：缺失回执只能标记延迟，不能自动推定完成、失败或取消。</p><section class="card"><table class="table"><tr><th>主状态</th><th>任务 / 交付物</th><th>交接与专属状态</th><th>最近回执</th><th>下一步</th></tr><tr><td><span class="pill amber">${state.task}</span></td><td><b>社媒｜${state.selectedContent}</b></td><td>小陈手动发布</td><td>${state.receipt}</td><td>${state.task==='待交接'?'<button class="primary" onclick="acceptTask()">确认接收</button>':'<button class="secondary" onclick="publishLink()">回填实际链接</button>'}</td></tr><tr><td><span class="pill blue">已接收</span></td><td><b>私域｜市场异动更新</b></td><td>Telegram Bot 待发送 1/3</td><td>Bot 回执 · 2m</td><td><button class="secondary" onclick="modal('投递记录','内部审核目标与外部运营目标隔离；该任务使用已批准的外部社群目标。')">查看目标</button></td></tr><tr><td><span class="pill red">异常</span></td><td><b>KOL｜首封触达</b></td><td>连接器能力检查失败</td><td>异常 · 4m</td><td><button class="secondary" onclick="go('exception')">人工接管</button></td></tr><tr><td><span class="pill amber">回执延迟</span></td><td><b>营销｜数据回收</b></td><td>等待负责人更新</td><td>最后更新 · 38m</td><td><button class="secondary" onclick="modal('回执延迟','可人工更新、重新分派或升级。不会改写任务为完成。')">升级</button></td></tr></table></section>`),
      outcome:()=>page('outcome',`<p class="sub">结果、口径、归因与策略建议均保留来源、新鲜度与缺失说明；相关性不自动表述为因果。</p><div class="grid three">${metric('传播结果','18.4k','平台只读数据 · 已关联','green')}${metric('产品结果','1,206','产品分析 · 估算关联','blue')}${metric('成本 / 风险','缺口 2','成本口径待补，无法输出精确 ROI','amber')}</div><section class="card" style="margin-top:18px"><h2>复盘与策略建议</h2><p><b>有效因素：</b>官方 Evidence 出现后 20 分钟内完成候选投递与人工选择。</p><p><b>风险：</b>嘉宾名单冲突阻止一个版本进入发布交接。</p><p><span class="pill purple">待批准建议</span> 将“官方议程变化”加入 Monitoring Scope 高优先级触发条件。</p><button class="primary" onclick="modal('受控策略变更','创建指向 Monitoring Scope 的变更建议；目标负责人确认后才会生效。')">批准建议范围</button></section>`),
      exception:()=>page('exception',`<p class="sub">异常必须在对象工作区恢复，关闭通知不等于恢复对象状态。</p><section class="card red"><h2>Telegram 候选投递部分失败</h2><p>对象：监管听证会快讯 · 影响：1 个内部审核目标不可达 · 剩余窗口：12 分钟</p><p>可重试、切换已批准的内部目标或升级；不得把内部审核目标转换成外部社群目标。</p><button class="primary" onclick="state.connector='Telegram 内部审核目标已重试成功';render()">重试投递</button> <button class="secondary" onclick="go('connector')">更换批准目标</button></section><section class="card" style="margin-top:16px"><h2>KOL 首封连接器失败</h2><p>外部平台能力检查未通过，已阻止自动化交接；可导出名单、人工发送或升级渠道负责人。</p><button class="secondary" onclick="modal('人工接管','人工接管记录会保留失败步骤、责任人和下一回执期望时间。')">人工接管</button></section>`),
      dictionary:()=>page('dictionary',`<p class="sub">来源、渠道、受众、风险和指标的共享定义；历史引用不可硬删除，只能弃用或建立替代映射。</p><section class="card"><table class="table"><tr><th>条目</th><th>类别</th><th>所有者</th><th>引用</th><th>状态</th></tr><tr><td>官方一手来源</td><td>来源</td><td>数据团队</td><td>34 Fact</td><td><span class="pill green">启用</span></td></tr><tr><td>Telegram 外部社群目标</td><td>渠道</td><td>渠道运营</td><td>8 Action Task</td><td><span class="pill green">启用</span></td></tr><tr><td>品牌风险 RP-04</td><td>风险</td><td>品牌/风控</td><td>17 Draft</td><td><span class="pill green">启用</span></td></tr></table><div class="toolbar"><span class="sub">变更会展示引用影响与替代项。</span><button class="primary" onclick="modal('新增字典条目','原型中仅展示表单入口；生产实现必须保存所有者、版本与审计理由。')">新增条目</button></div></section>`),
      connector:()=>page('connector',`<p class="sub">连接器、内部审核目标、外部运营目标和授权状态分开管理；本页不直接发布任何内容。</p><section class="card"><table class="table"><tr><th>类型</th><th>目标</th><th>状态</th><th>最近结果</th><th></th></tr><tr><td><span class="pill blue">内部审核目标</span></td><td>Telegram · 内容运营审核群</td><td><span class="pill green">已批准</span></td><td>${state.connector}</td><td><button class="secondary" onclick="state.connector='目标验证成功';render()">验证</button></td></tr><tr><td><span class="pill green">外部运营目标</span></td><td>Telegram · 市场异动社群</td><td><span class="pill green">已批准</span></td><td>Bot 发送 2/3</td><td><button class="secondary" onclick="modal('授权与撤销','仅连接器管理员可变更，且所有操作保留审计记录。')">授权/撤销</button></td></tr><tr><td><span class="pill purple">协作文档</span></td><td>Google Docs · 营销活动提案</td><td><span class="pill amber">待验证</span></td><td>无</td><td><button class="secondary" onclick="modal('目标验证','验证不会自动使草稿通过，也不会代替任务交接。')">验证</button></td></tr></table></section>`)
    };
    const channel=(id,title,detail,dependency)=>`<button class="action ${state.channels[id]==='已选入'?'selected':state.channels[id]==='拟取消'?'pending':''}" onclick="toggleChannel('${id}')"><div class="toolbar"><b>${title}</b><span class="pill ${state.channels[id]==='已选入'?'green':state.channels[id]==='拟取消'?'amber':''}">${state.channels[id]}</span></div><p>系统建议：${id==='campaign'?'未建议启用':'建议启用'}</p><p>${detail}</p><small class="muted">${dependency}</small></button>`;
    const setOpportunity=x=>{state.opportunity=x;render()};
    const enterPlan=()=>{if(['参与','优先参与'].includes(state.opportunity))go('plan');else modal('尚未进入 Task Plan',state.opportunity==='观察'?'请设置重评时间；到期后回到 Opportunity 决策。':'不参与须记录原因并进入复盘。')};
    const toggleChannel=id=>{state.channels[id]=state.channels[id]==='已选入'?(id==='kol'?'拟取消':'未选入'):'已选入';render()};
    const confirmPlan=()=>{state.planVersion++;modal('已确认 Task Plan','已生成计划 v'+state.planVersion+'。已选渠道会生成相应交付物草稿；拟取消 KOL 会建立“计划变更待复核”，不静默替换已存在的交付物。')};
    const audit=x=>{state.candidateAudit.unshift(new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'：'+x+'（小林，已填写理由）');render()};
    const openMerge=()=>modal('OV-04A：合并 / 拆分比较',`<p>并排比较 CE-443 与 CE-444 的时间、地区、主题、根 Signal、关联 Future Event、当前 Event 与系统依据。原始 Signal 不可删除。</p><div class="row"><button class="primary" onclick="closeModal();audit('合并 Candidate，保留 CE-443')">合并并留痕</button><button class="secondary" onclick="closeModal();audit('拆分 Candidate，建立两个上下文')">拆分并留痕</button><button class="secondary" onclick="closeModal()">保留系统建议</button></div>`);
    const handoff=()=>{state.task='待交接';state.receipt='尚无（仅规则预检）';go('receipt')};
    const acceptTask=()=>{state.task='已接收';state.receipt='小陈接收 · 刚刚';render()};
    const publishLink=()=>{state.task='进行中';state.receipt='人工链接已回填 · 等待平台验证';render()};
    document.querySelectorAll('.nav').forEach(button=>button.addEventListener('click',()=>go(button.dataset.page)));
    document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
  </script>
</body>
</html>
